    async function submitYtCookiesUpload(fileOverride) {
        if (ytCookiesUploading) return;
        var f = fileOverride || (ytCookiesFileEl && ytCookiesFileEl.files && ytCookiesFileEl.files[0]);
        if (!f) {
            setYtCookiesMsg('Выберите файл cookies.txt.', true);
            return;
        }
        ytCookiesUploading = true;
        setYtCookiesDropzoneLoading(true, 'Загрузка…');
        setYtCookiesMsg('', false);
        try {
            var fd = new FormData();
            fd.append('file', f, f.name || 'cookies.txt');
            var r = await fetch(ytCookiesUploadUrl, { method: 'POST', body: fd, credentials: 'same-origin' });
            var d = await r.json().catch(function () { return {}; });
            if (d && d.ok) {
                applyYtCookiesStatusUi(d);
                resetYtCookiesDropzoneUi();
            } else {
                setYtCookiesMsg((d && d.message) ? d.message : 'Ошибка сохранения.', true);
            }
        } catch (e) {
            setYtCookiesMsg(String(e && e.message ? e.message : e), true);
        } finally {
            ytCookiesUploading = false;
            setYtCookiesDropzoneLoading(false);
        }
    }

        var html = '';
        if (active) {
            html += '<code class="rewrite-youtube-proxy-modal__footer-code" id="rewrite-youtube-proxy-saved-code">'
                + ytProxyMsgEscapeHtml(active) + '</code>';
        }
        var testMsg = (d.last_test_message != null) ? String(d.last_test_message).trim() : '';
        if (d.last_test_ok === false) {
            if (html) html += ' - ';
            html += '<span class="rewrite-youtube-proxy-modal__footer-test rewrite-youtube-proxy-modal__footer-test--bad">Проверка не прошла</span>';
        } else if (testMsg) {
            if (html) html += ' - ';
            html += '<span class="rewrite-youtube-proxy-modal__footer-test">Проверка: '
                + ytProxyMsgFormatHtml(testMsg, false) + '</span>';
        }
        if (d.env_overrides_file && fileOnly && fileOnly !== active) {
            html += '<span class="rewrite-youtube-proxy-modal__footer-hint"> · в файле: '
                + ytProxyMsgEscapeHtml(fileOnly) + '</span>';
        }
        return html;
    }

        renderYtProxyFooterLine(d);
        var ledMod = 'idle';
        var msg = (d && d.last_test_message) ? String(d.last_test_message) : '';
        var tooltip;
        if (d && d.test_ok === true) {
            ledMod = 'ok';
            tooltip = String(d.test_message || msg || 'Прокси отвечает.');
        } else if (d && d.test_ok === false) {
            ledMod = 'bad';
            tooltip = String(d.test_message || msg || 'Проверка не удалась.');
        } else if (d && d.env_overrides_file) {
            ledMod = 'env';
            tooltip = 'Сейчас используется YT_DLP_PROXY из .env (приоритет над файлом). ' + msg;
        } else if (d && d.last_test_ok === true) {
            ledMod = 'ok';
            tooltip = msg || 'Прокси проверен — соединение с YouTube есть.';
        } else if (d && d.last_test_ok === false) {
            ledMod = 'bad';
            tooltip = msg || 'Последняя проверка не удалась.';
        } else {
            ledMod = 'idle';
            tooltip = msg || 'Прокси ещё не настроен — нажмите, чтобы добавить.';
        }
        var ledClasses = [
            'rewrite-youtube-icon-led--ok',
            'rewrite-youtube-icon-led--bad',
            'rewrite-youtube-icon-led--env',
        ];
        if (ytProxyLedEl) {
            ledClasses.forEach(function (c) { ytProxyLedEl.classList.remove(c); });

    function ytProxyMsgEscapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function ytProxyMsgFormatHtml(text, isError) {
        var s = ytProxyMsgEscapeHtml(text);
        if (isError) return s;
        return s.replace(/\bHTTP\s+(\d{3})\b/g, function (_m, code) {
            var n = parseInt(code, 10);
            var cls = (n >= 200 && n < 300) ? 'rewrite-youtube-proxy-msg__http-ok'
                : (n >= 400) ? 'rewrite-youtube-proxy-msg__http-bad' : '';
            if (!cls) return 'HTTP ' + code;
            return 'HTTP <span class="' + cls + '">' + code + '</span>';
        });
    }

    async function submitYtProxySave() {
        if (ytProxySaving) return;
        var raw = ytProxyInputEl ? String(ytProxyInputEl.value || '').trim() : '';
        ytProxySaving = true;
        setYtProxyMsg('', false);
        if (ytProxySavedLineEl) {
            ytProxySavedLineEl.classList.remove('rewrite-youtube-proxy-modal__footer--empty');
            ytProxySavedLineEl.textContent = 'Сохраняем и проверяем…';
        }
        try {
            var r = await fetch(ytProxySaveUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ proxy: raw }),
            });
            var d = await r.json().catch(function () { return {}; });
            if (!d || !d.ok) {
                renderYtProxyFooterError((d && d.message) ? String(d.message) : 'Ошибка сохранения прокси.');
                return;
            }
            applyYtProxyStatusUi(d);
            ytProxyInputDirty = false;
            if (d.test_ok === true && ytProxyInputEl) ytProxyInputEl.value = '';
        } catch (e) {
            renderYtProxyFooterError(String(e && e.message ? e.message : e));
        } finally {
            ytProxySaving = false;
        }
    }

    /** Доля совпадения текста блока и склейки text сцен (0…100), зеркало _scene_writer_text_match_pct. */
    function sceneWriterTextMatchPct(blockText, mergedText) {
        var a = sceneWriterNormWs(blockText);
        var b = sceneWriterNormWs(mergedText);
        if (!a && !b) return 100;
        if (!b) return 0;
        if (a === b) return 100;
        var n = a.length;
        var m = b.length;
        var matrix = [];
        var i;
        var j;
        for (i = 0; i <= n; i += 1) {
            matrix[i] = [];
            matrix[i][0] = 0;
        }
        for (j = 0; j <= m; j += 1) matrix[0][j] = 0;
        for (i = 1; i <= n; i += 1) {
            for (j = 1; j <= m; j += 1) {
                if (a.charAt(i - 1) === b.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1] + 1;
                } else {
                    matrix[i][j] = Math.max(matrix[i - 1][j], matrix[i][j - 1]);
                }
            }
        }
        var lcs = matrix[n][m];
        return Math.round((2 * lcs / (n + m)) * 1000) / 10;
    }

    function formatSceneWriterMatchPct(pct) {
        if (pct == null || pct === '' || !Number.isFinite(Number(pct))) return '—';
        return formatNumRu(Number(pct)) + '%';

        return status + ' · ' + formatSceneWriterMatchPct(pct);
    }

    function parseStructureSplitterBlocksJson(raw) {

        return [];

    function recomputeSceneWriterBlocksMatchLocal(block) {
        var payload = readSceneWriterCheckFromBlock(block);
        if (!payload || !Array.isArray(payload.blocks_info) || !payload.blocks_info.length) return;
        var ssTa = document.querySelector('.rewrite-stage-card[data-stage-key="structure_splitter"] .rewrite-stage-result');
        var swTa = block.querySelector('.rewrite-stage-result');
        if (!ssTa || !swTa) return;
        var ssBlocks = parseStructureSplitterBlocksJson(ssTa.value || '');
        if (!ssBlocks.length) return;
        var live = computeSceneWriterSummaryFromText(swTa.value || '');
        if (!live) return;
        var sceneCounts = payload.blocks_info.map(function (r) { return Number(r.scenes || 0); });
        var allScenes = [];
        var lines = String(swTa.value || '').split(/\r?\n/);
        var current = null;
        function flushScene() {
            if (current && current.scene_id) allScenes.push(current);
        }
        for (var i = 0; i < lines.length; i += 1) {
            var ln = lines[i].trim();
            if (!ln) continue;
            var obj;
            try { obj = JSON.parse(ln); } catch (e) { continue; }
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'scene_id')) {
                flushScene();
                current = { scene_id: obj.scene_id, text: '' };
                continue;
            }
            if (!current) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'text')) {
                current.text = String(obj.text == null ? '' : obj.text);
            }
        }
        flushScene();
        var offset = 0;
        var newRows = [];
        for (var bi = 0; bi < ssBlocks.length; bi += 1) {
            var n = sceneCounts[bi] || 0;
            var partScenes = allScenes.slice(offset, offset + n);
            offset += n;
            var partMerged = partScenes.map(function (sc) { return String(sc.text || ''); }).join('\n');
            var blk = ssBlocks[bi] || {};
            var blockText = String(blk.text || blk.block_text || '');
            var matchPct = sceneWriterTextMatchPct(blockText, partMerged);
            var ok = sceneWriterNormWs(partMerged) === sceneWriterNormWs(blockText);
            var prev = payload.blocks_info[bi] || {};
            newRows.push({
                index: Number(prev.index || (bi + 1)),
                block_chars: blockText.length,
                merged_chars: partMerged.length,
                scenes: partScenes.length,
                with_start: Number(prev.with_start || 0),
                with_end: Number(prev.with_end || 0),
                with_video: Number(prev.with_video || 0),
                avg_scene_chars: partScenes.length
                    ? Math.round((partMerged.replace(/\n/g, '').length / partScenes.length) * 10) / 10
                    : 0,
                match_pct: matchPct,
                ok: ok
            });
        }
        payload.blocks_info = newRows;
        var weight = 0;
        var matchSum = 0;
        for (var ri = 0; ri < newRows.length; ri += 1) {
            var w = Number(newRows[ri].block_chars || 0);
            weight += w;
            matchSum += Number(newRows[ri].match_pct || 0) * w;
        }
        payload.summary.match_pct = weight > 0 ? Math.round((matchSum / weight) * 10) / 10 : (payload.summary.ok ? 100 : 0);
        payload.summary.ok = newRows.length > 0 && newRows.every(function (r) { return !!r.ok; });
        try {
            block.setAttribute('data-scene-writer-check-json', JSON.stringify(payload));
        } catch (e) { /* ignore */ }
    }

    /**
     * Парсит текст результата Scene Writer (line-delimited JSON) и собирает счётчики
     * для верхней «Проверка Scene Writer»: scenes / with_start / with_end / with_video /
     * avg_scene_chars. Возвращает null, если в тексте нет ни одной валидной сцены.
     * Зеркало серверного parse_scene_blocks + _scene_writer_block_check (по сцене).
     */
    function computeSceneWriterSummaryFromText(rawText) {
        var text = String(rawText || '');
        if (!text.trim()) return null;
        var lines = text.split(/\r?\n/);
        var current = null;
        var scenes = [];
        function flush() {
            if (current && current.scene_id) scenes.push(current);
        }
        for (var i = 0; i < lines.length; i += 1) {
            var ln = lines[i].trim();
            if (!ln) continue;
            var obj;
            try { obj = JSON.parse(ln); } catch (e) { continue; }
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'scene_id')) {
                flush();
                current = { scene_id: obj.scene_id, text: '', start: null, end: null, video: null };
                continue;
            }
            if (!current) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'text')) {
                current.text = String(obj.text == null ? '' : obj.text);
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'start') && obj.start && typeof obj.start === 'object') {
                current.start = obj.start;
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'end') && obj.end && typeof obj.end === 'object') {
                current.end = obj.end;
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'video') && obj.video && typeof obj.video === 'object') {
                current.video = obj.video;
                continue;
            }
        }
        flush();
        if (!scenes.length) return null;
        var withStart = 0;
        var withEnd = 0;
        var withVideo = 0;
        var charTotal = 0;
        for (var k = 0; k < scenes.length; k += 1) {
            var s = scenes[k];
            charTotal += String(s.text || '').length;
            if (s.start && String((s.start.prompt || '')).trim()) withStart += 1;
            if (s.end && String((s.end.prompt || '')).trim()) withEnd += 1;
            if (s.video && String((s.video.prompt || '')).trim()) withVideo += 1;
        }
        return {
            scenes: scenes.length,
            with_start: withStart,
            with_end: withEnd,
            with_video: withVideo,
            avg_scene_chars: scenes.length ? Math.round((charTotal / scenes.length) * 10) / 10 : 0
        };
    }

    /**
     * Пересчитывает локально счётчики Scene Writer проверки при правках в Result.
     * blocks_info / responses / blocks остаются как пришли с сервера, обновляются:
     * scenes, with_start, with_end, with_video, avg_scene_chars.
     */
    function recomputeSceneWriterCheckLocal(block) {
        if (!block) return;
        var ta = block.querySelector('.rewrite-stage-result');
        if (!ta) return;
        var live = computeSceneWriterSummaryFromText(ta.value || '');
        var payload = readSceneWriterCheckFromBlock(block);

            if (!live) {
                renderSceneWriterCheck(block, null);
                return;
            }
            payload = {
                summary: {
                    blocks: 0,
                    responses: 0,
                    ok: false,
                    scenes: 0,
                    with_start: 0,
                    with_end: 0,
                    with_video: 0,
                    avg_scene_chars: 0
                },
                blocks_info: []
            };
        }
        try {
            recomputeSceneWriterBlocksMatchLocal(block);
            payload = readSceneWriterCheckFromBlock(block) || payload;
        } catch (e) { /* ignore */ }
        if (live) {
            payload.summary.scenes = live.scenes;
            payload.summary.with_start = live.with_start;
            payload.summary.with_end = live.with_end;
            payload.summary.with_video = live.with_video;
            payload.summary.avg_scene_chars = live.avg_scene_chars;
        } else {
            payload.summary.scenes = 0;
            payload.summary.with_start = 0;
            payload.summary.with_end = 0;
            payload.summary.with_video = 0;
            payload.summary.avg_scene_chars = 0;
        }
        try {
            block.setAttribute('data-scene-writer-check-json', JSON.stringify(payload));

        renderSceneWriterCheck(block, payload);
    }

    function tryBuildStructureSplitterCheckFromCurrentValues() {

            if (Array.isArray(parsed)) blocks = parsed.filter(function (x) { return x && typeof x === 'object'; });
            else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.blocks)) blocks = parsed.blocks.filter(function (x) { return x && typeof x === 'object'; });
        } catch (e) { return null; }
        var joined = blocks.map(function (b) { return String((b || {}).text || ''); }).join('');
        var inputCompact = inputText.replace(/\s+/g, '');
        var outputCompact = joined.replace(/\s+/g, '');
        var deltaChars = joined.length - inputText.length;
        return {
            summary: {
                blocks: blocks.length,
                input_chars: inputText.length,
                output_chars: joined.length,
                delta_chars: deltaChars,
                delta_compact_chars: outputCompact.length - inputCompact.length,
                ok: structureSplitterCheckOk({
                    blocks: blocks.length,
                    output_chars: joined.length,
                    delta_chars: deltaChars
                }),
                ok_compact: inputCompact.length === outputCompact.length
            }
        };
    }

    function parseEditedPayload(raw) {
        var txt = String(raw || '').trim();
        if (!txt) return { editedText: '', changesCount: 0, uniqueTypesCount: 0, hasEditedField: false, hasChangesField: false };
        try {
            var obj = JSON.parse(txt);
            if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
                var et = '';

    function _stripMarkdownJsonFence(raw) {
        var s = String(raw || '').trim();
        if (s.indexOf('```') !== 0) return s;
        var m = s.match(/^```[a-zA-Z0-9_-]*\s*\n([\s\S]*?)\n?```$/);
        return m ? m[1].trim() : s.replace(/^```+|```+$/g, '').trim();

    function _extractJsonObjectSubstring(raw) {
        var s = _stripMarkdownJsonFence(raw);
        if (!s) return '';
        var first = s.indexOf('{');
        var last = s.lastIndexOf('}');
        if (first !== -1 && last !== -1 && last > first) return s.slice(first, last + 1).trim();
        return s;

    function _repairJsonStringDelimiterTypos(text) {
        return String(text || '').replace(/("(?:[^"\\]|\\.)*)'(\s*[,}\]])/g, '$1"$2');

    /** Починка типичных ошибок LLM в JSON-объекте; возвращает { text, repaired, ok }. */

        var original = String(raw || '').trim();
        if (!original) return { text: '', repaired: false, ok: false };
        var candidate = _extractJsonObjectSubstring(original) || original;
        function tryParse(s) {
            try {
                var o = JSON.parse(s);
                return (o && typeof o === 'object' && !Array.isArray(o)) ? o : null;
            } catch (_e) { return null; }
        }
        var obj = tryParse(candidate);
        if (obj) {
            var pretty = JSON.stringify(obj, null, 2) + '\n';
            if (tryParse(original)) return { text: original, repaired: false, ok: true };
            return { text: pretty, repaired: candidate !== original || pretty !== original, ok: true };
        }
        var repaired = _repairJsonTrailingCommas(_repairJsonStringDelimiterTypos(candidate));
        obj = tryParse(repaired);
        if (!obj) return { text: original, repaired: false, ok: false };
        return { text: JSON.stringify(obj, null, 2) + '\n', repaired: true, ok: true };
    }

    function formatYoutubeTitleItem(x) {

        var t = typeof x;
        if (t === 'string' || t === 'number' || t === 'boolean') return String(x);
        if (t === 'object' && !Array.isArray(x)) {
            var order = ['rank', 'title_id', 'id', 'title_en', 'title_ru', 'angle', 'score', 'reason_en', 'reason_ru'];
            var lines = [];
            var seen = {};
            order.forEach(function (k) {
                if (!Object.prototype.hasOwnProperty.call(x, k)) return;
                var val = x[k];
                if (val === '' || val === null || val === undefined) return;
                seen[k] = true;
                lines.push(k + ': ' + String(val));
            });
            Object.keys(x).forEach(function (k) {
                if (seen[k]) return;
                var val = x[k];
                if (val === '' || val === null || val === undefined) return;
                if (typeof val === 'object') {
                    try {
                        lines.push(k + ': ' + JSON.stringify(val));
                    } catch (e) {
                        lines.push(k + ': …');
                    }
                } else {
                    lines.push(k + ': ' + String(val));
                }
            });
            return lines.join('\n');
        }
        try {
            return JSON.stringify(x);
        } catch (e) {
            return String(x);
        }
    }

    function formatYoutubeFinalDescription(val) {

            if (typeof val.body === 'string') return val.body;

            var chunks = [];
            ['en', 'ru'].forEach(function (lang) {
                if (typeof val[lang] === 'string' && val[lang].trim()) chunks.push(val[lang].trim());
            });
            if (chunks.length) return chunks.join('\n\n');
            return formatYoutubeTitleItem(val);
        }
        return String(val);
    }

    function formatYoutubeScoreVal(val) {
        if (val === '' || val == null) return '';
        var sc = Number(val);
        if (!isNaN(sc)) {
            return Math.abs(sc - Math.round(sc)) < 1e-9 ? String(Math.round(sc)) : String(Math.round(sc * 10) / 10);
        }
        return String(val).trim();
    }

    function renderTop5TitleCellHtml(item, index) {

            titleEn = (item.title_en != null ? String(item.title_en) : '').trim();

    /** Только сетка top_5 (без внешней рамки rewrite-scene-writer-check — она на корне превью). */
    function renderTop5TitlesBlocksGridInner(rawTop5) {
        if (!rawTop5.length) return '';
        var colCount = 3;
        var perCol = Math.ceil(rawTop5.length / colCount);
        var html = '<div class="rewrite-scene-writer-check__blocks-grid">';
        for (var c = 0; c < colCount; c += 1) {
            html += '<div class="rewrite-scene-writer-check__blocks-col">';
            var start = c * perCol;
            var end = Math.min(start + perCol, rawTop5.length);
            for (var i = start; i < end; i += 1) {
                html += renderTop5TitleCellHtml(rawTop5[i], i);
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    function normalizeYoutubeHashtags(obj) {
        var v = obj.hashtags;
        function tagToStr(x) {
            if (x == null) return '';
            if (typeof x === 'string') return x.trim();
            if (typeof x === 'object' && x.tag) return String(x.tag).trim();
            if (typeof x === 'object' && x.name) return String(x.name).trim();
            if (typeof x === 'object') return formatYoutubeTitleItem(x).replace(/\n/g, ' ').trim();
            return String(x).trim();
        }
        if (Array.isArray(v)) return v.map(tagToStr).filter(Boolean);
        if (typeof v === 'string') {
            return v.split(/[\s,]+/).map(function (x) { return x.trim(); }).filter(Boolean);
        }
        return [];
    }

    /** Проверка Rewrite: IN = Source, TGT = Duration (символы), OUT = Result. */
    function renderRewriteCheck(block) {
        if (!block) return;
        var wrap = block.querySelector('[data-editor-check]');
        if (!wrap) return;
        var inChars = sourceEl ? (sourceEl.value || '').trim().length : 0;
        var targetChars = targetCharsRangeEl ? clampTargetChars(targetCharsRangeEl.value) : 0;
        var ta = block.querySelector('.rewrite-stage-result');
        var raw = ta ? (ta.value || '') : '';
        var trimmed = raw.trim();
        var isBusy = !!(ta && ta.classList.contains('rewrite-stage-result--busy'));
        var isErr = /^\s*Ошибка:/.test(raw) || !!(ta && ta.classList.contains('rewrite-stage-result--error'));
        var isPending = !trimmed.length || /^pending$/i.test(trimmed);
        var outChars = trimmed.length;
        var hasResponse = !isBusy && !isErr && !isPending && outChars > 0;
        var delta = outChars - inChars;
        var okClass = hasResponse ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
        var headLabel = hasResponse ? 'OK' : (isBusy ? '…' : 'NO');
        var html = '';
        html += '<div class="rewrite-scene-writer-check__head"><strong>Проверка Rewrite</strong> <span class="' + okClass + '">' + headLabel + '</span></div>';
        html += '<div class="rewrite-scene-writer-check__hint rewrite-editor-check-line">';
        html += '<span class="rewrite-editor-check-line__left">IN: <strong>' + formatNumRu(inChars) + '</strong></span>';
        html += '<span class="rewrite-editor-check-line__sep">|</span>';
        html += '<span class="rewrite-editor-check-line__center">TGT: <strong>' + formatNumRu(targetChars) + '</strong></span>';
        html += '<span class="rewrite-editor-check-line__sep">|</span>';
        html += '<span class="rewrite-editor-check-line__right">OUT: <strong>' + formatNumRu(outChars) + '</strong> (' + editorCheckDeltaHtml(delta) + ')</span>';
        html += '</div>';
        wrap.innerHTML = html;
    }

    function refreshRewriteStageCheck() {
        var rwBlock = document.querySelector('.rewrite-stage-card[data-stage-key="rewrite"]');
        if (rwBlock) renderRewriteCheck(rwBlock);
    }

    function renderEditorCheck(block) {
        if (!block) return;
        var wrap = block.querySelector('[data-editor-check]');
        if (!wrap) return;
        var stageKey = block.getAttribute('data-stage-key') || '';
        if (stageKey === 'rewrite') {
            renderRewriteCheck(block);
            return;
        }
        if (stageKey === 'draft1' || stageKey === 'block_writer') {
            renderBlockWriterCheck(block);
            return;
        }
        if (stageKey === 'structure' || stageKey === 'architect') {
            renderArchitectCheck(block);
            return;
        }
        if (stageKey === 'analysis') {
            renderAnalysisCheck(block);
            return;
        }
        if (stageKey === 'title_strategist') {
            var stageLabelTs = STAGE_LABELS[stageKey] || 'Title Strategist';
            var outCharsTs = String((block.querySelector('.rewrite-stage-result') || {}).value || '').trim().length;
            var hasOkTs = outCharsTs > 0;
            var okClassTs = hasOkTs ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
            var htmlTs = '';
            htmlTs += '<div class="rewrite-scene-writer-check__head"><strong>Проверка ' + stageLabelTs + '</strong> <span class="' + okClassTs + '">' + (hasOkTs ? 'OK' : 'NO') + '</span></div>';
            wrap.innerHTML = htmlTs;
            return;
        }
        if (REWRITE_JSON_SPLIT_STAGES[stageKey]) {
            var stageLabelEd = STAGE_LABELS[stageKey] || 'Editor';
            var inCharsEd = 0;
            if (stageKey === 'voiceover_editor') {
                var presetEd = typeof currentRewritePreset === 'string' ? currentRewritePreset : 'deep';
                if (presetEd === 'deep') {
                    var personaBlockEd = document.querySelector('.rewrite-stage-card[data-stage-key="persona_editor"]');
                    var prevRawEd = ((personaBlockEd ? personaBlockEd.querySelector('.rewrite-stage-result') : null) || {}).value || '';
                    var pmPrev = parseVoiceoverEditorModelJson(prevRawEd);
                    inCharsEd = String(pmPrev.text || prevRawEd).trim().length;
                } else if (presetEd === 'soft') {
                    var rewriteResTaEd = document.querySelector('.rewrite-stage-card[data-stage-key="rewrite"] .rewrite-stage-result');
                    var rwRaw = rewriteResTaEd ? String(rewriteResTaEd.value || '') : '';
                    var pmRw = parseVoiceoverEditorModelJson(rwRaw);
                    inCharsEd = String(pmRw.text || rwRaw).trim().length;
                } else {
                    var inboxBlockEd = document.querySelector('.rewrite-stage-card[data-stage-key="inbox"]');
                    var inboxRawEd = ((inboxBlockEd ? inboxBlockEd.querySelector('.rewrite-stage-result') : null) || {}).value || '';
                    var pmIb = parseVoiceoverEditorModelJson(inboxRawEd);
                    inCharsEd = String(pmIb.text || inboxRawEd).trim().length;
                }
            } else {
                var stageIdxEd = STAGE_KEYS_ORDER.indexOf(stageKey);
                if (stageIdxEd <= 0) {
                    wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка ' + stageLabelEd + '</strong> <span class="rewrite-scene-writer-check__wait">нет предыдущего этапа</span></div>';
                    return;
                }
                var prevKeyEd = STAGE_KEYS_ORDER[stageIdxEd - 1];
                var prevBlockEd = document.querySelector('.rewrite-stage-card[data-stage-key="' + prevKeyEd + '"]');
                var prevRawChain = ((prevBlockEd ? prevBlockEd.querySelector('.rewrite-stage-result') : null) || {}).value || '';
                var pmPrev2 = parseVoiceoverEditorModelJson(prevRawChain);
                inCharsEd = String(pmPrev2.text || prevRawChain).trim().length;
            }
            var currResRawEd = ((block.querySelector('.rewrite-stage-result')) || {}).value || '';
            var edState = parseVoiceoverEditorState(block, currResRawEd);
            var outCharsEd = String(edState.editedText || '').trim().length;
            var changesTaEd = block.querySelector('.rewrite-stage-changes');
            var changesRawEd = changesTaEd ? String(changesTaEd.value || '').trim() : '';
            var hasOkEd = outCharsEd > 0 && changesRawEd.length > 0;
            var deltaEd = outCharsEd - inCharsEd;
            var okClassEd = hasOkEd ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
            var htmlEd = '';
            htmlEd += '<div class="rewrite-scene-writer-check__head"><strong>Проверка ' + stageLabelEd + '</strong> <span class="' + okClassEd + '">' + (hasOkEd ? 'OK' : 'NO') + '</span></div>';
            htmlEd += '<div class="rewrite-scene-writer-check__hint rewrite-editor-check-line">';
            htmlEd += '<span class="rewrite-editor-check-line__left">IN: <strong>' + formatNumRu(inCharsEd) + '</strong></span>';
            htmlEd += '<span class="rewrite-editor-check-line__sep">|</span>';
            htmlEd += '<span class="rewrite-editor-check-line__center">OUT: <strong>' + formatNumRu(outCharsEd) + '</strong> (' + editorCheckDeltaHtml(deltaEd) + ')</span>';
            htmlEd += '<span class="rewrite-editor-check-line__sep">|</span>';
            htmlEd += '<span class="rewrite-editor-check-line__right">Changes: <strong>' + formatNumRu(edState.changesCount) + '</strong></span>';
            htmlEd += '</div>';
            wrap.innerHTML = htmlEd;
            return;
        }
        var stageIdx = STAGE_KEYS_ORDER.indexOf(stageKey);
        if (stageIdx <= 0) {
            wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="rewrite-scene-writer-check__wait">нет предыдущего этапа</span></div>';
            return;
        }
        var prevKey = STAGE_KEYS_ORDER[stageIdx - 1];
        var prevBlock = document.querySelector('.rewrite-stage-card[data-stage-key="' + prevKey + '"]');
        var prevParsed = parseEditedPayload(((prevBlock ? prevBlock.querySelector('.rewrite-stage-result') : null) || {}).value || '');
        var currParsed = parseEditedPayload(((block.querySelector('.rewrite-stage-result')) || {}).value || '');
        if (!currParsed.editedText && !prevParsed.editedText) {
            wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="rewrite-scene-writer-check__wait">ожидание данных</span></div>';
            return;
        }
        var inChars = prevParsed.editedText.length;
        var outChars = currParsed.editedText.length;
        var delta = outChars - inChars;
        var ok = inChars === outChars;
        var okClass = ok ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
        var deltaStr = formatNumRuSigned(delta);
        var html = '';
        html += '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="' + okClass + '">' + (ok ? 'OK' : ('NO (' + deltaStr + ')')) + '</span></div>';
        html += '<div class="rewrite-scene-writer-check__grid">';
        html += '<div>Вход: <strong>' + formatNumRu(inChars) + '</strong></div>';
        html += '<div>Выход: <strong>' + formatNumRu(outChars) + '</strong></div>';
        html += '<div>Блоков в changes: <strong>' + formatNumRu(currParsed.changesCount) + '</strong></div>';
        html += '<div>Правок: <strong>' + formatNumRu(currParsed.changesCount) + '</strong></div>';
        html += '</div>';
        wrap.innerHTML = html;
    }

    /** Источники данных этапа (зеркало _validate_stage_input_sources в rewrite_pipeline.py). */
    function stageInputSourcesReady(stageKey, byKey) {
        var preset = currentRewritePreset || 'deep';
        if (stageKey === 'inbox') return true;

        if (stageKey === 'analysis') {
            return !!(sourceEl && String(sourceEl.value || '').trim());
        }
        if (stageKey === 'structure') {
            return stageLastResultNonEmpty(byKey, 'analysis');
        }
        if (stageKey === 'draft1') {
            return stageLastResultNonEmpty(byKey, 'analysis') && stageLastResultNonEmpty(byKey, 'structure');
        }
        if (stageKey === 'retention_editor') {
            return stageLastResultNonEmpty(byKey, 'draft1');
        }
        if (stageKey === 'hook_editor') {
            return stageLastResultNonEmpty(byKey, 'retention_editor');
        }
        if (stageKey === 'persona_editor') {
            return stageLastResultNonEmpty(byKey, 'hook_editor');
        }
        if (stageKey === 'rewrite') {
            if (preset === 'soft') {
                return !!(sourceEl && String(sourceEl.value || '').trim());
            }
            if (preset === 'prewritten') {
                return stageLastResultNonEmpty(byKey, 'inbox');
            }
            return false;
        }
        if (stageKey === 'voiceover_editor') {
            if (preset === 'prewritten') {
                return stageLastResultNonEmpty(byKey, 'inbox');
            }
            if (preset === 'soft') {
                return stageLastResultNonEmpty(byKey, 'rewrite');
            }
            return stageLastResultNonEmpty(byKey, 'persona_editor');
        }
        if (stageKey === 'elevenlabs_editor' || stageKey === 'title_strategist' || stageKey === 'structure_splitter') {
            return voiceoverPlainNonEmpty(byKey);
        }
        if (stageKey === 'scene_writer') {
            return stageLastResultNonEmpty(byKey, 'structure_splitter');
        }
        if (stageKey === 'youtube_packaging') {
            return stageLastResultNonEmpty(byKey, 'title_strategist');
        }
        return true;
    }

    function syncStageRunButtons() {
        const cards = Array.from(document.querySelectorAll('.rewrite-stage-card'));
        const byKey = {};
        cards.forEach(function (c) {
            const k = c.getAttribute('data-stage-key');
            if (k) byKey[k] = c;
        });
        const anyRunning = !!rewriteStageBusy
            || cards.some(function (c) { return c.classList.contains('rewrite-stage-card--running'); })
            || !!rewriteStageHasActiveStatusRow();
        var runningKey = null;
        cards.forEach(function (c) {
            if (c.classList.contains('rewrite-stage-card--running')) {
                runningKey = c.getAttribute('data-stage-key') || runningKey;
            }
        });
        if (!runningKey && anyRunning) {
            var activeStatusRow = document.querySelector('.rewrite-stage-card .rewrite-stage-status-row:not(.hidden)');
            var activeCard = activeStatusRow ? activeStatusRow.closest('.rewrite-stage-card') : null;
            if (activeCard) runningKey = activeCard.getAttribute('data-stage-key') || null;
        }
        // Цепочка предусловий строится в пределах текущего пресета: иначе для
        // «Глубокого» этапы после draft1 видели бы пустых соседей из чужих
        // пресетов и считали предков невыполненными → ставили бы крестик,
        // даже если все нужные этапы пресета на самом деле сохранены.
        const presetOrder = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[currentRewritePreset])
            ? REWRITE_PRESET_STAGE_KEYS[currentRewritePreset].slice()
            : STAGE_KEYS_ORDER.slice();
        const presetIndexByKey = {};
        presetOrder.forEach(function (k, i) { presetIndexByKey[k] = i; });
        function applyStageRunPair(runBtn, blockedEl, ok, stageBusyUi) {
            if (!runBtn || !blockedEl) return;
            if (ok) {
                runBtn.removeAttribute('hidden');
                blockedEl.setAttribute('hidden', '');
            } else {
                runBtn.setAttribute('hidden', '');
                blockedEl.removeAttribute('hidden');
            }
            runBtn.classList.toggle('btn-regenerate--busy', stageBusyUi);
            runBtn.disabled = anyRunning || !ok || !openaiOk || stageBusyUi;
        }
        STAGE_KEYS_ORDER.forEach(function (sk) {
            const block = byKey[sk];
            if (!block) return;
            const runBtn = block.querySelector('.rewrite-stage-result-toolbar .rewrite-stage-run');
            const blockedEl = block.querySelector('.rewrite-stage-result-toolbar .rewrite-stage-run-blocked');
            var ok = true;
            if (Object.prototype.hasOwnProperty.call(presetIndexByKey, sk)
                || REWRITE_ALWAYS_VISIBLE_STAGE_KEYS[sk]) {
                ok = stageInputSourcesReady(sk, byKey);
            } else {
                // Этап вне текущего пресета — не блокируем кнопку запуска.
                ok = true;
            }
            // Пока любой этап в работе — у всех остальных ✕ (и до, и после), у активного ↻.
            if (anyRunning && runningKey && sk !== 'inbox') {
                if (sk === runningKey) {
                    ok = true;
                } else {
                    ok = false;
                }
            }
            const apiBtn = block.querySelector('.rewrite-stage-api-export');
            var stageBusyUi = block.classList.contains('rewrite-stage-card--running');
            applyStageRunPair(runBtn, blockedEl, ok, stageBusyUi);
            const compactRun = block.querySelector('.rewrite-stage-compact-run');
            const compactBlocked = block.querySelector('.rewrite-stage-compact-run-blocked');
            applyStageRunPair(compactRun, compactBlocked, ok, stageBusyUi);
            if (apiBtn) {
                apiBtn.disabled = anyRunning || !ok || !openaiOk;
            }
        });
        document.querySelectorAll('.rewrite-aux-api-export').forEach(function (b) {
            b.disabled = anyRunning || !openaiOk;
        });
        syncPipelineRunButton();
        syncSceneWriterStructureSplitterWaitOverlay();
        if (typeof window.__syncTtsPrereqWaitOverlay === 'function') {
            try { window.__syncTtsPrereqWaitOverlay(); } catch (_) { /* ignore */ }
        }
    }

    function rewritePresetPipelineRunStartIndex(presetKey, order) {
        if (!order || !order.length) return 0;

    function syncPipelineRunButton() {
        var btn = document.getElementById('rewrite-pipeline-run-btn');
        if (!btn) return;
        if (!openaiOk) {
            btn.disabled = true;
            btn.setAttribute('title', 'Нужен API-ключ OpenAI');

        }
        var busy = !!rewriteStageBusy
            || Array.from(document.querySelectorAll('.rewrite-stage-card')).some(function (c) {
                return c.classList.contains('rewrite-stage-card--running');
            })
            || !!rewriteStageHasActiveStatusRow();
        if (busy) {

            return;
        }
        var presetKey = String(currentRewritePreset || 'deep');
        var order = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[presetKey]) || [];
        if (!order.length) {
            btn.disabled = true;
            btn.setAttribute('title', 'Пустой список этапов пресета');
            return;
        }
        var startIdx = rewritePresetPipelineRunStartIndex(presetKey, order);
        if (startIdx >= order.length) {
            btn.disabled = true;
            btn.setAttribute('title', 'Пустой список этапов пресета');
            return;
        }
        var first = order[startIdx];
        var cards = Array.from(document.querySelectorAll('.rewrite-stage-card'));
        var byKey = {};
        cards.forEach(function (c) {
            var k = c.getAttribute('data-stage-key');
            if (k) byKey[k] = c;
        });

        if (prereqOk) {
            btn.setAttribute('title', 'Очистить результаты этапов выбранного пресета и запустить цепочку подряд');
        } else if (first === 'inbox' || (presetKey === 'prewritten' && first === 'voiceover_editor')) {
            btn.setAttribute('title', 'Сначала вставьте текст в Inbox (Result)');
        } else if (first === 'analysis') {
            btn.setAttribute('title', 'Сначала заполните «Исходный текст»');
        } else if (first === 'rewrite') {
            btn.setAttribute('title', 'Сначала заполните «Исходный текст»');
        } else {
            btn.setAttribute('title', 'Недостаточно данных для запуска первого этапа пресета');
        }
    }

    async function runPresetPipelineFromScratch() {
        if (rewriteStageBusy || rewriteStageHasActiveStatusRow()) {
            alert('Дождитесь завершения запущенного этапа.');
            return;
        }
        var presetKey = String(currentRewritePreset || 'deep');
        var order = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[presetKey]) || [];
        if (!order.length) return;
        syncPipelineRunButton();
        var goBtn = document.getElementById('rewrite-pipeline-run-btn');
        if (!goBtn || goBtn.disabled) return;
        var skipClear = (order[0] === 'inbox') ? 'inbox' : null;
        performClearRewriteCurrentPresetStagesDom({ skipStageKey: skipClear });
        syncStageRunButtons();
        if (window.__rewriteSyncTranslateRuRunPrereq) window.__rewriteSyncTranslateRuRunPrereq();
        if (window.__rewriteSyncSemanticRunPrereq) window.__rewriteSyncSemanticRunPrereq();
        if (typeof window.__rewriteSyncVoiceoverFinalResultPrereq === 'function') {
            try { window.__rewriteSyncVoiceoverFinalResultPrereq(); } catch (_e) {}
        }
        if (typeof window.__rewriteSyncVoiceoverFinalSemanticRunPrereq === 'function') {
            try { window.__rewriteSyncVoiceoverFinalSemanticRunPrereq(); } catch (_e2) {}
        }
        if (typeof window.__clearJobElevenlabsOnRewritePipelineReset === 'function') {
            try { await window.__clearJobElevenlabsOnRewritePipelineReset({ persist: true }); } catch (_eTts) {}
        }
        try {
            var okSave = await saveToServer();
            if (!okSave) {
                alert('Не удалось сохранить очистку на сервере');
                return;
            }
        } catch (e) {
            alert(String(e));
            return;
        }
        var runFrom = rewritePresetPipelineRunStartIndex(presetKey, order);
        for (var i = runFrom; i < order.length; i++) {
            var sk = order[i];
            var block = document.querySelector('.rewrite-stage-card[data-stage-key="' + sk + '"]');
            if (!block) continue;
            var cards2 = Array.from(document.querySelectorAll('.rewrite-stage-card'));
            var byKey2 = {};
            cards2.forEach(function (c) {
                var k = c.getAttribute('data-stage-key');
                if (k) byKey2[k] = c;
            });
            if (!stageInputSourcesReady(sk, byKey2)) {
                alert('Остановлено: для этапа «' + sk + '» не готовы входные данные (проверьте предыдущие шаги).');
                break;
            }
            var okStage = false;
            try {
                okStage = !!(await runStage(sk, block, {}));
            } catch (err) {
                console.warn('[rewrite] runStage', sk, err);
                okStage = false;
            }
            if (!okStage) {
                alert('Остановлено: этап «' + sk + '» завершился с ошибкой или без результата.');
                break;
            }
        }
        syncStageRunButtons();
        syncPipelineRunButton();
    }

    function countWords(s) {
        var t = (s || '').trim();
        if (!t) return 0;
        return t.split(/\s+/).filter(Boolean).length;
    }

    // Форматирует целое число с тонким неразрывным пробелом-разделителем тысяч
    // (U+202F): 11279 → "11 279". Используется во всех счётчиках символов /
    // слов / байтов на странице, чтобы цифры читались как в локали ru-RU и
    // не ломались переносом по пробелу.
    function formatNumRu(n) {
        var v = Number(n);
        if (!isFinite(v)) return String(n == null ? '' : n);
        return String(Math.trunc(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
    }

    // То же самое, но с явным знаком `+` для положительных дельт: используется
    // в плашках «Проверка …» (OUT: 12 345 (+1 234)). Отрицательное число и так
    // получит свой `-` от `formatNumRu`.
    function formatNumRuSigned(n) {
        var v = Number(n);
        if (!isFinite(v)) return String(n == null ? '' : n);
        return (v > 0 ? '+' : '') + formatNumRu(v);
    }

    /** Класс дельты в скобках: цвет как у OK (#6ad09d) / NO (#ff8080). */
    function editorCheckDeltaClass(delta) {
        var v = Number(delta);
        if (!isFinite(v) || v === 0) return 'rewrite-editor-check-delta rewrite-editor-check-delta--zero';
        if (v > 0) return 'rewrite-editor-check-delta rewrite-editor-check-delta--pos';
        return 'rewrite-editor-check-delta rewrite-editor-check-delta--neg';
    }

    function editorCheckDeltaHtml(delta) {
        return '<span class="' + editorCheckDeltaClass(delta) + '">' + formatNumRuSigned(delta) + '</span>';
    }

        // Состояние ошибки (или ручной отмены): красная dashed-рамка,
        // красный текст, без спиннера и Cancel. textarea остаётся скрытой —
        // вместо неё показываем плашку с ошибкой. Сбрасывается при

        async function followTranslateRuEventStream(taskId, signal) {
            var res = await fetch(rewriteTaskEventsUrl(taskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (!res.ok) {
                setTranslateRuStatus('Ошибка подписки на задачу: HTTP ' + res.status);
                return false;
            }
            var reader = res.body && res.body.getReader();
            if (!reader) {
                setTranslateRuStatus('Браузер не поддерживает потоковое чтение ответа.');
                return false;
            }
            var dec = new TextDecoder('utf-8');
            var buf = '';
            var translatedText = '';
            var hadError = false;
            var gotResult = false;
            while (true) {
                var rd = await reader.read();
                if (rd.done) break;
                buf += dec.decode(rd.value, { stream: true });
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx);
                    buf = buf.slice(idx + 1);
                    if (!line.trim()) continue;
                    var ev = null;
                    try { ev = JSON.parse(line); } catch (e2) { continue; }
                    var msg = String((ev && ev.message) || '');
                    if (ev && ev.type === 'status') {
                        setTranslateRuStatus(msg);
                    } else if (ev && ev.type === 'error') {
                        hadError = true;
                        setTranslateRuStatus('Ошибка: ' + msg);
                    } else if (ev && ev.type === 'result') {
                        translatedText = String(ev.content || '');
                        gotResult = true;
                    }
                }
            }
            if (hadError && !gotResult) {
                return false;
            }
            if (gotResult && sourceRuEl) {
                sourceRuEl.value = translatedText;
                if (sourceRuWrap && String(translatedText || '').trim()) {
                    sourceRuWrap.classList.remove('hidden');
                    sourceRuWrap.setAttribute('aria-hidden', 'false');
                }
                sourceRuLocked = true;
                applySourceRuLockUI();
                updateSourceRuCounts();
                scheduleAutosave(0);
            }
            return gotResult && !hadError;
        }

        function cancelTranslateRu() {

        async function runTranslateRu() {

            var raw = sourceEl ? (sourceEl.value || '') : '';

                try { window.__rewriteClearRuAndSemanticDom({ ru: true, semantic: false, cancelTasks: false }); } catch (_clrRu) {}
            }

            setTranslateRuStatus('Запуск фоновой задачи перевода…');
            translateRuTaskId = null;
            translateRuAbort = new AbortController();
            var hadError = false;
            var wasAborted = false;
            try {
                var modelVal = getLangStagesModel();
                var startResp = await fetch(translateRuStartUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ source_text: raw, model: modelVal }),
                    signal: translateRuAbort.signal
                });
                var startData = null;
                try { startData = await startResp.json(); } catch (_) { startData = null; }
                if (!startResp.ok || !startData || !startData.ok || !startData.task || !startData.task.task_id) {
                    hadError = true;
                    var se = (startData && (startData.message || startData.error)) || ('HTTP ' + startResp.status);
                    setTranslateRuStatus('Не удалось запустить: ' + se);
                    return false;
                }
                translateRuTaskId = startData.task.task_id;
                setTranslateRuStatus('Задача запущена, подключаюсь к событиям…');
                var okFollow = await followTranslateRuEventStream(translateRuTaskId, translateRuAbort.signal);
                if (!okFollow) hadError = true;
                return okFollow && !hadError;
            } catch (e) {
                if (e && (e.name === 'AbortError' || String(e).indexOf('aborted') !== -1)) {
                    wasAborted = true;
                    setTranslateRuStatus('Отменено.');
                } else {
                    hadError = true;
                    setTranslateRuStatus('Ошибка: ' + String(e && e.message ? e.message : e));
                }
                return false;
            } finally {
                translateRuTaskId = null;
                translateRuAbort = null;
                if (wasAborted) {
                    if (typeof window.__rewriteClearRuAndSemanticDom === 'function') {
                        try { window.__rewriteClearRuAndSemanticDom({ ru: true, semantic: false, cancelTasks: false }); } catch (_clrRu2) {}
                    }
                    setTranslateRuBusy(false);
                } else if (hadError) {
                    var lastMsg = translateRuStatusEl ? String(translateRuStatusEl.textContent || '') : '';
                    setTranslateRuError(lastMsg || 'Ошибка');
                } else {
                    setTranslateRuBusy(false);
                }
            }
        }

        translateRuBtn.addEventListener('click', function () { runTranslateRu(); });
        window.__rewriteRunTranslateRu = runTranslateRu;
        window.__rewriteCancelTranslateRu = cancelTranslateRu;
        window.__rewriteTranslateRuIsRunning = function () { return translateRuRunning; };

        /** Подключение к уже running-задаче перевода после F5 / новой вкладки. */
        window.__rewriteTranslateRuAttach = async function (taskId) {

                } else {
                    hadError = true;
                    setTranslateRuStatus('Ошибка: ' + String(e && e.message ? e.message : e));
                }
            } finally {
                translateRuTaskId = null;
                translateRuAbort = null;
                if (wasAborted) {
                    if (typeof window.__rewriteClearRuAndSemanticDom === 'function') {
                        try { window.__rewriteClearRuAndSemanticDom({ ru: true, semantic: false, cancelTasks: false }); } catch (_clrRu3) {}
                    }
                    setTranslateRuBusy(false);
                } else if (hadError) {
                    var lastMsg = translateRuStatusEl ? String(translateRuStatusEl.textContent || '') : '';
                    setTranslateRuError(lastMsg || 'Ошибка');
                } else {
                    setTranslateRuBusy(false);
                }

        syncTranslateRuRunButtonPrereq();
        window.__rewriteSyncTranslateRuRunPrereq = syncTranslateRuRunButtonPrereq;

    function ytFormatBytes(n) {
        if (n == null || n === undefined || (typeof n === 'number' && (isNaN(n) || n < 0))) return '—';
        var b = Number(n);
        if (b >= 1048576) return (b / 1048576).toFixed(2) + ' МБ';
        if (b >= 1024) return (b / 1024).toFixed(1) + ' КиБ';
        return String(b) + ' б';
    }
    function ytFormatSpeedBps(bps) {
        if (bps == null || bps === undefined || isNaN(bps) || bps <= 0) return '';
        return ' · ' + ytFormatBytes(bps) + '/с';
    }
    function ytFormatEta(sec) {
        if (sec == null || sec === undefined || isNaN(sec) || sec < 0) return '';
        sec = Number(sec);
        if (sec < 90) return String(Math.max(1, Math.round(sec))) + ' секунд';
        var m = Math.floor(sec / 60);
        var s0 = Math.round(sec % 60);
        return String(m) + ' мин ' + String(s0) + ' сек';
    }
    function formatTranscribeProgressLine(ev) {
        if (ev.phase === 'split') {
            return ev.message || 'Подготовка аудио…';
        }
        if (ev.phase === 'plan') {
            var p = ev.message || 'План: OpenAI (gpt-4o-mini-transcribe)';
            if (ev.total_chunks > 1) {
                p += ' · ' + String(ev.total_chunks) + ' части';
                if (ev.segment_seconds) {
                    p += ' (по ~' + String(ev.segment_seconds) + ' с)';
                }
            }
            return p;
        }
        if (ev.phase === 'chunk' && ev.action === 'request') {
            return 'OpenAI, часть ' + String(ev.index) + '/' + String(ev.total) + ': отправка'
                + (ev.file_bytes != null ? ' ' + ytFormatBytes(ev.file_bytes) : '') + ' — ждём ответ…';
        }
        if (ev.phase === 'chunk' && ev.action === 'done') {
            return 'OpenAI, часть ' + String(ev.index) + '/' + String(ev.total) + ' — готово'
                + (ev.text_chars != null ? ', ' + formatNumRu(ev.text_chars) + ' симв. в сегменте' : '') + '…';
        }
        if (ev.phase === 'join') {
            return ev.message || 'Склейка частей в один текст…';
        }
        return ev.message || 'Расшифровка…';
    }

    async function ytConsumeDownloadStream(signal) {
        const r2 = await fetch(ytDownloadStreamUrl, {
            method: 'POST',
            headers: { Accept: 'application/x-ndjson' },
            signal: signal
        });
        if (!r2.ok) {
            const errBody = await r2.json().catch(function () { return {}; });
            throw new Error(errBody.message || 'Не удалось скачать аудио (HTTP ' + r2.status + ').');
        }
        const reader = r2.body && r2.body.getReader();
        if (!reader) throw new Error('Браузер не поддерживает поток ответа.');
        const dec = new TextDecoder();
        var buf = '';
        function handleYoutubeStreamEvent(ev) {
            if (ev.type === 'progress' && ev.phase === 'status' && ev.message) {
                setYtStatus(String(ev.message), false);
                return null;
            }
            if (ev.type === 'progress' && ev.phase === 'download') {
                var got = ev.downloaded_bytes;
                var tot = ev.total_bytes != null ? ev.total_bytes : ev.total_bytes_estimate;
                var msg = 'Скачивание: ' + ytFormatBytes(got);
                if (tot != null && tot > 0) {
                    var gotN = Number(got) || 0;
                    var pct = Math.min(100, Math.max(0, Math.round(100 * gotN / tot)));
                    msg += ' из ' + ytFormatBytes(tot) + ' — ' + String(pct) + '%';
                } else {
                    msg += (tot == null && ev.total_bytes_estimate == null) ? ' (оценка размера…)' : '';
                }
                msg += ytFormatSpeedBps(ev.speed);
                if (ev.eta != null && !isNaN(ev.eta)) {
                    var eta0 = ytFormatEta(ev.eta);
                    if (eta0) msg += ' · осталось ' + eta0;
                }
                setYtStatus(msg, false);
            } else if (ev.type === 'progress' && ev.phase === 'postprocess') {
                var pp = (ev.postprocessor || '').replace(/ExtractAudio/i, 'аудио-обработка');
                setYtStatus('После скачивания: ' + (pp || 'обработка') + ' (может занять время)…', false);
            } else if (ev.type === 'progress' && ev.phase === 'fragment_done') {
                setYtStatus('Фрагмент записан, продолжаем…', false);
            } else if (ev.type === 'error' && ev.message) {
                throw new Error(ev.message);
            } else if (ev.type === 'done' && ev.ok) {
                return ev;
            }
            return null;
        }
        function drainBufLines() {
            var i;
            while ((i = buf.indexOf('\n')) >= 0) {
                var line = buf.slice(0, i).trim();
                buf = buf.slice(i + 1);
                if (!line) continue;
                var ev;
                try {
                    ev = JSON.parse(line);
                } catch (e) {
                    continue;
                }
                var doneEv = handleYoutubeStreamEvent(ev);
                if (doneEv) return doneEv;
            }
            return null;
        }
        while (true) {
            if (signal && signal.aborted) {
                try { reader.cancel(); } catch (_) {}
                throw new DOMException('Aborted', 'AbortError');
            }
            const chunk = await reader.read();
            if (chunk.done) {
                buf += dec.decode();
                break;
            }
            buf += dec.decode(chunk.value, { stream: true });
            var doneEarly = drainBufLines();
            if (doneEarly) return doneEarly;
        }
        var tailDone = drainBufLines();
        if (tailDone) return tailDone;
        if (buf.trim()) {
            try {
                var evLast = JSON.parse(buf.trim());
                var d0 = handleYoutubeStreamEvent(evLast);
                if (d0) return d0;
            } catch (e) { /* ignore */ }
        }
        throw new Error('Поток скачивания оборвался без результата.');
    }

    async function ytConsumeTranscribeStream(signal) {
        const r2 = await fetch(ytTranscribeStreamUrl, {
            method: 'POST',
            headers: { Accept: 'application/x-ndjson' },
            signal: signal
        });
        if (!r2.ok) {
            const errBody = await r2.json().catch(function () { return {}; });
            throw new Error(errBody.message || 'Не удалось запустить расшифровку (HTTP ' + r2.status + ').');
        }
        const reader = r2.body && r2.body.getReader();
        if (!reader) throw new Error('Браузер не поддерживает поток ответа.');
        const dec = new TextDecoder();
        var buf = '';
        function handleTr(ev) {
            if (ev.type === 'transcribe_progress') {
                setYtStatus(formatTranscribeProgressLine(ev), false);
                return null;
            }
            if (ev.type === 'error' && ev.message) {
                throw new Error(ev.message);
            }
            if (ev.type === 'done' && ev.ok) {
                return ev;
            }
            return null;
        }
        function drainBuf() {
            var i;
            while ((i = buf.indexOf('\n')) >= 0) {
                var line = buf.slice(0, i).trim();
                buf = buf.slice(i + 1);
                if (!line) continue;
                var ev;
                try { ev = JSON.parse(line); } catch (e0) { continue; }
                var done0 = handleTr(ev);
                if (done0) return done0;
            }
            return null;
        }
        while (true) {
            if (signal && signal.aborted) {
                try { reader.cancel(); } catch (_) {}
                throw new DOMException('Aborted', 'AbortError');
            }
            const chunk = await reader.read();
            if (chunk.done) {
                buf += dec.decode();
                break;
            }
            buf += dec.decode(chunk.value, { stream: true });
            var d = drainBuf();
            if (d) return d;
        }
        var tail = drainBuf();
        if (tail) return tail;
        if (buf.trim()) {
            try {
                var evL = JSON.parse(buf.trim());
                var d1 = handleTr(evL);
                if (d1) return d1;
            } catch (e1) { /* ignore */ }
        }
        throw new Error('Поток расшифровки оборвался без результата.');
    }

    async function ytFullDecode() {
        if (!ytUrlEl || !openaiOk || ytWorking) return;
        var u = (ytUrlEl.value || '').trim();
        if (!u) {
            setYtStatus('Вставьте ссылку YouTube.', true);
            ytTranscriptReady = false;
            applyYoutubeToolbar();
            return;
        }
        // Сразу занимаем слот, чтобы второй клик/Enter не стартовал параллельный
        // конвейер (иначе статусы перебивают друг друга и «мигает» плашка).
        ytWorking = true;
        ytTranscriptReady = false;
        ytAbortController = new AbortController();
        var signal = ytAbortController.signal;
        ytLastStatusIsError = false;
        setYtStatus('', false);
        setYtChannelMeta({});
        setYtVideoTitle('');
        syncYtProgressVisibility();
        applyYoutubeToolbar();
        await ytPersistPreviewClearToServer({ processing: true });
        try {
            setYtStatus('Проверяем ссылку…', false);
            const r1 = await fetch(ytVerifyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ youtube_url: u }),
                signal: signal
            });
            const d1 = await r1.json().catch(function () { return {}; });
            if (!r1.ok || !d1.ok) {
                var verifyErr = d1.message || 'Не удалось проверить ссылку.';
                setYtStatus(verifyErr, true);
                syncYtProgressVisibility();
                await ytPersistErrorToServer(verifyErr);
                return;
            }
            if (d1.youtube_title) {
                setYtVideoTitle(d1.youtube_title);
            }
            setYtChannelMeta(d1);
            setYtStatus('Скачивание: запрашиваем поток с сервера…', false);
            const doneDl = await ytConsumeDownloadStream(signal);
            if (doneDl && doneDl.youtube_title) {
                setYtVideoTitle(doneDl.youtube_title);
            }

            setYtStatus('Расшифровка: инициализация (OpenAI)…', false);
            const d3 = await ytConsumeTranscribeStream(signal);
            var ch = typeof d3.chars === 'number' ? d3.chars : 0;
            var wd = typeof d3.words === 'number' ? d3.words : 0;
            setYtStatus('Готово - ' + formatNumRu(ch) + ' символов · ' + formatNumRu(wd) + ' слов', false);
            ytTranscriptReady = true;
            // Не затемняем сразу после конвейера: удобно вставить текст, сменить ссылку.
            // После F5 с сохранённой расшифровкой сервер снова отдаёт locked (как защита).
        } catch (e) {
            ytTranscriptReady = false;
            if (e && e.name === 'AbortError') {
                ytLastStatusIsError = false;
                setYtStatus('', false);
                setYtChannelMeta({});
                setYtVideoTitle('');
                syncYtProgressVisibility();
                await ytPersistPreviewClearToServer({ processing: false });
            } else {
                ytLastStatusIsError = true;
                var errMsg = String(e && e.message ? e.message : e);
                setYtStatus(errMsg, true);
                syncYtProgressVisibility();
                await ytPersistErrorToServer(errMsg);
            }
        } finally {
            ytAbortController = null;
            ytWorking = false;
            applyYoutubeToolbar();
        }
    }

    function parseSceneWriterScenesGrouped(rawText) {
        var scenes = [];
        var current = null;
        var lines = String(rawText || '').split(/\r?\n/);
        for (var li = 0; li < lines.length; li += 1) {
            var ln = lines[li].trim();
            if (!ln) continue;
            var obj;
            try { obj = JSON.parse(ln); } catch (e) { continue; }
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'scene_id')) {
                if (current) scenes.push(current);
                current = { lines: [ln] };
                continue;
            }
            if (current) current.lines.push(ln);
        }
        if (current) scenes.push(current);
        return scenes;
    }

    function serializeSceneWriterScenesGrouped(scenes) {
        var out = [];
        for (var si = 0; si < scenes.length; si += 1) {
            var sceneLines = scenes[si].lines || [];
            for (var lj = 0; lj < sceneLines.length; lj += 1) {
                if (lj === 0) {
                    try {
                        var o = JSON.parse(sceneLines[0]);
                        if (o && Object.prototype.hasOwnProperty.call(o, 'scene_id')) {
                            o.scene_id = 'scene_' + String(si + 1).padStart(3, '0');
                            out.push(JSON.stringify(o));
                            continue;
                        }
                    } catch (e) { /* keep raw line */ }
                }
                out.push(sceneLines[lj]);
            }
        }
        return out.join('\n');
    }

    function replaceSceneWriterBlockInResult(fullText, blockIndex, newPartText, blocksInfo) {
        var sceneCounts = (blocksInfo || []).map(function (r) { return Number(r.scenes || 0); });
        var bi = Number(blockIndex) - 1;
        if (bi < 0 || bi >= sceneCounts.length) return fullText;
        var allScenes = parseSceneWriterScenesGrouped(fullText);
        var newScenes = parseSceneWriterScenesGrouped(newPartText);
        var offset = 0;
        for (var k = 0; k < bi; k += 1) offset += sceneCounts[k] || 0;
        var count = sceneCounts[bi] || 0;
        var merged = allScenes.slice(0, offset).concat(newScenes).concat(allScenes.slice(offset + count));
        return serializeSceneWriterScenesGrouped(merged);
    }

    async function regenerateSceneWriterBlock(swBlock, blockIndex) {
        if (!swBlock || !blockIndex) return;
        if (rewriteStageBusy || rewriteStageHasActiveStatusRow()) {
            alert('Дождитесь завершения другого запущенного этапа.');
            return;
        }
        if (!openaiOk) {
            alert('Укажите OPENAI_API_KEY в .env и перезапустите сервис.');
            return;
        }
        var resTa = swBlock.querySelector('.rewrite-stage-result');
        if (!resTa || !String(resTa.value || '').trim()) {
            alert('Сначала запустите Scene Writer целиком или вставьте Result.');
            return;
        }
        var payload = readSceneWriterCheckFromBlock(swBlock);
        if (!payload || !Array.isArray(payload.blocks_info) || !payload.blocks_info.length) {
            alert('Нет данных проверки — сначала полный прогон Scene Writer.');
            return;
        }
        var ssTa = document.querySelector('.rewrite-stage-card[data-stage-key="structure_splitter"] .rewrite-stage-result');
        if (!ssTa || !String(ssTa.value || '').trim()) {
            alert('Нужен Result у Structure Splitter.');
            return;
        }
        setSceneWriterBlockRegenBusy(blockIndex, true);
        setBusy(true);
        syncStageRunButtons();
        var localAbortController = new AbortController();
        var signal = localAbortController.signal;
        var currentTaskId = null;
        var streamError = false;
        setStageStatusUi(swBlock, 'Scene Writer: блок ' + blockIndex + '…', true, function () {
            if (currentTaskId) {
                try {
                    fetch(rewriteTaskCancelUrl(currentTaskId), { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                } catch (_) {}
            }
            try { localAbortController.abort(); } catch (_) {}
        });
        try {
            var snap = collectSnapshot({ scene_block_index: blockIndex });
            var startResp = await fetch(runStartUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(Object.assign({ stage: 'scene_writer' }, snap)),
                signal: signal
            });
            var startData = null;
            try { startData = await startResp.json(); } catch (_) { startData = null; }
            if (!startResp.ok || !startData || !startData.ok || !startData.task || !startData.task.task_id) {
                var startErr = (startData && (startData.error || startData.message)) || ('HTTP ' + startResp.status);
                alert('Не удалось запустить перегенерацию: ' + startErr);
                streamError = true;
                return;
            }
            currentTaskId = startData.task.task_id;
            var res = await fetch(rewriteTaskEventsUrl(currentTaskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            var reader = res.body && res.body.getReader();
            if (!reader) {
                alert('Браузер не поддерживает потоковое чтение.');
                streamError = true;
                return;
            }
            var dec = new TextDecoder();
            var buf = '';
            while (true) {
                var chunk = await reader.read();
                if (chunk.done) break;
                buf += dec.decode(chunk.value, { stream: true });
                var nl;
                while ((nl = buf.indexOf('\n')) >= 0) {
                    var line = buf.slice(0, nl).trim();
                    buf = buf.slice(nl + 1);
                    if (!line) continue;
                    var ev;
                    try { ev = JSON.parse(line); } catch (e) { continue; }
                    if (ev.type === 'status' && ev.message) {
                        pushStageStatus(swBlock, ev.message);
                    } else if (ev.type === 'error' && ev.message) {
                        streamError = true;
                        alert(String(ev.message));
                    } else if (ev.type === 'scene_writer_block_regen') {
                        var idx = Number(ev.index || blockIndex);
                        var part = String(ev.content || '');
                        payload = readSceneWriterCheckFromBlock(swBlock) || payload;
                        resTa.value = replaceSceneWriterBlockInResult(resTa.value, idx, part, payload.blocks_info);
                        var idx0 = idx - 1;
                        if (payload.blocks_info && payload.blocks_info[idx0]) {
                            payload.blocks_info[idx0].scenes = parseSceneWriterScenesGrouped(part).length;
                            try {
                                swBlock.setAttribute('data-scene-writer-check-json', JSON.stringify(payload));
                            } catch (e) { /* ignore */ }
                        }
                        try { recomputeSceneWriterBlocksMatchLocal(swBlock); } catch (_) {}
                        payload = readSceneWriterCheckFromBlock(swBlock) || payload;
                        renderSceneWriterCheck(swBlock, payload);
                        updateResultCounts(swBlock);
                        scheduleAutosave(500);
                        if (typeof window.__syncJsonScriptFromSceneWriter === 'function') {
                            try { window.__syncJsonScriptFromSceneWriter(); } catch (_) {}
                        }
                    }
                }
            }
        } catch (e) {
            if (!(e && e.name === 'AbortError')) {
                streamError = true;
                alert(String(e && e.message ? e.message : e));
            }
        } finally {
            clearStageStatusUi(swBlock);
            setSceneWriterBlockRegenBusy(blockIndex, false);
            setBusy(false);
            syncStageRunButtons();
            var pFinal = readSceneWriterCheckFromBlock(swBlock);
            if (pFinal) renderSceneWriterCheck(swBlock, pFinal);
        }
    }

    async function _fetchWithRetry(url, init, attempts) {
        var max = Math.max(1, Number(attempts || 3));
        var lastErr = null;
        for (var i = 0; i < max; i++) {
            try {
                return await fetch(url, init);
            } catch (e) {
                lastErr = e;
                // TypeError: Failed to fetch — транзиентный сетевой сбой/расширение/перезагрузка сервера.
                if (i < max - 1) {
                    await new Promise(function (res) { setTimeout(res, 400 * (i + 1)); });
                    continue;
                }
            }
        }
        throw lastErr || new Error('fetch failed');
    }

    async function saveToServer() {
        const r = await _fetchWithRetry(saveUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectSnapshot())
        }, 3);
        return r.ok;
    }

    let autosaveTimer = null;
    let autosaveInFlight = false;
    let autosaveNeedsRerun = false;
    async function runAutosaveNow() {
        if (autosaveInFlight) {
            autosaveNeedsRerun = true;
            return;
        }
        autosaveInFlight = true;
        try {
            await saveToServer();
        } catch (e) {
            // Silent background autosave.
        } finally {
            autosaveInFlight = false;
            if (autosaveNeedsRerun) {
                autosaveNeedsRerun = false;
                runAutosaveNow();
            }
        }
    }
    function scheduleAutosave(delayMs) {
        var d = Number(delayMs || 0);
        if (autosaveTimer) clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(function () {
            autosaveTimer = null;
            runAutosaveNow();
        }, Math.max(0, d));
    }

    function wireTextLockToggle(toggleBtn, stateRef) {
        if (!toggleBtn) return;
        toggleBtn.addEventListener('click', async function () {
            if (!openaiOk || toggleBtn.disabled) return;
            var locked = stateRef.get();
            if (locked) {
                stateRef.set(false);
                stateRef.apply();
                try {
                    var ok = await saveToServer();
                    if (!ok) {
                        stateRef.set(true);
                        stateRef.apply();
                        alert('Не удалось переключить режим');
                        return;
                    }
                    stateRef.apply();
                    if (stateRef.focusEl) stateRef.focusEl.focus();
                } catch (e) {
                    stateRef.set(true);
                    stateRef.apply();
                    alert(String(e));
                }
            } else {
                stateRef.set(true);
                stateRef.apply();
                try {
                    var ok2 = await saveToServer();
                    if (!ok2) {
                        stateRef.set(false);
                        stateRef.apply();
                        alert('Не удалось сохранить');
                    } else {
                        stateRef.apply();
                        if (stateRef.syncTemplate === true) {
                            if (!(await trySyncRewriteTemplateToDisk())) {
                                alertTemplateSyncFailed();
                            }
                        }
                        if (typeof stateRef.afterLockCommit === 'function') {
                            try { stateRef.afterLockCommit(); } catch (_e) {}
                        }
                    }
                } catch (e2) {
                    stateRef.set(false);
                    stateRef.apply();
                    alert(String(e2));
                }
            }
        });
    }

        function fallbackExec() {

    /* Маркер [END] в Rewrite — убираем любые оставшиеся вхождения (как scrub_rewrite_end_markers на сервере). */
    function scrubRewriteStreamEndMarkers(s) {
        if (typeof s !== 'string' || !s) return s;
        var t = s.replace(/\uff3bEND\uff3d/gi, '').replace(/\uff3b\s+END\s+\uff3d/gi, '');
        var i;
        for (i = 0; i < 32; i++) {
            var u = t.replace(/^\s*\[\s*END\s*\]\s*$/gim, '');
            u = u.replace(/\[\s*END\s*\]\s*$/gi, '');
            if (u === t) break;
            t = u;
        }
        t = t.replace(/\[\s*END\s*\]/gi, '');
        return t.replace(/[ \t\r]+$/g, '').replace(/\n+$/g, '');
    }
