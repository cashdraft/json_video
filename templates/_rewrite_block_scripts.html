                try { startData = await startResp.json(); } catch (_) { startData = null; }
                if (!startResp.ok || !startData || !startData.ok || !startData.task || !startData.task.task_id) {
                    var startErr = (startData && (startData.error || startData.message)) || ('HTTP ' + startResp.status);
                    var diag = 'HTTP ' + startResp.status + ' ' + (startResp.statusText || '') + ' · stage=' + JSON.stringify(stageKey);
                    showStageError(block, 'Не удалось запустить задачу: ' + startErr + ' (' + diag + ')');
                    streamError = true;
                    return false;
                }
                currentTaskId = startData.task.task_id;
                attachSinceSeq = -1;
            } else {
                currentTaskId = attachTaskIdInitial;
            }
            // Update cancel handler now that we know the task_id.
            setStageStatusUi(
                block,
                attachMode ? 'Подключение к задаче…' : 'В очереди OpenAI… (0s)',
                true,
                doCancelForCurrentTask
            );
            const res = await fetch(rewriteTaskEventsUrl(currentTaskId, attachSinceSeq), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            reader = res.body && res.body.getReader();
            if (!reader) {
                showStageError(block, 'Браузер не поддерживает потоковое чтение ответа.');
                streamError = true;
                return false;
            }
            const dec = new TextDecoder();
            let buf = '';
            const useOpenAIStreamUi = (stageKey === 'draft1' || stageKey === 'rewrite');
            let streamBuf = '';
            while (true) {
                var chunk;
                try {
                    chunk = await reader.read();
                } catch (readErr) {
                    if (readErr && readErr.name === 'AbortError') {
                        streamError = true;
                        break;
                    }
                    throw readErr;
                }
                if (chunk.done) break;
                buf += dec.decode(chunk.value, { stream: true });
                let i;
                while ((i = buf.indexOf('\n')) >= 0) {
                    const line = buf.slice(0, i).trim();
                    buf = buf.slice(i + 1);
                    if (!line) continue;
                    let ev;
                    try {
                        ev = JSON.parse(line);
                    } catch (e) {
                        if (!useOpenAIStreamUi || streamBuf.length === 0) {
                            pushStageStatus(block, 'Строка JSON не разобрана: ' + line.slice(0, 80));
                        }
                        continue;
                    }
                    if (ev.type === 'status' && ev.message) {
                        if (!useOpenAIStreamUi || streamBuf.length === 0) {
                            pushStageStatus(block, ev.message);
                        }
                    } else if (ev.type === 'delta' && typeof ev.content === 'string') {
                        streamBuf += ev.content;
                        if (resTextarea) {
                            resTextarea.value = streamBuf;
                            resTextarea.classList.add('rewrite-stage-result--busy');
                            resTextarea.scrollTop = resTextarea.scrollHeight;
                        }
                        updateResultCounts(block);
                        if (stageKey === 'rewrite') {
                            var nowCheck = Date.now();
                            if (nowCheck - (block._rewriteCheckLastAt || 0) > 400) {
                                block._rewriteCheckLastAt = nowCheck;
                                renderEditorCheck(block);
                            }
                        }
                    } else if (ev.type === 'error' && ev.message) {
                        streamError = true;
                        if (streamBuf.length > 0 && resTextarea) {
                            resTextarea.value = streamBuf + '\n\n--- Ошибка ---\n' + ev.message;
                            resTextarea.classList.remove('rewrite-stage-result--busy');
                            resTextarea.classList.add('rewrite-stage-result--error');
                            clearStageStatusUi(block);
                            updateResultCounts(block);
                            renderEditorCheck(block);
                            syncStageRunButtons();
                        } else {
                            showStageError(block, ev.message);
                        }
                    } else if (ev.type === 'scene_writer_block_regen' && stageKey === 'scene_writer') {
                        var regenIdx = Number(ev.index || 0);
                        var regenPart = String(ev.content || '');
                        var regenPayload = readSceneWriterCheckFromBlock(block) || { summary: {}, blocks_info: [] };
                        if (resTextarea && regenIdx > 0) {
                            resTextarea.value = replaceSceneWriterBlockInResult(
                                resTextarea.value, regenIdx, regenPart, regenPayload.blocks_info
                            );
                            var regenIdx0 = regenIdx - 1;
                            if (regenPayload.blocks_info && regenPayload.blocks_info[regenIdx0]) {
                                regenPayload.blocks_info[regenIdx0].scenes = parseSceneWriterScenesGrouped(regenPart).length;
                                try {
                                    block.setAttribute('data-scene-writer-check-json', JSON.stringify(regenPayload));
                                } catch (e) { /* ignore */ }
                            }
                            try { recomputeSceneWriterBlocksMatchLocal(block); } catch (_) {}
                            regenPayload = readSceneWriterCheckFromBlock(block) || regenPayload;
                            renderSceneWriterCheck(block, regenPayload);
                            updateResultCounts(block);
                            scheduleAutosave(500);
                            if (typeof window.__syncJsonScriptFromSceneWriter === 'function') {
                                try { window.__syncJsonScriptFromSceneWriter(); } catch (_) {}
                            }
                        }
                    } else if (ev.type === 'scene_writer_check' && stageKey === 'scene_writer') {
                        block.setAttribute('data-scene-writer-check-json', JSON.stringify(ev));
                        renderSceneWriterCheck(block, ev);
                    } else if (ev.type === 'elevenlabs_editor_check' && stageKey === 'elevenlabs_editor') {
                        block.setAttribute('data-elevenlabs-editor-check-json', JSON.stringify(ev));
                        renderElevenLabsEditorCheck(block, ev);
                    } else if (ev.type === 'structure_splitter_check' && stageKey === 'structure_splitter') {
                        block.setAttribute('data-structure-splitter-check-json', JSON.stringify(ev));
                        renderStructureSplitterCheck(block, ev);
                    } else if (ev.type === 'result' && typeof ev.content === 'string') {
                        gotFinalResult = true;
                        var resultContent = ev.content;
                        if (stageKey === 'rewrite') {
                            resultContent = scrubRewriteStreamEndMarkers(resultContent);
                        }
                        if (typeof resultContent === 'string') {
                            resultContent = normalizeModelPlainText(resultContent);
                        }
                        if ((stageKey === 'analysis' || stageKey === 'architect') && typeof resultContent === 'string') {
                            var normStageJson = normalizeLlmJsonObjectText(resultContent);
                            if (normStageJson.ok) resultContent = normStageJson.text;
                        }
                        if (resTextarea) {
                            if (REWRITE_JSON_SPLIT_STAGES[stageKey]) {
                                applyEditorJsonResultSplit(block, resultContent);
                            } else {
                                resTextarea.value = resultContent;
                            }
                            resTextarea.classList.remove('rewrite-stage-result--busy');
                            resTextarea.classList.remove('rewrite-stage-result--error');
                        }
                        clearStageStatusUi(block);
                        updateResultCounts(block);
                        renderEditorCheck(block);
                        if (stageKey === 'youtube_packaging') {
                            renderYoutubePackagingPreview(block);
                        }
                        // После завершения Voiceover Editor — обновить «Итоговый текст»
                        // и сбросить перевод. Программное resTextarea.value не дёргает
                        // input event, поэтому зовём напрямую.
                        if (REWRITE_JSON_SPLIT_STAGES[stageKey]) {
                            scheduleAutosave(500);
                        }
                        if (stageKey === 'voiceover_editor') {
                            if (typeof window.__rewriteRefreshVoiceoverFinal === 'function') {
                                try { window.__rewriteRefreshVoiceoverFinal(); } catch (_) {}
                            }
                        }
                        syncStageRunButtons();
                    }
                }
            }
            var userAborted = signal && signal.aborted;
            if (userAborted && resTextarea && !gotFinalResult) {
                if (reader) {
                    try { await reader.cancel(); } catch (_) {}
                }
                resTextarea.value = savedBeforeRun;
                resTextarea.classList.remove('rewrite-stage-result--busy');
                resTextarea.classList.remove('rewrite-stage-result--error');
                clearStageStatusUi(block);
                updateResultCounts(block);
                syncStageRunButtons();
                return false;
            }
            if (!gotFinalResult && resTextarea && !streamError) {
                if (useOpenAIStreamUi && streamBuf.length > 0) {
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                    syncStageRunButtons();
                } else {
                    resTextarea.value = savedBeforeRun;
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                    syncStageRunButtons();
                }
            }
            if (gotFinalResult) {
                await saveToServer();
                if (stageKey === 'draft1' || stageKey === 'block_writer') {
                    await refreshBlockWriterCheck(block);
                }
                stageSuccess = true;
            }
            return stageSuccess;
        } catch (e) {
            if (e && e.name === 'AbortError') {
                if (reader) {
                    try { reader.cancel(); } catch (_) {}
                }
                if (resTextarea && !gotFinalResult) {
                    resTextarea.value = savedBeforeRun;
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    resTextarea.classList.remove('rewrite-stage-result--error');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                }
                syncStageRunButtons();
                return false;
            }
            showStageError(block, String(e));
            streamError = true;
            return false;
        } finally {
            block.removeAttribute('data-run-started-at');
            block._rewriteStageCancelHandler = null;
            if (!stageSuccess) {
                clearStageStatusUi(block);
            }
            if (manageBusy) setBusy(false);
        }
    }

    function parseContentDispositionFilename(cd) {
        if (!cd) return null;
        var star = cd.match(/filename\*=(?:UTF-8'')?([^;]+)/i);
        if (star) {
            try {
                return decodeURIComponent(star[1].trim().replace(/^["']|["']$/g, ''));
            } catch (e) { /* ignore */ }
        }
        var q = cd.match(/filename="((?:\\.|[^"\\])*)"/);
        if (q) return q[1].replace(/\\"/g, '"');
        var u = cd.match(/filename=([^;\s]+)/);
        if (u) return u[1].trim().replace(/^["']|["']$/g, '');
        return null;
    }

    async function downloadStageApiPayload(stageKey, block) {
        const btn = block.querySelector('.rewrite-stage-api-export');
        if (btn) btn.disabled = true;
        try {
            const r = await fetch(apiPayloadUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ stage: stageKey }, collectSnapshot()))
            });
            var fname = openaiExportRewriteId + '_' + stageKey + '_openai_request.json';
            var cd = r.headers.get('Content-Disposition');
            if (cd) {
                var fromHdr = parseContentDispositionFilename(cd);
                if (fromHdr) {
                    fname = fromHdr;
                }
            }
            if (/\.txt$/i.test(fname)) {
                fname = fname.replace(/\.txt$/i, '.json');
            }
            if (!r.ok) {
                var errData = await r.json().catch(function () { return {}; });
                alert(errData.message || 'Не удалось сформировать запрос');
                return;
            }
            var blob = await r.blob();
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fname;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            alert(String(e));
        } finally {
            syncStageRunButtons();
        }
    }

    // --- Browser-independent task reattach ----------------------------------
    // На загрузке страницы: спрашиваем сервер, есть ли активные фоновые задачи
    // для этого проекта (например, пользователь нажал Run и закрыл/обновил вкладку).
    // Для каждой активной задачи находим карточку этапа и подключаемся к её
    // event-стриму с самого начала (since=-1), чтобы получить весь лог + live tail.
    (async function reattachActiveTasksOnLoad() {
        if (!tasksActiveUrl) return;
        try {
            var resp = await fetch(tasksActiveUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            if (!resp.ok) return;
            var data = await resp.json();
            if (!data || !data.ok || !Array.isArray(data.tasks) || data.tasks.length === 0) return;
            data.tasks.forEach(function (t) {
                if (!t || !t.task_id) return;
                if (t.kind === 'translate_source_ru' && String(t.ref_id || '') === 'source') {
                    if (typeof window.__rewriteTranslateRuAttach === 'function') {
                        window.__rewriteTranslateRuAttach(t.task_id).catch(function (e) {
                            console.warn('[rewrite] reattach translate RU failed', e);
                        });
                    }
                    return;
                }
                if (t.kind === 'semantic_text_analyzer' && String(t.ref_id || '') === 'semantic') {
                    if (typeof window.__rewriteSemanticAttach === 'function') {
                        window.__rewriteSemanticAttach(t.task_id).catch(function (e) {
                            console.warn('[rewrite] reattach semantic analyzer failed', e);
                        });
                    }
                    return;
                }
                if (t.kind === 'semantic_text_analyzer_voiceover_final' && String(t.ref_id || '') === 'voiceover_final_semantic') {
                    if (typeof window.__rewriteSemanticVoiceoverFinalAttach === 'function') {
                        window.__rewriteSemanticVoiceoverFinalAttach(t.task_id).catch(function (e) {
                            console.warn('[rewrite] reattach semantic voiceover final failed', e);
                        });
                    }
                    return;
                }
                if (!t || t.kind !== 'stage' || !t.ref_id) return;
                var stageKey = String(t.ref_id || '').trim();
                if (!stageKey) return;
                var card = document.querySelector('.rewrite-stage-card[data-stage-key="' + stageKey + '"]');
                if (!card) return;
                if (card.getAttribute('data-run-started-at')) return;
                console.log('[rewrite] re-attaching to background task', t.task_id, 'for stage', stageKey);
                runStage(stageKey, card, { manageBusy: false, attachTask: { task_id: t.task_id, since_seq: -1 } })
                    .catch(function (e) { console.warn('[rewrite] reattach failed for', stageKey, e); });
            });
        } catch (e) {
            console.warn('[rewrite] reattach query failed:', e);
        }
    })();

    // Скрываем карточки, не входящие в выбранный пресет; обновляем кнопку «Отобразить»
    // и список COLLAPSIBLE_PIPELINE_STAGE_KEYS,
    // чтобы кнопки сворачивали именно «первые 10» текущего пресета. Сохраняем
    // выбор пользователя через общий saveToServer (поле rewrite_preset).
    function applyRewritePresetVisibility(preset) {
        var validPresets = { deep: true, soft: true, prewritten: true };
        var presetKey = String(preset || '').trim() || 'deep';
        if (!validPresets[presetKey]) {
            console.warn('[rewrite] invalid preset, using deep:', preset);
            presetKey = 'deep';
            currentRewritePreset = presetKey;
            syncPresetToggleButtonsUI(presetKey);
        }
        var presetKeys = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[presetKey]) || [];
        if (!presetKeys.length) {
            console.error('[rewrite] empty stage list after merge for preset:', presetKey);
        }
        var presetSet = {};
        presetKeys.forEach(function (k) { presetSet[k] = true; });
        var indexByKey = {};
        presetKeys.forEach(function (k, i) { indexByKey[k] = i + 1; });
        document.querySelectorAll('.rewrite-stage-card').forEach(function (card) {
            var key = card.getAttribute('data-stage-key') || '';
            if (!key) return;
            var inPreset = !!presetSet[key] || !!REWRITE_ALWAYS_VISIBLE_STAGE_KEYS[key];
            card.classList.toggle('rewrite-stage-card--hidden-by-preset', !inPreset);
            // Пересчёт нумерации этапа: в пределах текущего пресета.
            var idxEl = card.querySelector('.rewrite-stage-index');
            if (idxEl && inPreset) {
                var n = indexByKey[key];
                if (n) {
                    idxEl.textContent = String(n);
                    idxEl.setAttribute('aria-label', 'Этап ' + n);
                    idxEl.setAttribute('data-stage-display-index', String(n));
                } else {
                    idxEl.textContent = '';
                    idxEl.removeAttribute('aria-label');
                    idxEl.removeAttribute('data-stage-display-index');
                }
            }
        });
        // collapsible_pipeline_stages: до 11 этапов с начала пресета (без модулей вне пресета).
        COLLAPSIBLE_PIPELINE_STAGE_KEYS = [];
        for (var pi = 0; pi < presetKeys.length && COLLAPSIBLE_PIPELINE_STAGE_KEYS.length < 11; pi++) {
            var pk = presetKeys[pi];
            COLLAPSIBLE_PIPELINE_STAGE_KEYS.push(pk);
        }
        var stageRangeEl = document.getElementById('rewrite-stages-pipeline-stage-range');
        if (stageRangeEl) {
            var _labelEnd = 0;
            for (var _li = 0; _li < COLLAPSIBLE_PIPELINE_STAGE_KEYS.length; _li++) {
                var _lk = COLLAPSIBLE_PIPELINE_STAGE_KEYS[_li];
                if (!PIPELINE_LABEL_SKIP[_lk]) _labelEnd++;
            }
            stageRangeEl.textContent = 'Этапы 1\u2013' + _labelEnd;
        }
        // На карточках в выбранных «верхних 11» проставим атрибут data-pipeline-collapse=1
        // — он используется setAllCollapsed для массового сворачивания. В первоначальном
        // server-render это уже сделано для текущего пресета; при переключении пересчитываем.
        document.querySelectorAll('.rewrite-stage-card').forEach(function (card) {
            var key = card.getAttribute('data-stage-key') || '';
            if (COLLAPSIBLE_PIPELINE_STAGE_KEYS.indexOf(key) >= 0) {
                card.setAttribute('data-pipeline-collapse', '1');
            } else {
                card.removeAttribute('data-pipeline-collapse');
            }
            if (REWRITE_ALWAYS_VISIBLE_STAGE_KEYS[key]) {
                card.classList.add('rewrite-stage-card--body-collapsed');
                card.setAttribute('aria-expanded', 'false');
            }
            // Если этап выпал из видимого пресета, не оставляем его в "свёрнутом"
            // состоянии — иначе при возврате он откроется уже схлопнутым визуально.
            var vis = !!presetSet[key] || !!REWRITE_ALWAYS_VISIBLE_STAGE_KEYS[key];
            if (!vis) {
                card.classList.remove('rewrite-stage-card--body-collapsed');
            }
        });
        if (typeof window.__rewriteSyncPipelineDisplayBtn === 'function') {
            try { window.__rewriteSyncPipelineDisplayBtn(); } catch (_) { /* ignore */ }
        }
        syncRewriteStageSubtitles(presetKey);
        document.querySelectorAll('.rewrite-stage-card').forEach(function (card) {
            var sk = card.getAttribute('data-stage-key') || '';
            if (REWRITE_JSON_SPLIT_STAGES[sk]) renderEditorCheck(card);
        });
        try { syncPipelineRunButton(); } catch (_) { /* ignore */ }
    }

    (function bindRewritePresetToggle() {
        var REWRITE_PRESET_IDS = ['deep', 'soft', 'prewritten'];
        if (REWRITE_PRESET_IDS.indexOf(String(currentRewritePreset || '')) < 0) {
            currentRewritePreset = 'deep';
        }
        async function applyPresetChange(preset) {
            if (preset === currentRewritePreset) return;
            var okPreset = await openPresetChangeConfirm();
            if (!okPreset) {
                syncPresetToggleButtonsUI(currentRewritePreset);
                return;
            }
            if (rewriteStageBusy || rewriteStageHasActiveStatusRow()) {
                alert('Дождитесь завершения запущенного этапа.');
                syncPresetToggleButtonsUI(currentRewritePreset);
                return;
            }
            currentRewritePreset = preset;
            rewriteLsPresetSave(rewriteIdForStageCollapse, preset);
            syncPresetToggleButtonsUI(preset);
            applyRewritePresetVisibility(preset);
            if (typeof window.__rewriteSetAllCollapsed === 'function') {
                try { window.__rewriteSetAllCollapsed(true); } catch (_) { /* ignore */ }
            }
            if (typeof window.__rewriteCollapseAlwaysCollapsedUiSections === 'function') {
                try { window.__rewriteCollapseAlwaysCollapsedUiSections(); } catch (_) { /* ignore */ }
            }
            performClearRewritePresetSwitchableStagesDom();
            try { syncStageRunButtons(); } catch (_) { /* ignore */ }
            if (window.__rewriteSyncTranslateRuRunPrereq) window.__rewriteSyncTranslateRuRunPrereq();
            if (window.__rewriteSyncSemanticRunPrereq) window.__rewriteSyncSemanticRunPrereq();
            try {
                var okSave = await saveToServer();
                if (!okSave) alert('Не удалось сохранить на сервере');
            } catch (e) {
                console.warn('[rewrite] preset save failed:', e);
                alert(String(e));
            }
        }
        function finishPresetUiAfterVisibility() {
            syncPresetToggleButtonsUI(currentRewritePreset);
            try { syncStageRunButtons(); } catch (_) { /* ignore */ }
            if (typeof window.__rewriteApplyStageCollapseFromStorage === 'function') {
                try { window.__rewriteApplyStageCollapseFromStorage(); } catch (_) { /* ignore */ }
            }
            if (typeof window.__rewriteCollapseAlwaysCollapsedUiSections === 'function') {
                try { window.__rewriteCollapseAlwaysCollapsedUiSections(); } catch (_) { /* ignore */ }
            }
        }
        var presetSel = document.getElementById('rewrite-preset-select');
        var presetButtons = document.querySelectorAll('.rewrite-preset-toggle__btn');

        if (presetButtons.length) {
            presetButtons.forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    var preset = btn.getAttribute('data-rewrite-preset') || 'deep';
                    if (REWRITE_PRESET_IDS.indexOf(preset) < 0) preset = 'deep';
                    await applyPresetChange(preset);
                });
            });
            applyRewritePresetVisibility(currentRewritePreset);
            finishPresetUiAfterVisibility();
            if (!rewriteLsPresetRead(rewriteIdForStageCollapse)) {
                rewriteLsPresetSave(rewriteIdForStageCollapse, currentRewritePreset);
            }
            return;
        }
        if (presetSel) {
            try { presetSel.value = currentRewritePreset; } catch (_) { /* ignore */ }
            var sv = String(presetSel.value || '');
            if (REWRITE_PRESET_IDS.indexOf(sv) < 0) {
                try { presetSel.value = 'deep'; } catch (_) { /* ignore */ }
                currentRewritePreset = 'deep';
            }
            presetSel.addEventListener('change', async function () {
                var preset = String(presetSel.value || 'deep').trim() || 'deep';
                if (REWRITE_PRESET_IDS.indexOf(preset) < 0) preset = 'deep';
                await applyPresetChange(preset);
            });
            applyRewritePresetVisibility(currentRewritePreset);
            finishPresetUiAfterVisibility();
            if (!rewriteLsPresetRead(rewriteIdForStageCollapse)) {
                rewriteLsPresetSave(rewriteIdForStageCollapse, currentRewritePreset);
            }
            return;
        }
    })();

    // ===== Semantic Text Analyzer =====
    // Фоновая задача (task_manager): после F5 подключаемся к /tasks/<id>/events.
    // На время работы прячем textarea-обёртку и показываем синий dashed
    // .slot-placeholder со спиннером и Cancel (как у Russian / этапов).
    (function setupSemanticAnalyzer() {
        var block = document.getElementById('semantic-analyzer-block');
        if (!block) {
            window.__rewriteSyncSemanticRunPrereq = function () {};
            return;
        }
        var runBtn = document.getElementById('semantic-analyzer-run-btn');
        var cancelBtn = document.getElementById('semantic-analyzer-cancel-btn');
        var statusEl = document.getElementById('semantic-analyzer-result-status');
        var statusWrap = document.getElementById('semantic-analyzer-status-wrap');

        var copyBtn = document.getElementById('semantic-analyzer-result-copy-btn');

        if (!runBtn || !statusEl || !resultEl || !semanticAnalyzerStartUrl) {
            window.__rewriteSyncSemanticRunPrereq = function () {};
            return;
        }

        var semanticAbort = null;
        var semanticRunning = false;

            var m = s.match(/^```[a-zA-Z0-9_-]*\s*\n([\s\S]*?)\n?```$/);

        async function followSemanticEventStream(taskId, signal) {
            var res = await fetch(rewriteTaskEventsUrl(taskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (!res.ok) {
                setSemanticStatus('Ошибка подписки на задачу: HTTP ' + res.status, 'err');
                return false;
            }
            var reader = res.body && res.body.getReader();
            if (!reader) {
                setSemanticStatus('Браузер не поддерживает потоковое чтение ответа.', 'err');
                return false;
            }
            var dec = new TextDecoder('utf-8');
            var buf = '';
            var outText = '';
            var hadError = false;
            var gotResult = false;
            while (true) {
                var rd = await reader.read();
                if (rd.done) break;
                buf += dec.decode(rd.value, { stream: true });
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx);
                    buf = buf.slice(idx + 1);
                    if (!line.trim()) continue;
                    var ev = null;
                    try { ev = JSON.parse(line); } catch (e2) { continue; }
                    var msg = String((ev && ev.message) || '');
                    if (ev && ev.type === 'status') {
                        setSemanticStatus(msg, null);
                    } else if (ev && ev.type === 'error') {
                        hadError = true;
                        setSemanticStatus(msg || 'Ошибка', 'err');
                    } else if (ev && ev.type === 'result') {
                        outText = String(ev.content || '');
                        gotResult = true;
                    }
                }
            }
            if (gotResult && resultEl) {
                resultEl.value = outText;
                semanticAnalysisLocked = true;
                applySemanticResultLockUI();
                applyTextBadgeState(semanticBadgeEl, resultEl);
                refreshSemanticPreview();
                scheduleAutosave(0);
                return true;
            }
            return false;
        }

            setSemanticBusy(true);

            semanticTaskId = null;

            try {

                    hadError = true;
                    var se = (startData && (startData.message || startData.error)) || ('HTTP ' + startResp.status);

        async function followVfSemanticEventStream(taskId, signal) {
            var res = await fetch(rewriteTaskEventsUrl(taskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (!res.ok) {
                setVfSemanticStatus('Ошибка подписки на задачу: HTTP ' + res.status, 'err');
                return false;
            }
            var reader = res.body && res.body.getReader();
            if (!reader) {
                setVfSemanticStatus('Браузер не поддерживает потоковое чтение ответа.', 'err');
                return false;
            }
            var dec = new TextDecoder('utf-8');
            var buf = '';
            var outText = '';
            var hadError = false;
            var gotResult = false;
            while (true) {
                var rd = await reader.read();
                if (rd.done) break;
                buf += dec.decode(rd.value, { stream: true });
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx);
                    buf = buf.slice(idx + 1);
                    if (!line.trim()) continue;
                    var ev = null;
                    try { ev = JSON.parse(line); } catch (e2) { continue; }
                    var msg = String((ev && ev.message) || '');
                    if (ev && ev.type === 'status') {
                        setVfSemanticStatus(msg, null);
                    } else if (ev && ev.type === 'error') {
                        hadError = true;
                        setVfSemanticStatus(msg || 'Ошибка', 'err');
                    } else if (ev && ev.type === 'result') {
                        outText = String(ev.content || '');
                        gotResult = true;
                    }
                }
            }
            if (gotResult && resultEl) {
                resultEl.value = outText;
                voiceoverFinalSemanticLocked = true;
                applyVoiceoverFinalSemanticResultLockUI();
                if (semanticVfFinalBadgeEl) applyTextBadgeState(semanticVfFinalBadgeEl, resultEl);
                refreshVfSemanticPreview();
                scheduleAutosave(0);
                return true;
            }
            return false;
        }

        async function runVfSemantic() {

            setVfSemanticBusy(true);
            setVfSemanticStatus('Запуск Semantic по итогу…', null);
            vfSemTaskId = null;
            vfSemAbort = new AbortController();
            var hadError = false;
            var wasAborted = false;
            try {
                var modelVal = getLangStagesModel();
                var startResp = await fetch(semanticVoiceoverFinalStartUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ voiceover_final_text_ru: src, model: modelVal }),
                    signal: vfSemAbort.signal
                });
                var startData = null;
                try { startData = await startResp.json(); } catch (_) { startData = null; }
                if (!startResp.ok || !startData || !startData.ok || !startData.task || !startData.task.task_id) {
                    hadError = true;
                    var se = (startData && (startData.message || startData.error)) || ('HTTP ' + startResp.status);
                    setVfSemanticStatus('Не удалось запустить: ' + se, 'err');
                    return false;
                }
                vfSemTaskId = startData.task.task_id;
                setVfSemanticStatus('Задача запущена, подключаюсь к событиям…', null);
                var okFollow = await followVfSemanticEventStream(vfSemTaskId, vfSemAbort.signal);
                if (!okFollow) hadError = true;
                return okFollow && !hadError;
            } catch (e) {
                if (e && (e.name === 'AbortError' || String(e).indexOf('aborted') !== -1)) {
                    wasAborted = true;
                    setVfSemanticStatus('Отменено.', null);
                } else {
                    hadError = true;
                    setVfSemanticStatus('Ошибка: ' + String(e && e.message ? e.message : e), 'err');
                }
                return false;
            } finally {
                vfSemTaskId = null;
                vfSemAbort = null;
                if (hadError || wasAborted) {
                    var lastMsg = statusEl ? String(statusEl.textContent || '') : '';
                    setVfSemanticError(lastMsg || 'Ошибка');
                } else {
                    setVfSemanticBusy(false);
                }
            }
        }

        wireCompactBtn(compactRuBtn, ruBtn);
        wireCompactBtn(compactSaBtn, saBtn);
        wireCompactBtn(headerCompactRuBtn, ruBtn);
        wireCompactBtn(headerCompactSaBtn, saBtn);

        var btnObsCfg = { attributes: true, attributeFilter: ['class', 'disabled', 'title', 'aria-label'] };
        var badgeObsCfg = { attributes: true, attributeFilter: ['class'] };
        var obs = new MutationObserver(syncAll);
        if (ruBadge) obs.observe(ruBadge, badgeObsCfg);
        if (saBadgeMain) obs.observe(saBadgeMain, badgeObsCfg);
        if (ruBtn) obs.observe(ruBtn, btnObsCfg);
        if (saBtn) obs.observe(saBtn, btnObsCfg);
        syncAll();
    })();

    // ===== «Исходный текст»: Russian / Semantic только вручную (↻) =====
    // При ✓ на Source и смене модели — полная очистка, без авто-запуска.
    (function setupSourceRuSemanticManualOnly() {
        window.__rewriteStagesRestartChain = function () {
            if (typeof window.__rewriteClearRuAndSemanticDom === 'function') {
                try { window.__rewriteClearRuAndSemanticDom(); } catch (_e) {}
            }
        };
    })();

    // ===== Locked prompts (промты «под пин-кодом») =====
    // Один диалог обслуживает все защищённые промты. Какой именно
    // редактируем — определяется по data-locked-prompt-edit="<name>" на
    // кнопке-карандашике. Текущее активное имя живёт в `state.name`.
    (function setupLockedPromptModal() {
        const modal = document.getElementById('locked-prompt-modal');
        if (!modal) return;
        const card = modal.querySelector('.confirm-modal__card');
        const title = document.getElementById('locked-prompt-modal-title');
        const textarea = document.getElementById('locked-prompt-modal-textarea');
        const msg = document.getElementById('locked-prompt-modal-msg');
        const dotsWrap = document.getElementById('locked-prompt-modal-pin-dots');
        const keypad = document.getElementById('locked-prompt-modal-keypad');
        const closeBtn = modal.querySelector('[data-locked-prompt-modal-close].locked-prompt-modal__head-btn');
        const resetBtn = document.getElementById('locked-prompt-modal-reset');
        if (!textarea || !msg || !dotsWrap || !keypad) return;
        const dots = Array.from(dotsWrap.querySelectorAll('.locked-prompt-modal__pin-dot'));
        const PIN_LEN = 4;
        const state = { name: null, label: '', pin: '', loadedContent: '', saving: false };

        function setMsg(text, kind) {
            msg.textContent = text || '';
            msg.classList.remove('hidden', 'locked-prompt-modal__msg--err', 'locked-prompt-modal__msg--ok');
            if (!text) { msg.classList.add('hidden'); return; }
            if (kind === 'err') msg.classList.add('locked-prompt-modal__msg--err');
            else if (kind === 'ok') msg.classList.add('locked-prompt-modal__msg--ok');
        }
        function renderDots() {
            dots.forEach((d, i) => {
                if (i < state.pin.length) d.classList.add('locked-prompt-modal__pin-dot--filled');
                else d.classList.remove('locked-prompt-modal__pin-dot--filled');
            });
        }
        function openModal() {
            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('locked-prompt-modal-open');
            try { textarea.focus(); } catch (_) {}
        }
        function closeModal() {
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('locked-prompt-modal-open');
            state.name = null;
            state.pin = '';
            state.loadedContent = '';
            state.saving = false;
            textarea.value = '';
            setMsg('', null);
            renderDots();
        }
        async function loadContent(name) {
            setMsg('Загрузка…', null);
            try {
                const resp = await fetch(lockedPromptApiUrl(name), { method: 'GET', credentials: 'same-origin' });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.ok) {
                    var errPart = (data && data.error) ? String(data.error) : String(resp.status);
                    var reqPart = (data && data.requested) ? (' («' + String(data.requested) + '»)') : '';
                    setMsg('Не удалось загрузить промт: ' + errPart + reqPart, 'err');
                    return false;
                }
                state.loadedContent = String(data.content || '');
                textarea.value = state.loadedContent;
                if (data.label) title.textContent = String(data.label);
                updateBadge(name, !!data.present);
                setMsg('', null);
                return true;
            } catch (e) {
                setMsg('Сеть/сервер недоступны: ' + (e && e.message ? e.message : e), 'err');
                return false;
            }
        }
        function updateBadge(name, present) {
            document.querySelectorAll('[data-locked-prompt-badge="' + name + '"]').forEach(function (badge) {
            if (!badge) return;
            var nm = String(name || '');
            var label;
            if (nm === 'rewrite_system_rules' || nm.endsWith('_system_rules')) {
                label = 'System Rules: ';
            } else if (nm.indexOf('system_prompt_') === 0) {
                label = 'System Promt: ';
            } else if (nm.indexOf('user_prompt_') === 0) {
                label = 'User Promt: ';
            } else if (nm.slice(-5) === '_user') {
                label = 'User Promt: ';
            } else {
                label = 'System Promt: ';
            }
            badge.textContent = label + (present ? 'YES' : 'NO');
            badge.classList.toggle('locked-prompt-badge--yes', present);
            badge.classList.toggle('locked-prompt-badge--no', !present);
            });
        }
        function refreshAllLockedPromptBadges() {
            document.querySelectorAll('[data-locked-prompt-badge]').forEach(function (badge) {
                var name = (badge.getAttribute('data-locked-prompt-badge') || '').trim();
                if (!name) return;
                var st = LOCKED_PROMPTS_STATE && LOCKED_PROMPTS_STATE[name];
                updateBadge(name, !!(st && st.present));
            });
        }
        refreshAllLockedPromptBadges();
        async function save() {
            if (!state.name || state.saving) return;
            if (state.pin.length !== PIN_LEN) {
                setMsg('Введите ' + PIN_LEN + ' цифр пин-кода.', 'err');
                return;
            }
            state.saving = true;
            setMsg('Сохраняем…', null);
            try {
                const resp = await fetch(lockedPromptApiUrl(state.name), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: state.pin, content: textarea.value }),
                    credentials: 'same-origin',
                });
                const data = await resp.json().catch(() => ({}));
                if (resp.status === 401) {
                    setMsg('Неверный пин-код.', 'err');
                    state.pin = '';
                    renderDots();
                    state.saving = false;
                    return;
                }
                if (!resp.ok || !data.ok) {
                    setMsg('Не удалось сохранить: ' + (data && data.error ? data.error : resp.status), 'err');
                    state.saving = false;
                    return;
                }
                state.loadedContent = textarea.value;
                updateBadge(state.name, !!data.present);
                setMsg('Сохранено.', 'ok');
                state.pin = '';
                renderDots();
                state.saving = false;
                setTimeout(closeModal, 600);
            } catch (e) {
                setMsg('Сеть/сервер недоступны: ' + (e && e.message ? e.message : e), 'err');
                state.saving = false;
            }
        }
        function pushDigit(d) {
            if (state.pin.length >= PIN_LEN) return;
            state.pin += d;
            renderDots();
            if (state.pin.length === PIN_LEN) {
                // Автосохранение по полному пину — как «нажал OK на клавиатуре телефона».
                save();
            }
        }
        function popDigit() {
            if (state.pin.length === 0) return;
            state.pin = state.pin.slice(0, -1);
            renderDots();
        }

        // ----- Глобальный делегат для кнопок ✎ возле защищённых промтов -----
        document.addEventListener('click', async (ev) => {
            const btn = ev.target.closest && ev.target.closest('[data-locked-prompt-edit]');
            if (!btn) return;
            ev.preventDefault();
            const name = (btn.getAttribute('data-locked-prompt-edit') || '').trim();
            const label = btn.getAttribute('data-locked-prompt-label') || 'Промт';
            if (!name) return;
            state.name = name;
            state.label = label;
            state.pin = '';
            renderDots();
            title.textContent = label;
            textarea.value = '';
            openModal();
            await loadContent(name);
        });

        // ----- Кнопки модалки -----
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                textarea.value = state.loadedContent;
                setMsg('Текст возвращён к сохранённому на сервере.', 'ok');
            });
        }
        modal.addEventListener('click', (ev) => {
            const t = ev.target;
            if (t && t.hasAttribute && t.hasAttribute('data-locked-prompt-modal-close')) closeModal();
        });

        // ----- Keypad -----
        keypad.addEventListener('click', (ev) => {
            const k = ev.target.closest && ev.target.closest('button');
            if (!k) return;
            const d = k.getAttribute('data-pin-digit');
            if (d != null) { pushDigit(d); return; }
        });

        // ----- Клавиатура: цифры/Backspace/Enter/Escape пока открыто -----
        document.addEventListener('keydown', (ev) => {
            if (modal.classList.contains('hidden')) return;
            const tgt = ev.target;
            const inTextarea = tgt && tgt.tagName === 'TEXTAREA';
            if (inTextarea) {
                // Не перехватываем ввод в textarea, кроме Escape.
                if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); }
                return;
            }
            if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
            if (ev.key === 'Enter') { ev.preventDefault(); save(); return; }
            if (ev.key === 'Backspace') { ev.preventDefault(); popDigit(); return; }
            if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pushDigit(ev.key); return; }
        });
    })();
    if (typeof window.__restoreJobElevenlabsFromServer === 'function') {
        try { window.__restoreJobElevenlabsFromServer(); } catch (_eRestoreTts) { /* ignore */ }
        setTimeout(function () {
            try { window.__restoreJobElevenlabsFromServer(); } catch (_eRestoreTts2) { /* ignore */ }
        }, 0);
    }
})();
    </script>
