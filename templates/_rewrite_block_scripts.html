    <script>
(function () {
    const runUrl = {{ url_for('rewrite_project_run', rewrite_id=rw.rewrite_id) | tojson }};
    const runStartUrl = {{ url_for('rewrite_project_run_start', rewrite_id=rw.rewrite_id) | tojson }};
    const tasksActiveUrl = {{ url_for('rewrite_project_tasks_active', rewrite_id=rw.rewrite_id) | tojson }};

        var u = '/rewrite/' + encodeURIComponent(openaiExportRewriteId) + '/tasks/' + encodeURIComponent(taskId) + '/events';
        if (typeof sinceSeq === 'number' && !isNaN(sinceSeq)) {
            u += '?since=' + encodeURIComponent(String(sinceSeq));
        }
        return u;
    }
    function rewriteTaskCancelUrl(taskId) {
        return '/rewrite/' + encodeURIComponent(openaiExportRewriteId) + '/tasks/' + encodeURIComponent(taskId) + '/cancel';
    }
    const apiPayloadUrl = {{ url_for('rewrite_project_api_payload', rewrite_id=rw.rewrite_id) | tojson }};
    const blockWriterCheckUrl = {{ url_for('rewrite_block_writer_check_get', rewrite_id=rw.rewrite_id) | tojson }};
    const openaiExportRewriteId = {{ rw.rewrite_id | tojson }};
    const rewriteTemplateRadioGroup = 'rewrite-template-radio-' + openaiExportRewriteId;
    const saveUrl = {{ url_for('rewrite_project_save', rewrite_id=rw.rewrite_id) | tojson }};
    const translateRuUrl = {{ url_for('rewrite_translate_source_ru', rewrite_id=rw.rewrite_id) | tojson }};
    const translateVoFinalRuUrl = {{ url_for('rewrite_translate_voiceover_final_ru', rewrite_id=rw.rewrite_id) | tojson }};
    const ytVerifyUrl = {{ url_for('rewrite_youtube_verify', rewrite_id=rw.rewrite_id) | tojson }};
    const ytDownloadUrl = {{ url_for('rewrite_youtube_download', rewrite_id=rw.rewrite_id) | tojson }};
    const ytDownloadStreamUrl = {{ url_for('rewrite_youtube_download_stream', rewrite_id=rw.rewrite_id) | tojson }};
    const ytTranscribeUrl = {{ url_for('rewrite_youtube_transcribe', rewrite_id=rw.rewrite_id) | tojson }};
    const ytTranscribeStreamUrl = {{ url_for('rewrite_youtube_transcribe_stream', rewrite_id=rw.rewrite_id) | tojson }};
    const ytTranscriptUrl = {{ url_for('rewrite_youtube_transcript_get', rewrite_id=rw.rewrite_id) | tojson }};
    const ytCookiesStatusUrl = {{ url_for('rewrite_youtube_cookies_status', rewrite_id=rw.rewrite_id) | tojson }};
    const ytCookiesUploadUrl = {{ url_for('rewrite_youtube_cookies_upload', rewrite_id=rw.rewrite_id) | tojson }};
    const busy = document.getElementById('rewrite-busy');
    const sourceEl = document.getElementById('rewrite-source-text');

    const translateRuStatusWrap = document.getElementById('rewrite-source-translate-ru-status-wrap');
    const translateRuCancelBtn = document.getElementById('rewrite-source-translate-ru-cancel');

    const sourceCountsEl = document.getElementById('rewrite-source-counts');
    const sourceRuToggleBtn = document.getElementById('rewrite-source-ru-toggle');
    const sourceRuCountsEl = document.getElementById('rewrite-source-ru-counts');
    const masterEl = document.getElementById('rewrite-master-prompt');
    const masterToggleBtn = document.getElementById('rewrite-master-toggle');
    const sourceToggleBtn = document.getElementById('rewrite-source-toggle');
    const heroToggleBtn = document.getElementById('rewrite-hero-toggle');
    const audioToggleBtn = document.getElementById('rewrite-audio-toggle');
    let sourceLocked = {{ rw.source_locked|default(false)|tojson }};
    let sourceRuLocked = {{ rw.source_text_ru_locked|default(false)|tojson }};
    let voiceoverFinalLocked = {{ rw.voiceover_final_locked|default(true)|tojson }};
    let voiceoverFinalTextRuLocked = {{ rw.voiceover_final_text_ru_locked|default(false)|tojson }};
    let masterLocked = {{ rw.master_prompt_locked|default(false)|tojson }};
    let heroLocked = {{ rw.hero_prompt_locked|default(false)|tojson }};
    let audioTimingLocked = {{ rw.audio_timing_locked|default(false)|tojson }};
    /* Не полагаемся на data-openai-key у body: на странице job скрипт может
       выполняться в контексте, где атрибут ещё не учитывается, или HTML закэширован.
       Источник истины — тот же флаг, что в шаблоне для disabled у полей. */
    const openaiOk = {{ openai_key_set|tojson }};
    const STAGE_KEYS_ORDER = {{ rewrite_stage_key_order | tojson }};
    const STAGE_LABELS = {{ dict(rewrite_stages) | tojson }};
    let COLLAPSIBLE_PIPELINE_STAGE_KEYS = {{ collapsible_pipeline_stages | tojson }};

    let currentRewritePreset = {{ rewrite_preset_current | tojson }};
    const rewriteIdForStageCollapse = {{ rw.rewrite_id | tojson }};
    const REWRITE_STAGE_COLLAPSE_LS = 'jsonVideoRewriteStageCollapseV1';
    const targetCharsRangeEl = document.getElementById('rewrite-target-chars');
    const targetCharsValEl = document.getElementById('rewrite-target-chars-val');
    const heroPromptEl = document.getElementById('rewrite-hero-prompt');
    const templateSelectEl = document.getElementById('rewrite-template-select');
    const templateCreateBtn = document.getElementById('rewrite-template-create');
    const templateDeleteBtn = document.getElementById('rewrite-template-delete');
    const templateApplyBtn = document.getElementById('rewrite-template-apply');
    const templateOpStatusEl = document.getElementById('rewrite-template-op-status');
    const ytUrlEl = document.getElementById('rewrite-youtube-url');
    const ytDecodeBtn = document.getElementById('rewrite-youtube-decode');
    const ytStopBtn = document.getElementById('rewrite-youtube-stop');
    const ytInsertBtn = document.getElementById('rewrite-youtube-insert');
    const ytStatusEl = document.getElementById('rewrite-youtube-status');
    const ytVideoLineEl = document.getElementById('rewrite-youtube-video-line');
    const ytVideoTitleTextEl = document.getElementById('rewrite-youtube-video-title');
    const ytChannelAvatarEl = document.getElementById('rewrite-youtube-channel-avatar');
    const ytChannelNameEl = document.getElementById('rewrite-youtube-channel-name');
    const ytChannelLinkEl = document.getElementById('rewrite-youtube-channel-link');
    const ytCardEl = document.getElementById('rewrite-youtube-card');
    const ytLockOverlay = document.getElementById('rewrite-youtube-lock-overlay');
    const ytUnlockBtn = document.getElementById('rewrite-youtube-unlock-btn');
    const ytEditConfirmModal = document.getElementById('rewrite-youtube-edit-confirm-modal');
    const ytEditConfirmCancelBtn = document.getElementById('rewrite-youtube-edit-confirm-cancel');
    const ytEditConfirmOkBtn = document.getElementById('rewrite-youtube-edit-confirm-ok');
    const ytInsertConfirmModal = document.getElementById('rewrite-youtube-insert-confirm-modal');
    const ytInsertConfirmCancelBtn = document.getElementById('rewrite-youtube-insert-confirm-cancel');
    const ytInsertConfirmOkBtn = document.getElementById('rewrite-youtube-insert-confirm-ok');
    const ytCookiesAgeEl = document.getElementById('rewrite-youtube-cookies-age');
    const ytCookiesOpenBtn = document.getElementById('rewrite-youtube-cookies-open');
    const ytCookiesLedEl = document.getElementById('rewrite-youtube-cookies-led');
    const ytCookiesModal = document.getElementById('rewrite-youtube-cookies-modal');
    const ytCookiesFileEl = document.getElementById('rewrite-youtube-cookies-file');
    const ytCookiesMsgEl = document.getElementById('rewrite-youtube-cookies-msg');
    const ytCookiesModalCancelBtn = document.getElementById('rewrite-youtube-cookies-modal-cancel');
    const ytCookiesModalSaveBtn = document.getElementById('rewrite-youtube-cookies-modal-save');
    const ytProxyStatusUrl = {{ url_for('rewrite_youtube_proxy_status', rewrite_id=rw.rewrite_id) | tojson }};
    const ytProxySaveUrl = {{ url_for('rewrite_youtube_proxy_save', rewrite_id=rw.rewrite_id) | tojson }};
    const ytProxyOpenBtn = document.getElementById('rewrite-youtube-proxy-open');
    const ytProxyLedEl = document.getElementById('rewrite-youtube-proxy-led');
    const ytProxyModal = document.getElementById('rewrite-youtube-proxy-modal');
    const ytProxyModalCancelBtn = document.getElementById('rewrite-youtube-proxy-modal-cancel');
    const ytProxyInputEl = document.getElementById('rewrite-youtube-proxy-input');
    const ytProxyMsgEl = document.getElementById('rewrite-youtube-proxy-msg');
    const ytProxySaveBtn = document.getElementById('rewrite-youtube-proxy-save');
    const ytProxyClearBtn = document.getElementById('rewrite-youtube-proxy-clear');
    const ytProxyHintEl = document.getElementById('rewrite-youtube-proxy-hint');
    const templateApplyConfirmModal = document.getElementById('rewrite-template-apply-confirm-modal');
    const templateApplyConfirmCancelBtn = document.getElementById('rewrite-template-apply-confirm-cancel');
    const templateApplyConfirmOkBtn = document.getElementById('rewrite-template-apply-confirm-ok');
    const templateCreateModal = document.getElementById('rewrite-template-create-modal');
    const templateCreateNameEl = document.getElementById('rewrite-template-create-name');
    const templateCreateCancelBtn = document.getElementById('rewrite-template-create-cancel');
    const templateCreateOkBtn = document.getElementById('rewrite-template-create-ok');
    const templateDeleteModal = document.getElementById('rewrite-template-delete-modal');
    const templateDeleteLeadEl = document.getElementById('rewrite-template-delete-lead');
    const templateDeleteCancelBtn = document.getElementById('rewrite-template-delete-cancel');
    const templateDeleteOkBtn = document.getElementById('rewrite-template-delete-ok');
    {# `_rewrite_block.html` определяет `rw_yt_transcript_trim` через {% set %},
       но это локальная для include переменная — в этом скрипте она Undefined,
       а `Undefined != ''` в Jinja даёт `true` и поле блокировалось без причины.
       Вычисляем флаг здесь же, прямо из `rw`. #}
    let youtubeLocked = {{ ((rw.youtube_transcript_text or '')|trim != '')|tojson }};
    let youtubeEditConfirmResolver = null;
    let youtubeInsertConfirmResolver = null;
    let templateApplyConfirmResolver = null;
    let templateCreateResolver = null;
    let templateDeleteResolver = null;
    var ytTranscriptReady = false;
    var ytWorking = false;
    var ytAbortController = null;
    var ytStatePollTimer = null;
    var rewriteStageBusy = false;
    const REWRITE_TEMPLATE_NAMES_ON_DISK = {{ rewrite_template_names | tojson }};
    const globalModelEl = document.getElementById('rewrite-global-model');
    const templateListUrl = {{ url_for('rewrite_api_templates_list') | tojson }};
    const pipelineRunBtn = document.getElementById('rewrite-pipeline-run-btn');
    const pipelineStopBtn = document.getElementById('rewrite-pipeline-stop-btn');
    const pipelineLogEl = document.getElementById('rewrite-pipeline-log');
    var pipelineStatusForward = null;
    var pipelineAbortController = null;
    var pipelineRunActive = false;
    const rewriteDeleteConfirmModal = document.getElementById('rewrite-delete-confirm-modal');
    const rewriteDeleteConfirmCancelBtn = document.getElementById('rewrite-delete-confirm-cancel');
    const rewriteDeleteConfirmOkBtn = document.getElementById('rewrite-delete-confirm-ok');
    let rewriteDeleteConfirmResolver = null;


    function openRewriteDeleteConfirm() {
        if (!rewriteDeleteConfirmModal || !rewriteDeleteConfirmCancelBtn || !rewriteDeleteConfirmOkBtn) {
            return Promise.resolve(window.confirm('Точно удалить проект? Он будет удалён безвозвратно.'));
        }
        rewriteDeleteConfirmModal.classList.remove('hidden');
        rewriteDeleteConfirmModal.setAttribute('aria-hidden', 'false');
        return new Promise(function (resolve) {
            rewriteDeleteConfirmResolver = resolve;
        });
    }

    function closeRewriteDeleteConfirm(accepted) {
        if (!rewriteDeleteConfirmModal) return;
        rewriteDeleteConfirmModal.classList.add('hidden');
        rewriteDeleteConfirmModal.setAttribute('aria-hidden', 'true');
        if (rewriteDeleteConfirmResolver) {
            var fn = rewriteDeleteConfirmResolver;
            rewriteDeleteConfirmResolver = null;
            fn(Boolean(accepted));
        }
    }

    if (rewriteDeleteConfirmCancelBtn) rewriteDeleteConfirmCancelBtn.addEventListener('click', function () { closeRewriteDeleteConfirm(false); });
    if (rewriteDeleteConfirmOkBtn) rewriteDeleteConfirmOkBtn.addEventListener('click', function () { closeRewriteDeleteConfirm(true); });
    if (rewriteDeleteConfirmModal) {
        rewriteDeleteConfirmModal.addEventListener('click', function (e) {
            if (e.target && e.target.hasAttribute('data-rewrite-delete-confirm-close')) closeRewriteDeleteConfirm(false);
        });
    }

    var rewriteDeleteForm = document.querySelector('form[data-delete-confirm-form="1"]');
    if (rewriteDeleteForm) {
        rewriteDeleteForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var ok = await openRewriteDeleteConfirm();
            if (!ok) return;
            rewriteDeleteForm.submit();
        });
    }

    function syncPipelineStopButton() {
        if (!pipelineStopBtn) return;
        pipelineStopBtn.disabled = !openaiOk || !pipelineRunActive;
    }

    function appendPipelineRunnerLog(msg) {
        if (!pipelineLogEl) return;
        var t = new Date();
        var ts = t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        pipelineLogEl.textContent += '[' + ts + '] ' + msg + '\n';
        pipelineLogEl.scrollTop = pipelineLogEl.scrollHeight;
    }

    function clampTargetChars(v) {
        var n = parseInt(v, 10);
        if (isNaN(n)) return 1500;
        var stepped = Math.round(n / 500) * 500;
        return Math.min(40000, Math.max(500, stepped));
    }

    function setYtStatus(msg, isError) {
        if (!ytStatusEl) return;
        ytStatusEl.textContent = msg || '';
        ytStatusEl.classList.toggle('rewrite-youtube-status--error', !!isError);
    }

    function _ytLineHasContent() {
        var hasTitle = !!(ytVideoTitleTextEl && (ytVideoTitleTextEl.textContent || '').trim());
        var hasChan = !!(ytChannelNameEl && (ytChannelNameEl.textContent || '').trim());
        return hasTitle || hasChan;
    }

    function setYtVideoTitle(t) {
        var s = (t == null || t === undefined) ? '' : String(t);
        s = s.trim();
        if (ytVideoTitleTextEl) ytVideoTitleTextEl.textContent = s;
        if (ytVideoLineEl) ytVideoLineEl.classList.toggle('rewrite-youtube-video-line--empty', !_ytLineHasContent());
    }

    function setYtChannelMeta(meta) {
        var data = meta || {};
        var name = (data.youtube_channel == null) ? '' : String(data.youtube_channel).trim();
        var url = (data.youtube_channel_url == null) ? '' : String(data.youtube_channel_url).trim();
        var avatar = (data.youtube_channel_avatar == null) ? '' : String(data.youtube_channel_avatar).trim();
        if (ytChannelNameEl) {
            ytChannelNameEl.textContent = name;
            ytChannelNameEl.classList.toggle('hidden', !name);
        }
        if (ytChannelAvatarEl) {
            if (avatar) {
                ytChannelAvatarEl.src = avatar;
                ytChannelAvatarEl.alt = name || '';
                ytChannelAvatarEl.classList.remove('hidden');
            } else {
                ytChannelAvatarEl.removeAttribute('src');
                ytChannelAvatarEl.classList.add('hidden');
            }
        }
        if (ytChannelLinkEl) {
            if (url) {
                ytChannelLinkEl.href = url;
                ytChannelLinkEl.title = name ? ('Открыть канал «' + name + '» на YouTube') : 'Открыть канал на YouTube';
            } else {
                ytChannelLinkEl.removeAttribute('href');
            }
        }
        if (ytVideoLineEl) ytVideoLineEl.classList.toggle('rewrite-youtube-video-line--empty', !_ytLineHasContent());
    }

    function formatYtCookiesStatusLine(d) {
        if (!d || !d.present) return 'Файл ещё не загружен.';
        var age = d.age_human != null ? String(d.age_human) : '—';
        var sz = d.size_bytes != null ? String(d.size_bytes) : '—';
        return 'Текущий файл: ' + age + ', ' + sz + ' байт.';
    }

    function applyYtCookiesStatusUi(d) {
        if (ytCookiesAgeEl) ytCookiesAgeEl.textContent = formatYtCookiesStatusLine(d);
        var present = !!(d && d.present);
        if (ytCookiesLedEl) ytCookiesLedEl.classList.toggle('rewrite-youtube-icon-led--ok', present);
        if (ytCookiesOpenBtn) {
            ytCookiesOpenBtn.title = present
                ? 'Cookies загружены: ' + formatYtCookiesStatusLine(d) + ' Нажмите, чтобы заменить.'
                : 'Cookies для YouTube не загружены — нажмите, чтобы добавить.';
        }
    }

    function setYtCookiesMsg(text, isError) {
        if (!ytCookiesMsgEl) return;
        var s = (text == null || text === undefined) ? '' : String(text);
        ytCookiesMsgEl.textContent = s;
        ytCookiesMsgEl.classList.toggle('hidden', !s);
        ytCookiesMsgEl.classList.toggle('rewrite-youtube-cookies-modal__msg--error', !!isError && !!s);
    }

    function openYtCookiesModal() {
        if (!ytCookiesModal) return;
        if (ytCookiesFileEl) ytCookiesFileEl.value = '';
        setYtCookiesMsg('', false);
        ytCookiesModal.classList.remove('hidden');
        ytCookiesModal.setAttribute('aria-hidden', 'false');
    }

    function closeYtCookiesModal() {
        if (!ytCookiesModal) return;
        ytCookiesModal.classList.add('hidden');
        ytCookiesModal.setAttribute('aria-hidden', 'true');
    }

    async function refreshYtCookiesStatusFromServer() {
        try {
            var r = await fetch(ytCookiesStatusUrl, { method: 'GET', credentials: 'same-origin' });
            var d = await r.json();
            if (d && d.ok) applyYtCookiesStatusUi(d);
        } catch (e) {
            /* ignore */
        }
    }

    async function submitYtCookiesUpload() {
        if (!ytCookiesFileEl || !ytCookiesModalSaveBtn) return;
        var f = ytCookiesFileEl.files && ytCookiesFileEl.files[0];
        if (!f) {
            setYtCookiesMsg('Выберите файл cookies.txt.', true);
            return;
        }
        setYtCookiesMsg('Загрузка…', false);
        ytCookiesModalSaveBtn.disabled = true;
        try {
            var fd = new FormData();
            fd.append('file', f, f.name || 'cookies.txt');
            var r = await fetch(ytCookiesUploadUrl, { method: 'POST', body: fd, credentials: 'same-origin' });
            var d = await r.json().catch(function () { return {}; });
            if (d && d.ok) {
                setYtCookiesMsg('Сохранено.', false);
                applyYtCookiesStatusUi(d);
                setTimeout(function () { closeYtCookiesModal(); }, 600);
            } else {
                setYtCookiesMsg((d && d.message) ? d.message : 'Ошибка сохранения.', true);
            }
        } catch (e) {
            setYtCookiesMsg(String(e && e.message ? e.message : e), true);
        } finally {
            ytCookiesModalSaveBtn.disabled = false;
        }
    }

    function applyYtProxyStatusUi(d) {
        var ledMod = 'idle';
        var msg = (d && d.last_test_message) ? String(d.last_test_message) : '';
        var tooltip;
        if (d && d.test_ok === true) {
            ledMod = 'ok';
            tooltip = String(d.test_message || msg || 'Прокси отвечает.');
        } else if (d && d.test_ok === false) {
            ledMod = 'bad';
            tooltip = String(d.test_message || msg || 'Проверка не удалась.');
        } else if (d && d.env_overrides_file) {
            ledMod = 'env';
            tooltip = 'Сейчас используется YT_DLP_PROXY из .env (приоритет над файлом). ' + msg;
        } else if (d && d.last_test_ok === true) {
            ledMod = 'ok';
            tooltip = msg || 'Прокси проверен — соединение с YouTube есть.';
        } else if (d && d.last_test_ok === false) {
            ledMod = 'bad';
            tooltip = msg || 'Последняя проверка не удалась.';
        } else {
            ledMod = 'idle';
            tooltip = msg || 'Прокси ещё не настроен — нажмите, чтобы добавить.';
        }
        var ledClasses = [
            'rewrite-youtube-icon-led--ok',
            'rewrite-youtube-icon-led--bad',
            'rewrite-youtube-icon-led--env',
        ];
        if (ytProxyLedEl) {
            ledClasses.forEach(function (c) { ytProxyLedEl.classList.remove(c); });
            if (ledMod !== 'idle') ytProxyLedEl.classList.add('rewrite-youtube-icon-led--' + ledMod);
        }
        if (ytProxyOpenBtn) ytProxyOpenBtn.title = tooltip;
        if (ytProxyHintEl) {
            var parts = [];
            if (d && d.env_overrides_file) {
                parts.push('Сейчас действует YT_DLP_PROXY из .env (приоритет над полем).');
            }
            if (d && d.masked_file) {
                parts.push('В файле: ' + String(d.masked_file));
            }
            if (d && d.active_configured && d.masked_active && !d.env_overrides_file) {
                parts.push('Активно: ' + String(d.masked_active));
            }
            ytProxyHintEl.textContent = parts.join(' ');
        }
    }

    async function refreshYtProxyStatusFromServer() {
        try {
            var r = await fetch(ytProxyStatusUrl, { method: 'GET', credentials: 'same-origin' });
            var d = await r.json().catch(function () { return {}; });
            if (d && d.ok) applyYtProxyStatusUi(d);
        } catch (e) {
            /* ignore */
        }
    }

    function setYtProxyMsg(text, isError) {
        if (!ytProxyMsgEl) return;
        var s = (text == null) ? '' : String(text);
        ytProxyMsgEl.textContent = s;
        ytProxyMsgEl.classList.toggle('hidden', !s);
        ytProxyMsgEl.classList.toggle('rewrite-youtube-cookies-modal__msg--error', !!isError && !!s);
    }

    function openYtProxyModal() {
        if (!ytProxyModal) return;
        setYtProxyMsg('', false);
        if (ytProxyInputEl) ytProxyInputEl.value = '';
        ytProxyModal.classList.remove('hidden');
        ytProxyModal.setAttribute('aria-hidden', 'false');
        refreshYtProxyStatusFromServer();
        setTimeout(function () { if (ytProxyInputEl) ytProxyInputEl.focus(); }, 50);
    }

    function closeYtProxyModal() {
        if (!ytProxyModal) return;
        ytProxyModal.classList.add('hidden');
        ytProxyModal.setAttribute('aria-hidden', 'true');
    }

    async function submitYtProxySave() {
        if (!ytProxySaveBtn) return;
        var raw = ytProxyInputEl ? String(ytProxyInputEl.value || '').trim() : '';
        ytProxySaveBtn.disabled = true;
        if (ytProxyClearBtn) ytProxyClearBtn.disabled = true;
        setYtProxyMsg('Сохраняем и проверяем…', false);
        try {
            var r = await fetch(ytProxySaveUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ proxy: raw }),
            });
            var d = await r.json().catch(function () { return {}; });
            if (!d || !d.ok) {
                setYtProxyMsg((d && d.message) ? String(d.message) : 'Ошибка сохранения прокси.', true);
                return;
            }
            applyYtProxyStatusUi(d);
            if (d.test_ok === true) {
                setYtProxyMsg('Проверка прошла: ' + String(d.test_message || 'OK') + '.', false);
                if (ytProxyInputEl) ytProxyInputEl.value = '';
                setTimeout(function () { closeYtProxyModal(); }, 700);
            } else if (d.test_ok === false) {
                setYtProxyMsg('Проверка не прошла: ' + String(d.test_message || 'ошибка') + '.', true);
            } else if (d.cleared) {
                setYtProxyMsg('Прокси очищен.', false);
                setTimeout(function () { closeYtProxyModal(); }, 500);
            }
        } catch (e) {
            setYtProxyMsg(String(e && e.message ? e.message : e), true);
        } finally {
            ytProxySaveBtn.disabled = false;
            if (ytProxyClearBtn) ytProxyClearBtn.disabled = false;
        }
    }

    async function submitYtProxyClear() {
        if (!ytProxyInputEl) return;
        ytProxyInputEl.value = '';
        await submitYtProxySave();
    }

    function setYoutubeLocked(locked) {
        youtubeLocked = !!locked;
        if (ytCardEl) {
            ytCardEl.classList.toggle('rewrite-youtube-card--locked', youtubeLocked);
            ytCardEl.setAttribute('data-youtube-locked', youtubeLocked ? '1' : '0');
        }
        if (ytLockOverlay) ytLockOverlay.classList.toggle('hidden', !youtubeLocked);
        if (ytUrlEl) {
            if (youtubeLocked) {
                ytUrlEl.setAttribute(
                    'title',
                    'Есть сохранённая расшифровка. Нажмите «Редактировать» на затемнении карточки, чтобы изменить ссылку или заново расшифровать.'
                );
            } else {
                ytUrlEl.removeAttribute('title');
            }

            templateCreateBtn.disabled = true;
            try {
                var snap = collectSnapshot();
                const r = await fetch(templateListUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,

                    })
                });

                if (!r.ok || !data.ok) {
                    setTemplateOpStatus(data.message || 'Не удалось создать шаблон.', true);
                    return;

                await reloadRewriteTemplateOptions(name);
                setTemplateOpStatus('Шаблон создан: ' + name, false);
                await saveToServer();
            } catch (e) {
                setTemplateOpStatus(String(e), true);
            } finally {
                templateCreateBtn.disabled = !openaiOk;
                if (templateDeleteBtn) {
                    var sel = templateSelectEl ? (templateSelectEl.value || '').trim() : '';

        if (!openaiOk) {
            if (ytUrlEl) ytUrlEl.disabled = true;

            if (ytStopBtn) ytStopBtn.disabled = true;
            if (ytInsertBtn) ytInsertBtn.disabled = true;
            return;
        }
        if (youtubeLocked && !ytWorking) {
            if (ytUrlEl) ytUrlEl.disabled = true;
            if (ytDecodeBtn) ytDecodeBtn.disabled = true;
            if (ytStopBtn) ytStopBtn.disabled = true;
            if (ytInsertBtn) ytInsertBtn.disabled = true;
            return;
        }
        if (rewriteStageBusy) {
            if (ytUrlEl) ytUrlEl.disabled = true;
            if (ytDecodeBtn) ytDecodeBtn.disabled = true;
            if (ytInsertBtn) ytInsertBtn.disabled = true;
            if (ytStopBtn) ytStopBtn.disabled = !ytWorking || !ytAbortController;
            return;
        }
        if (ytUrlEl) {
            ytUrlEl.disabled = ytWorking;
            // На всякий случай снимаем остаточные атрибуты, если они приехали
            // из закешированного HTML/более раннего состояния UI.
            if (!ytWorking) {
                ytUrlEl.removeAttribute('disabled');
                ytUrlEl.removeAttribute('readonly');
            }
        }
        if (ytDecodeBtn) {
            ytDecodeBtn.disabled = ytWorking;
            if (!ytWorking) ytDecodeBtn.removeAttribute('disabled');
        }
        if (ytStopBtn) ytStopBtn.disabled = !ytWorking || !ytAbortController;
        if (ytInsertBtn) ytInsertBtn.disabled = ytWorking || !ytTranscriptReady;

    function rebuildTemplatePickerFromSelect() {
        var field = document.querySelector('[data-template-picker-field="1"]');
        var panel = field && field.querySelector('.rewrite-anim-dropdown__panel');
        if (!panel || !templateSelectEl) return;
        while (panel.firstChild) panel.removeChild(panel.firstChild);
        Array.prototype.forEach.call(templateSelectEl.options, function (opt) {
            var label = document.createElement('label');
            label.className = 'rewrite-anim-option rewrite-anim-option--radio rewrite-global-model-option';
            var input = document.createElement('input');
            input.type = 'radio';
            input.name = rewriteTemplateRadioGroup;
            input.className = 'rewrite-anim-radio rewrite-template-radio visually-hidden-input';
            input.value = opt.value;
            if (opt.selected) input.checked = true;
            input.disabled = !!templateSelectEl.disabled;
            var body = document.createElement('span');
            body.className = 'rewrite-anim-option__body';
            var title = document.createElement('span');
            title.className = 'rewrite-anim-option__title';
            title.textContent = String(opt.textContent || '').trim();
            body.appendChild(title);
            label.appendChild(input);
            label.appendChild(body);
            panel.appendChild(label);
        });
    }

    function syncTemplatePickerUIFromSelect() {
        var field = document.querySelector('[data-template-picker-field="1"]');
        if (!field || !templateSelectEl) return;
        var v = templateSelectEl.value;
        field.querySelectorAll('input.rewrite-template-radio').forEach(function (rb) {
            rb.checked = (rb.value === v);
        });
        var lbl = field.querySelector('[data-template-picker-label]');
        var idx = templateSelectEl.selectedIndex;
        var opt = idx >= 0 ? templateSelectEl.options[idx] : null;
        if (lbl && opt) lbl.textContent = String(opt.textContent || '').trim();
    }

    function setTemplateOpStatus(msg, isError) {
        var txt = String(msg || '').trim();
        if (!txt) return;
        var root = document.querySelector('.container');
        if (!root) return;
        var box = root.querySelector('.flash-messages');
        if (!box) {
            box = document.createElement('div');
            box.className = 'flash-messages';
            var header = root.querySelector('header');
            if (header && header.nextSibling) root.insertBefore(box, header.nextSibling);
            else root.appendChild(box);
        }
        var el = document.createElement('div');
        el.className = 'flash flash-' + (isError ? 'error' : 'success');
        el.textContent = txt;
        box.appendChild(el);
        setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
            if (box && !box.children.length && box.parentNode) box.parentNode.removeChild(box);
        }, 5000);
        if (templateOpStatusEl) {
            templateOpStatusEl.textContent = '';
            templateOpStatusEl.classList.add('hidden');
            templateOpStatusEl.classList.remove('rewrite-youtube-status--error');
        }
    }

    async function reloadRewriteTemplateOptions(preferredName) {
        if (!templateSelectEl) return;
        var current = (preferredName || templateSelectEl.value || '').trim();
        const r = await fetch(templateListUrl, { cache: 'no-store' });
        const data = await r.json().catch(function () { return {}; });
        if (!r.ok || !data.ok || !Array.isArray(data.templates)) {
            throw new Error('Не удалось обновить список шаблонов.');
        }
        var arr = data.templates.slice();
        if (arr.indexOf('Base Template') < 0) arr.unshift('Base Template');
        templateSelectEl.innerHTML = '';
        arr.forEach(function (n) {
            var opt = document.createElement('option');
            opt.value = n;
            opt.textContent = n;
            templateSelectEl.appendChild(opt);
        });
        var selected = current && arr.indexOf(current) >= 0 ? current : (arr[0] || 'Base Template');
        templateSelectEl.value = selected;
        rebuildTemplatePickerFromSelect();
        syncTemplatePickerUIFromSelect();
        if (templateDeleteBtn) templateDeleteBtn.disabled = !openaiOk || templateIsProtected(selected);
    }

    async function trySyncRewriteTemplateToDisk() {
        if (!templateSelectEl || !openaiOk) return true;
        var name = (templateSelectEl.value || '').trim();
        if (!name || REWRITE_TEMPLATE_NAMES_ON_DISK.indexOf(name) < 0) return true;
        try {
            var snap = collectSnapshot();
            var r = await _fetchWithRetry(rewriteTemplateSaveDiskUrl(name), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    hero_prompt: snap.hero_prompt,
                    master_prompt: snap.master_prompt,
                    target_chars: snap.target_chars,
                    stages: snap.stages
                })
            }, 3);
            var data = await r.json().catch(function () { return {}; });
            return r.ok && !!data.ok;
        } catch (e) {
            console.warn('trySyncRewriteTemplateToDisk failed:', e);
            return false;
        }
    }

    function alertTemplateSyncFailed() {
        // Project save already succeeded — это резервная синхронизация на диск.
        // Не блокируем UI модалкой на каждый чих; сетевой сбой устранится со следующим автосейвом.
        console.warn('Проект сохранён, но синхронизация шаблона на диск не прошла (сеть/права/папка). Будет повтор на следующем сохранении.');

        if (now - _templateSyncWarnedAt < 60000) return;
        _templateSyncWarnedAt = now;
        var note = document.getElementById('rewrite-template-sync-toast');
        if (!note) {
            note = document.createElement('div');

            note.style.cssText = 'position:fixed;right:16px;bottom:16px;max-width:360px;padding:10px 14px;background:#332b1a;color:#ffd58a;border:1px solid #6b5224;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.35);font:13px/1.4 system-ui,sans-serif;z-index:9999;opacity:0;transition:opacity .25s;';
            document.body.appendChild(note);
        }
        note.textContent = 'Проект сохранён. Резервная запись файлов шаблона не прошла — будет повторена автоматически.';
        note.style.opacity = '1';
        clearTimeout(window.__rewriteTemplateSyncToastTimer);
        window.__rewriteTemplateSyncToastTimer = setTimeout(function () {
            note.style.opacity = '0';
        }, 4000);
    }

    /**
     * Парсит текст результата Scene Writer (line-delimited JSON) и собирает счётчики
     * для верхней «Проверка Scene Writer»: scenes / with_start / with_end / with_video /
     * avg_scene_chars. Возвращает null, если в тексте нет ни одной валидной сцены.
     * Зеркало серверного parse_scene_blocks + _scene_writer_block_check (по сцене).
     */
    function computeSceneWriterSummaryFromText(rawText) {
        var text = String(rawText || '');
        if (!text.trim()) return null;
        var lines = text.split(/\r?\n/);
        var current = null;
        var scenes = [];
        function flush() {
            if (current && current.scene_id) scenes.push(current);
        }
        for (var i = 0; i < lines.length; i += 1) {
            var ln = lines[i].trim();
            if (!ln) continue;
            var obj;
            try { obj = JSON.parse(ln); } catch (e) { continue; }
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'scene_id')) {
                flush();
                current = { scene_id: obj.scene_id, text: '', start: null, end: null, video: null };
                continue;
            }
            if (!current) continue;
            if (Object.prototype.hasOwnProperty.call(obj, 'text')) {
                current.text = String(obj.text == null ? '' : obj.text);
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'start') && obj.start && typeof obj.start === 'object') {
                current.start = obj.start;
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'end') && obj.end && typeof obj.end === 'object') {
                current.end = obj.end;
                continue;
            }
            if (Object.prototype.hasOwnProperty.call(obj, 'video') && obj.video && typeof obj.video === 'object') {
                current.video = obj.video;
                continue;
            }
        }
        flush();
        if (!scenes.length) return null;
        var withStart = 0;
        var withEnd = 0;
        var withVideo = 0;
        var charTotal = 0;
        for (var k = 0; k < scenes.length; k += 1) {
            var s = scenes[k];
            charTotal += String(s.text || '').length;
            if (s.start && String((s.start.prompt || '')).trim()) withStart += 1;
            if (s.end && String((s.end.prompt || '')).trim()) withEnd += 1;
            if (s.video && String((s.video.prompt || '')).trim()) withVideo += 1;
        }
        return {
            scenes: scenes.length,
            with_start: withStart,
            with_end: withEnd,
            with_video: withVideo,
            avg_scene_chars: scenes.length ? Math.round((charTotal / scenes.length) * 10) / 10 : 0
        };
    }

    /**
     * Пересчитывает локально счётчики Scene Writer проверки при правках в Result.
     * blocks_info / responses / blocks остаются как пришли с сервера, обновляются:

            if (vobj && typeof vobj === 'object' && typeof vobj.edited_text === 'string') {
                inputText = vobj.edited_text;

        } catch (e) {}
        var blocks = [];
        try {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) blocks = parsed.filter(function (x) { return x && typeof x === 'object'; });
            else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.blocks)) blocks = parsed.blocks.filter(function (x) { return x && typeof x === 'object'; });
        } catch (e) { return null; }
        var joined = blocks.map(function (b) { return String((b || {}).text || ''); }).join('');
        var inputCompact = inputText.replace(/\s+/g, '');
        var outputCompact = joined.replace(/\s+/g, '');
        return {

                input_chars: inputText.length,
                output_chars: joined.length,
                delta_chars: joined.length - inputText.length,
                delta_compact_chars: outputCompact.length - inputCompact.length,

            }

                    et = txt;

                var changes = Array.isArray(obj.changes) ? obj.changes : [];
                var types = {};
                for (var i = 0; i < changes.length; i += 1) {
                    var t = String((changes[i] || {}).type || '').trim();
                    if (t) types[t] = true;

                return {

                    uniqueTypesCount: Object.keys(types).length,
                    hasEditedField: hasEditedField,

    function parseYoutubePackagingResult(raw) {
        var t = (raw || '').trim();
        if (!t) return { ok: false, error: 'Пусто', data: null };
        var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
        if (fence) t = fence[1].trim();
        try {
            var o = JSON.parse(t);
            if (typeof o !== 'object' || o === null || Array.isArray(o)) {
                return { ok: false, error: 'Корень ответа не объект', data: null };
            }
            return { ok: true, error: '', data: o };
        } catch (e1) {
            var a = t.indexOf('{');
            var b = t.lastIndexOf('}');
            if (a >= 0 && b > a) {
                try {
                    var o2 = JSON.parse(t.slice(a, b + 1));
                    if (typeof o2 === 'object' && o2 !== null && !Array.isArray(o2)) {
                        return { ok: true, error: '', data: o2 };
                    }
                } catch (e2) {}
            }
            return { ok: false, error: 'Не удалось разобрать JSON', data: null };
        }
    }

    /** Элемент top_5_titles: строка или объект — в читаемый текст. */
    function formatYoutubeTitleItem(x) {
        if (x == null) return '';
        var t = typeof x;
        if (t === 'string' || t === 'number' || t === 'boolean') return String(x);
        if (t === 'object' && !Array.isArray(x)) {
            var order = ['rank', 'title_id', 'id', 'title_en', 'title_ru', 'angle', 'score', 'reason_en', 'reason_ru'];
            var lines = [];
            var seen = {};
            order.forEach(function (k) {
                if (!Object.prototype.hasOwnProperty.call(x, k)) return;
                var val = x[k];
                if (val === '' || val === null || val === undefined) return;
                seen[k] = true;
                lines.push(k + ': ' + String(val));
            });
            Object.keys(x).forEach(function (k) {
                if (seen[k]) return;
                var val = x[k];
                if (val === '' || val === null || val === undefined) return;
                if (typeof val === 'object') {
                    try {
                        lines.push(k + ': ' + JSON.stringify(val));
                    } catch (e) {
                        lines.push(k + ': …');
                    }
                } else {
                    lines.push(k + ': ' + String(val));
                }
            });
            return lines.join('\n');
        }
        try {
            return JSON.stringify(x);
        } catch (e) {
            return String(x);
        }
    }

    function formatYoutubeFinalDescription(val) {
        if (val == null) return '';
        if (typeof val === 'string') return val;
        if (typeof val === 'object' && !Array.isArray(val)) {
            if (typeof val.text === 'string') return val.text;
            if (typeof val.body === 'string') return val.body;
            if (typeof val.description === 'string') return val.description;
            var chunks = [];
            ['en', 'ru'].forEach(function (lang) {
                if (typeof val[lang] === 'string' && val[lang].trim()) chunks.push(val[lang].trim());
            });
            if (chunks.length) return chunks.join('\n\n');
            return formatYoutubeTitleItem(val);
        }
        return String(val);
    }

    function formatYoutubeScoreVal(val) {
        if (val === '' || val == null) return '';
        var sc = Number(val);
        if (!isNaN(sc)) {
            return Math.abs(sc - Math.round(sc)) < 1e-9 ? String(Math.round(sc)) : String(Math.round(sc * 10) / 10);
        }
        return String(val).trim();
    }

    /** Одна ячейка top_5_titles — как строки в Проверке Scene Writer: сетка из 3 колонок. */
    function renderTop5TitleCellHtml(item, index) {
        var num = index + 1;
        var titleEn = '';
        var titleRu = '';
        var scoreStr = '';
        if (typeof item === 'string') {
            titleEn = item.trim();
            if (!titleEn) return '';
            return (
                '<div class="rewrite-youtube-top5__cell">' +
                '<div class="rewrite-youtube-top5__row">' +
                '<span class="rewrite-youtube-top5__num">#' + String(index + 1) + '</span>' +
                '<span class="rewrite-youtube-top5__en">' + ytPackEscapeHtml(titleEn) + '</span>' +
                '<span class="rewrite-youtube-top5__score"></span>' +
                '</div></div>'
            );
        }
        if (item && typeof item === 'object') {
            if (item.rank != null && item.rank !== '') {
                var r = parseInt(String(item.rank), 10);
                if (!isNaN(r)) num = r;
            }
            titleEn = (item.title_en != null ? String(item.title_en) : '').trim();
            titleRu = (item.title_ru != null ? String(item.title_ru) : '').trim();
            scoreStr = formatYoutubeScoreVal(item.score);
            if (!titleEn && item.title) titleEn = String(item.title).trim();
            if (!titleEn && titleRu) {
                titleEn = titleRu;
                titleRu = '';
            }
        } else {
            return '';
        }
        var html = '<div class="rewrite-youtube-top5__cell">';
        html += '<div class="rewrite-youtube-top5__row">';
        html += '<span class="rewrite-youtube-top5__num">#' + ytPackEscapeHtml(String(num)) + '</span>';
        html += '<span class="rewrite-youtube-top5__en">' + ytPackEscapeHtml(titleEn || '—') + '</span>';
        html += '<span class="rewrite-youtube-top5__score">' + (scoreStr ? ytPackEscapeHtml(scoreStr) : '') + '</span>';
        html += '</div>';
        if (titleRu) {
            html += '<div class="rewrite-youtube-top5__ru">' + ytPackEscapeHtml(titleRu) + '</div>';
        }
        html += '</div>';
        return html;

    /** Только сетка top_5 (без внешней рамки rewrite-scene-writer-check — она на корне превью). */
    function renderTop5TitlesBlocksGridInner(rawTop5) {
        if (!rawTop5.length) return '';
        var colCount = 3;
        var perCol = Math.ceil(rawTop5.length / colCount);
        var html = '<div class="rewrite-scene-writer-check__blocks-grid">';
        for (var c = 0; c < colCount; c += 1) {
            html += '<div class="rewrite-scene-writer-check__blocks-col">';
            var start = c * perCol;
            var end = Math.min(start + perCol, rawTop5.length);
            for (var i = start; i < end; i += 1) {
                html += renderTop5TitleCellHtml(rawTop5[i], i);
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    function normalizeYoutubeHashtags(obj) {
        var v = obj.hashtags;
        function tagToStr(x) {
            if (x == null) return '';
            if (typeof x === 'string') return x.trim();
            if (typeof x === 'object' && x.tag) return String(x.tag).trim();
            if (typeof x === 'object' && x.name) return String(x.name).trim();
            if (typeof x === 'object') return formatYoutubeTitleItem(x).replace(/\n/g, ' ').trim();
            return String(x).trim();
        }
        if (Array.isArray(v)) return v.map(tagToStr).filter(Boolean);
        if (typeof v === 'string') {
            return v.split(/[\s,]+/).map(function (x) { return x.trim(); }).filter(Boolean);
        }
        return [];
    }

    function renderEditorCheck(block) {
        if (!block) return;
        var wrap = block.querySelector('[data-editor-check]');
        if (!wrap) return;
        var stageKey = block.getAttribute('data-stage-key') || '';
        if (stageKey === 'draft1' || stageKey === 'block_writer') {
            renderBlockWriterCheck(block);
            return;
        }
        if (stageKey === 'structure' || stageKey === 'architect') {
            renderArchitectCheck(block);
            return;
        }
        if (stageKey === 'analysis') {
            renderAnalysisCheck(block);
            return;
        }
        var strictEditorStages = {
            retention_editor: true,
            hook_editor: true,
            flow_editor: true,
            persona_editor: true,
            voiceover_editor: true,
            title_strategist: true
        };
        if (strictEditorStages[stageKey]) {
            var stageLabel = STAGE_LABELS[stageKey] || 'Editor';
            var stageIdxStrict = STAGE_KEYS_ORDER.indexOf(stageKey);
            if (stageIdxStrict <= 0) {
                wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка ' + stageLabel + '</strong> <span class="rewrite-scene-writer-check__wait">нет предыдущего этапа</span></div>';
                return;
            }
            var prevKeyStrict = STAGE_KEYS_ORDER[stageIdxStrict - 1];
            var prevBlockStrict = document.querySelector('.rewrite-stage-card[data-stage-key="' + prevKeyStrict + '"]');
            var prevParsedStrict = parseEditedPayload(((prevBlockStrict ? prevBlockStrict.querySelector('.rewrite-stage-result') : null) || {}).value || '');
            var currParsedStrict = parseEditedPayload(((block.querySelector('.rewrite-stage-result')) || {}).value || '');
            var hasPayload = currParsedStrict.hasEditedField && currParsedStrict.hasChangesField;
            var inChars = prevParsedStrict.editedText.length;
            var outChars = currParsedStrict.editedText.length;
            var delta = outChars - inChars;
            var deltaStr = (delta > 0 ? '+' : '') + String(delta);
            var okClass = hasPayload ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
            var htmlStrict = '';
            htmlStrict += '<div class="rewrite-scene-writer-check__head"><strong>Проверка ' + stageLabel + '</strong> <span class="' + okClass + '">' + (hasPayload ? 'OK' : 'NO') + '</span></div>';
            htmlStrict += '<div class="rewrite-scene-writer-check__hint rewrite-editor-check-line">';
            htmlStrict += '<span class="rewrite-editor-check-line__left">IN: <strong>' + String(inChars) + '</strong></span>';
            htmlStrict += '<span class="rewrite-editor-check-line__sep">|</span>';
            htmlStrict += '<span class="rewrite-editor-check-line__center">OUT: <strong>' + String(outChars) + '</strong> (' + deltaStr + ')</span>';
            htmlStrict += '<span class="rewrite-editor-check-line__sep">|</span>';
            htmlStrict += '<span class="rewrite-editor-check-line__right">Changes: <strong>' + String(currParsedStrict.changesCount) + '</strong></span>';
            htmlStrict += '</div>';
            wrap.innerHTML = htmlStrict;
            return;
        }
        var stageIdx = STAGE_KEYS_ORDER.indexOf(stageKey);
        if (stageIdx <= 0) {
            wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="rewrite-scene-writer-check__wait">нет предыдущего этапа</span></div>';
            return;
        }
        var prevKey = STAGE_KEYS_ORDER[stageIdx - 1];
        var prevBlock = document.querySelector('.rewrite-stage-card[data-stage-key="' + prevKey + '"]');
        var prevParsed = parseEditedPayload(((prevBlock ? prevBlock.querySelector('.rewrite-stage-result') : null) || {}).value || '');
        var currParsed = parseEditedPayload(((block.querySelector('.rewrite-stage-result')) || {}).value || '');
        if (!currParsed.editedText && !prevParsed.editedText) {
            wrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="rewrite-scene-writer-check__wait">ожидание данных</span></div>';
            return;
        }
        var inChars = prevParsed.editedText.length;
        var outChars = currParsed.editedText.length;
        var delta = outChars - inChars;
        var ok = inChars === outChars;
        var okClass = ok ? 'rewrite-scene-writer-check__ok' : 'rewrite-scene-writer-check__no';
        var deltaStr = (delta > 0 ? '+' : '') + String(delta);
        var html = '';
        html += '<div class="rewrite-scene-writer-check__head"><strong>Проверка</strong> <span class="' + okClass + '">' + (ok ? 'OK' : ('NO (' + deltaStr + ')')) + '</span></div>';
        html += '<div class="rewrite-scene-writer-check__grid">';
        html += '<div>Вход: <strong>' + String(inChars) + '</strong></div>';
        html += '<div>Выход: <strong>' + String(outChars) + '</strong></div>';
        html += '<div>Блоков в changes: <strong>' + String(currParsed.changesCount) + '</strong></div>';
        html += '<div>Правок: <strong>' + String(currParsed.changesCount) + '</strong></div>';
        html += '</div>';
        wrap.innerHTML = html;
    }

    function syncStageRunButtons() {
        const cards = Array.from(document.querySelectorAll('.rewrite-stage-card'));
        const byKey = {};
        cards.forEach(function (c) {
            const k = c.getAttribute('data-stage-key');
            if (k) byKey[k] = c;
        });
        const anyRunning = !!rewriteStageBusy
            || cards.some(function (c) { return c.classList.contains('rewrite-stage-card--running'); })
            || !!document.querySelector('.rewrite-stage-status-row:not(.hidden)');
        // Цепочка предусловий строится в пределах текущего пресета: иначе для
        // «Глубокого» этапы после draft1 видят пустые distiller/author и
        // считают предков невыполненными → ставят крестик, даже если все
        // нужные этапы пресета на самом деле сохранены.
        const presetOrder = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[currentRewritePreset])
            ? REWRITE_PRESET_STAGE_KEYS[currentRewritePreset].slice()
            : STAGE_KEYS_ORDER.slice();
        const presetIndexByKey = {};
        presetOrder.forEach(function (k, i) { presetIndexByKey[k] = i; });
        STAGE_KEYS_ORDER.forEach(function (sk) {
            const block = byKey[sk];
            if (!block) return;
            const runBtn = block.querySelector('.rewrite-stage-run');
            const blockedEl = block.querySelector('.rewrite-stage-run-blocked');
            let ok = true;
            if (Object.prototype.hasOwnProperty.call(presetIndexByKey, sk)) {
                const idx = presetIndexByKey[sk];
                for (let i = 0; i < idx; i++) {
                    const prevKey = presetOrder[i];
                    if ((sk === 'structure_splitter' || sk === 'scene_writer') && prevKey === 'title_strategist') {
                        continue;
                    }
                    if (sk === 'youtube_packaging' && prevKey === 'scene_writer_live') {
                        continue;
                    }
                    const prev = byKey[prevKey];
                    if (!stageResultNonEmpty(prev)) {
                        ok = false;
                        break;
                    }
                }
            } else {
                // Этап вне текущего пресета — кнопку запуска оставляем доступной,
                // он не блокирует и не блокируется другими пресетами.
                ok = true;
            }
            const apiBtn = block.querySelector('.rewrite-stage-api-export');
            if (runBtn && blockedEl) {
                if (ok) {
                    runBtn.removeAttribute('hidden');
                    blockedEl.setAttribute('hidden', '');
                } else {
                    runBtn.setAttribute('hidden', '');
                    blockedEl.removeAttribute('hidden');
                }
                runBtn.disabled = anyRunning || !ok || !openaiOk;
            }
            if (apiBtn) {
                apiBtn.disabled = anyRunning || !ok || !openaiOk;
            }
        });
    }

            function flashTitle(t) {
                sourceCopyBtn.setAttribute('title', t);
                setTimeout(function () { sourceCopyBtn.setAttribute('title', prevTitle); }, 1500);
            }
            if (!raw) { flashTitle('Нет текста для копирования'); return; }
            function fallback() {

                    sourceEl.select();
                    document.execCommand('copy');
                    sourceEl.disabled = prevDisabled;
                    if (sourceLocked) sourceEl.setAttribute('readonly', '');
                    flashTitle('Скопировано');
                } catch (e) { flashTitle('Не удалось скопировать'); }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(raw)
                    .then(function () { flashTitle('Скопировано'); })
                    .catch(fallback);

    function ytFormatBytes(n) {
        if (n == null || n === undefined || (typeof n === 'number' && (isNaN(n) || n < 0))) return '—';
        var b = Number(n);
        if (b >= 1048576) return (b / 1048576).toFixed(2) + ' МБ';
        if (b >= 1024) return (b / 1024).toFixed(1) + ' КиБ';
        return String(b) + ' б';
    }
    function ytFormatSpeedBps(bps) {
        if (bps == null || bps === undefined || isNaN(bps) || bps <= 0) return '';
        return ' · ' + ytFormatBytes(bps) + '/с';
    }
    function ytFormatEta(sec) {
        if (sec == null || sec === undefined || isNaN(sec) || sec < 0) return '';
        sec = Number(sec);
        if (sec < 90) return String(Math.max(1, Math.round(sec))) + ' секунд';
        var m = Math.floor(sec / 60);
        var s0 = Math.round(sec % 60);
        return String(m) + ' мин ' + String(s0) + ' сек';
    }
    function formatTranscribeProgressLine(ev) {
        if (ev.phase === 'split') {
            return ev.message || 'Подготовка аудио…';
        }
        if (ev.phase === 'plan') {
            var p = ev.message || 'План: OpenAI (gpt-4o-mini-transcribe)';
            if (ev.total_chunks > 1) {
                p += ' · ' + String(ev.total_chunks) + ' части';
                if (ev.segment_seconds) {
                    p += ' (по ~' + String(ev.segment_seconds) + ' с)';
                }
            }
            return p;
        }
        if (ev.phase === 'chunk' && ev.action === 'request') {
            return 'OpenAI, часть ' + String(ev.index) + '/' + String(ev.total) + ': отправка'
                + (ev.file_bytes != null ? ' ' + ytFormatBytes(ev.file_bytes) : '') + ' — ждём ответ…';
        }
        if (ev.phase === 'chunk' && ev.action === 'done') {
            return 'OpenAI, часть ' + String(ev.index) + '/' + String(ev.total) + ' — готово'
                + (ev.text_chars != null ? ', ' + String(ev.text_chars) + ' симв. в сегменте' : '') + '…';
        }
        if (ev.phase === 'join') {
            return ev.message || 'Склейка частей в один текст…';
        }
        return ev.message || 'Расшифровка…';
    }

    async function ytConsumeDownloadStream(signal) {
        const r2 = await fetch(ytDownloadStreamUrl, {
            method: 'POST',

        }

        const dec = new TextDecoder();
        var buf = '';

                var got = ev.downloaded_bytes;
                var tot = ev.total_bytes != null ? ev.total_bytes : ev.total_bytes_estimate;
                var msg = 'Скачивание: ' + ytFormatBytes(got);
                if (tot != null && tot > 0) {
                    var gotN = Number(got) || 0;
                    var pct = Math.min(100, Math.max(0, Math.round(100 * gotN / tot)));
                    msg += ' из ' + ytFormatBytes(tot) + ' — ' + String(pct) + '%';
                } else {
                    msg += (tot == null && ev.total_bytes_estimate == null) ? ' (оценка размера…)' : '';
                }
                msg += ytFormatSpeedBps(ev.speed);
                if (ev.eta != null && !isNaN(ev.eta)) {
                    var eta0 = ytFormatEta(ev.eta);
                    if (eta0) msg += ' · осталось ' + eta0;
                }
                setYtStatus(msg, false);
            } else if (ev.type === 'progress' && ev.phase === 'postprocess') {
                var pp = (ev.postprocessor || '').replace(/ExtractAudio/i, 'аудио-обработка');
                setYtStatus('После скачивания: ' + (pp || 'обработка') + ' (может занять время)…', false);
            } else if (ev.type === 'progress' && ev.phase === 'fragment_done') {
                setYtStatus('Фрагмент записан, продолжаем…', false);
            } else if (ev.type === 'error' && ev.message) {
                throw new Error(ev.message);
            } else if (ev.type === 'done' && ev.ok) {
                return ev;
            }
            return null;
        }
        function drainBufLines() {
            var i;
            while ((i = buf.indexOf('\n')) >= 0) {
                var line = buf.slice(0, i).trim();
                buf = buf.slice(i + 1);
                if (!line) continue;
                var ev;
                try {
                    ev = JSON.parse(line);
                } catch (e) {
                    continue;
                }
                var doneEv = handleYoutubeStreamEvent(ev);
                if (doneEv) return doneEv;
            }
            return null;
        }
        while (true) {
            if (signal && signal.aborted) {
                try { reader.cancel(); } catch (_) {}
                throw new DOMException('Aborted', 'AbortError');
            }
            const chunk = await reader.read();
            if (chunk.done) {
                buf += dec.decode();
                break;
            }
            buf += dec.decode(chunk.value, { stream: true });
            var doneEarly = drainBufLines();
            if (doneEarly) return doneEarly;
        }
        var tailDone = drainBufLines();
        if (tailDone) return tailDone;
        if (buf.trim()) {
            try {
                var evLast = JSON.parse(buf.trim());
                var d0 = handleYoutubeStreamEvent(evLast);
                if (d0) return d0;
            } catch (e) { /* ignore */ }
        }
        throw new Error('Поток скачивания оборвался без результата.');
    }

    async function ytConsumeTranscribeStream(signal) {

    async function _fetchWithRetry(url, init, attempts) {
        var max = Math.max(1, Number(attempts || 3));
        var lastErr = null;
        for (var i = 0; i < max; i++) {
            try {
                return await fetch(url, init);
            } catch (e) {
                lastErr = e;
                // TypeError: Failed to fetch — транзиентный сетевой сбой/расширение/перезагрузка сервера.
                if (i < max - 1) {
                    await new Promise(function (res) { setTimeout(res, 400 * (i + 1)); });
                    continue;
                }
            }
        }
        throw lastErr || new Error('fetch failed');
    }

    async function saveToServer() {
        const r = await _fetchWithRetry(saveUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectSnapshot())
        }, 3);
        return r.ok;
    }

    let autosaveInFlight = false;
    let autosaveNeedsRerun = false;
    async function runAutosaveNow() {
        if (autosaveInFlight) {
            autosaveNeedsRerun = true;
            return;
        }
        autosaveInFlight = true;
        try {
            await saveToServer();
        } catch (e) {
            // Silent background autosave.
        } finally {
            autosaveInFlight = false;
            if (autosaveNeedsRerun) {
                autosaveNeedsRerun = false;
                runAutosaveNow();
            }
        }
    }
    function scheduleAutosave(delayMs) {
        var d = Number(delayMs || 0);
        if (autosaveTimer) clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(function () {
            autosaveTimer = null;
            runAutosaveNow();
        }, Math.max(0, d));
    }

    function injectPastPromptIntoSceneWriterResult(rawText, pastPrompt) {
        var txt = String(rawText || '');
        var pp = String(pastPrompt || '').trim();
        if (!txt.trim() || !pp) return txt;
        var changed = false;
        var out = [];
        txt.split('\n').forEach(function (ln) {
            var s = (ln || '').trim();
            if (!s) {
                out.push(ln);
                return;
            }
            var obj = null;
            try {
                obj = JSON.parse(s);
            } catch (_) {
                out.push(ln);
                return;
            }
            if (!obj || typeof obj !== 'object') {
                out.push(ln);
                return;
            }
            ['start', 'end'].forEach(function (slotName) {
                var slot = obj[slotName];
                if (!slot || typeof slot !== 'object') return;
                var prompt = String(slot.prompt || '').trim();
                if (!prompt) return;
                if (prompt.indexOf(pp) === 0) return;
                slot.prompt = pp + ' ' + prompt;
                changed = true;
            });
            out.push(JSON.stringify(obj));
        });
        return changed ? out.join('\n') : txt;
    }

            setTimeout(function () { btn.setAttribute('title', prevT || 'Копировать результат в буфер обмена'); }, 2200);
            return;
        }
        try {
            var trimmed = raw.trim();
            if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                var parsed = JSON.parse(trimmed);
                if (parsed && typeof parsed === 'object') {
                    raw = JSON.stringify(parsed, null, 2);

        } catch (e) { void e; }
        var saved = counts ? counts.textContent : '';
        function showCopied() {
            if (counts) {
                counts.setAttribute('data-copy-hold', '1');
                counts.textContent = 'Скопировано в буфер';
                setTimeout(function () {
                    counts.removeAttribute('data-copy-hold');
                    updateResultCounts(block);
                }, 1600);
            }
        }
        function fallbackExec() {
            try {
                var tmp = document.createElement('textarea');
                tmp.value = raw;
                tmp.setAttribute('readonly', '');
                tmp.style.position = 'fixed';
                tmp.style.left = '-9999px';
                tmp.style.top = '0';
                document.body.appendChild(tmp);
                tmp.focus();
                tmp.select();
                var ok = document.execCommand('copy');
                document.body.removeChild(tmp);
                if (ok) showCopied();
                else alert('Не удалось скопировать');
            } catch (e) {
                alert('Не удалось скопировать');
            }
        }
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(raw).then(showCopied).catch(fallbackExec);

            fallbackExec();
