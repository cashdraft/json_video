        async function followSemanticEventStream(taskId, signal) {
            var res = await fetch(rewriteTaskEventsUrl(taskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (!res.ok) {
                setSemanticStatus('Ошибка подписки на задачу: HTTP ' + res.status, 'err');
                return false;
            }
            var reader = res.body && res.body.getReader();
            if (!reader) {
                setSemanticStatus('Браузер не поддерживает потоковое чтение ответа.', 'err');
                return false;
            }
            var dec = new TextDecoder('utf-8');
            var buf = '';
            var outText = '';
            var hadError = false;
            var gotResult = false;
            while (true) {
                var rd = await reader.read();
                if (rd.done) break;
                buf += dec.decode(rd.value, { stream: true });
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx);
                    buf = buf.slice(idx + 1);
                    if (!line.trim()) continue;
                    var ev = null;
                    try { ev = JSON.parse(line); } catch (e2) { continue; }
                    var msg = String((ev && ev.message) || '');
                    if (ev && ev.type === 'status') {
                        setSemanticStatus(msg, null);
                    } else if (ev && ev.type === 'error') {
                        hadError = true;
                        setSemanticStatus(msg || 'Ошибка', 'err');
                    } else if (ev && ev.type === 'result') {
                        outText = String(ev.content || '');
                        gotResult = true;
                    }
                }
            }
            if (gotResult && resultEl) {
                resultEl.value = outText;
                semanticAnalysisLocked = true;
                applySemanticResultLockUI();
                applyTextBadgeState(semanticBadgeEl, resultEl);
                refreshSemanticPreview();
                scheduleAutosave(0);
                return true;
            }
            return false;
        }

            setSemanticBusy(true);

            semanticTaskId = null;
            semanticAbort = new AbortController();
            var hadError = false;
            var wasAborted = false;
            try {
                var modelVal = getLangStagesModel();
                var startResp = await fetch(semanticAnalyzerStartUrl, {

                    hadError = true;

                    setSemanticStatus('Не удалось запустить: ' + se, 'err');

            } catch (e) {

                    setSemanticError(lastMsg || 'Ошибка');

        async function followVfSemanticEventStream(taskId, signal) {
            var res = await fetch(rewriteTaskEventsUrl(taskId, -1), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (!res.ok) {
                setVfSemanticStatus('Ошибка подписки на задачу: HTTP ' + res.status, 'err');
                return false;
            }
            var reader = res.body && res.body.getReader();
            if (!reader) {
                setVfSemanticStatus('Браузер не поддерживает потоковое чтение ответа.', 'err');
                return false;
            }
            var dec = new TextDecoder('utf-8');
            var buf = '';
            var outText = '';
            var hadError = false;
            var gotResult = false;
            while (true) {
                var rd = await reader.read();
                if (rd.done) break;
                buf += dec.decode(rd.value, { stream: true });
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx);
                    buf = buf.slice(idx + 1);
                    if (!line.trim()) continue;
                    var ev = null;
                    try { ev = JSON.parse(line); } catch (e2) { continue; }
                    var msg = String((ev && ev.message) || '');
                    if (ev && ev.type === 'status') {
                        setVfSemanticStatus(msg, null);
                    } else if (ev && ev.type === 'error') {
                        hadError = true;
                        setVfSemanticStatus(msg || 'Ошибка', 'err');
                    } else if (ev && ev.type === 'result') {
                        outText = String(ev.content || '');
                        gotResult = true;
                    }
                }
            }
            if (gotResult && resultEl) {
                resultEl.value = outText;
                voiceoverFinalSemanticLocked = true;
                applyVoiceoverFinalSemanticResultLockUI();
                if (semanticVfFinalBadgeEl) applyTextBadgeState(semanticVfFinalBadgeEl, resultEl);
                refreshVfSemanticPreview();
                scheduleAutosave(0);
                return true;
            }
            return false;
        }

            if (chainPending) {

                try { await cancelVfOngoing(); } catch (_e) {}
                var spin = 0;
                while (chainPending && spin < 50) {
                    await new Promise(function (r) { setTimeout(r, 60); });
                    spin += 1;
                }
            }
            var myToken = ++currentChainToken;
            lastTrigger = fp;
            chainPending = true;
            try {
                if (isVfChainRunning()) await cancelVfOngoing();
                if (myToken !== currentChainToken) return;
                var fpAfter = String(vfTa.value || '').trim();
                if (fpAfter !== fp) { lastTrigger = fpAfter ? '__pending__' : ''; return; }
                if (typeof window.__rewriteClearVoiceoverFinalRuSemanticDom === 'function') {
                    try { window.__rewriteClearVoiceoverFinalRuSemanticDom(); } catch (_e) {}
                }
                if (myToken !== currentChainToken) return;

                var okRu = false;
                try { okRu = !!(await window.__rewriteRunTranslateVoiceoverFinalRu()); } catch (e) { okRu = false; }
                if (myToken !== currentChainToken) return;

                        debounceTimer = setTimeout(triggerAuto, 600);

            try { if (window.__rewriteCancelSemantic) window.__rewriteCancelSemantic(); } catch (e) {}
            try { if (window.__rewriteCancelTranslateRu) window.__rewriteCancelTranslateRu(); } catch (e) {}
            await waitNotRunning(5000);
        }

        // Полностью очищаем результаты Russian и Semantic — value, lock-state,
        // бейджи, счётчики. Это нужно перед авто-запуском, чтобы старый
        // перевод/структура не висели на экране, пока считаются новые.
        function clearStageResults() {
            clearRewriteRuSemanticTextareasDom();
        }

        async function triggerAuto() {
            var fp = String(src.value || '').trim();
            if (!fp) return;
            if (fp === lastTrigger && !chainPending) return;
            // Новый ввод во время уже идущей цепочки: отменяем активные задачи
            // и помечаем токен, чтобы старая цепочка вышла без следующего шага.
            if (chainPending) {
                currentChainToken += 1;
                try { await cancelOngoing(); } catch (_e) {}
                // Дожидаемся, пока предыдущий finally не отпустит chainPending,
                // чтобы не плодить параллельные цепочки.
                var spin = 0;
                while (chainPending && spin < 50) {
                    await new Promise(function (r) { setTimeout(r, 60); });
                    spin += 1;
                }
            }
            var myToken = ++currentChainToken;
            lastTrigger = fp;
            chainPending = true;
            try {
                if (isRunning()) await cancelOngoing();
                if (myToken !== currentChainToken) return;
                // Между cancel и start значение могло опять измениться —
                // тогда дождёмся следующего debounce и не запускаем сейчас.
                var fpAfter = String(src.value || '').trim();
                if (fpAfter !== fp) { lastTrigger = fpAfter ? '__pending__' : ''; return; }
                // Очищаем прошлые результаты ДО запуска новых задач — чтобы
                // на UI не висел старый перевод/структура.
                clearStageResults();
                if (myToken !== currentChainToken) return;
                if (typeof window.__rewriteRunTranslateRu !== 'function') return;
                var okRu = false;
                try { okRu = !!(await window.__rewriteRunTranslateRu()); } catch (e) { okRu = false; }
                if (myToken !== currentChainToken) return;
                if (!okRu) return;
                var fpFinal = String(src.value || '').trim();
                if (fpFinal !== fp) { lastTrigger = ''; return; }
                if (typeof window.__rewriteRunSemantic === 'function') {
                    try { await window.__rewriteRunSemantic(); } catch (e) {}
                }
            } finally {
                if (myToken === currentChainToken) {
                    chainPending = false;
                    var fpNow = String(src.value || '').trim();
                    if (fpNow && fpNow !== lastTrigger) {
                        clearTimeout(debounceTimer);
                        debounceTimer = setTimeout(triggerAuto, 600);
                    }
                }
            }
        }

        function scheduleAuto() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(triggerAuto, 1500);
        }

        // Принудительный перезапуск цепочки — после ✓ у Source, смены модели,
        // вставки из YouTube и т.п. (не по каждому input в поле).
        window.__rewriteStagesRestartChain = function () {
            var fpNow = String(src.value || '').trim();
            if (!fpNow) return; // нечего пересчитывать
            lastTrigger = '__force__';
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(triggerAuto, 50);
        };
    })();

    // ===== Locked prompts (промты «под пин-кодом») =====
    // Один диалог обслуживает все защищённые промты. Какой именно
    // редактируем — определяется по data-locked-prompt-edit="<name>" на
    // кнопке-карандашике. Текущее активное имя живёт в `state.name`.
    (function setupLockedPromptModal() {
        const modal = document.getElementById('locked-prompt-modal');
        if (!modal) return;
        const card = modal.querySelector('.confirm-modal__card');
        const title = document.getElementById('locked-prompt-modal-title');
        const textarea = document.getElementById('locked-prompt-modal-textarea');
        const msg = document.getElementById('locked-prompt-modal-msg');
        const dotsWrap = document.getElementById('locked-prompt-modal-pin-dots');
        const keypad = document.getElementById('locked-prompt-modal-keypad');
        const cancelBtn = document.getElementById('locked-prompt-modal-cancel');
        const resetBtn = document.getElementById('locked-prompt-modal-reset');
        if (!textarea || !msg || !dotsWrap || !keypad) return;
        const dots = Array.from(dotsWrap.querySelectorAll('.locked-prompt-modal__pin-dot'));
        const PIN_LEN = 4;
        const state = { name: null, label: '', pin: '', loadedContent: '', saving: false };

        function setMsg(text, kind) {
            msg.textContent = text || '';
            msg.classList.remove('hidden', 'locked-prompt-modal__msg--err', 'locked-prompt-modal__msg--ok');
            if (!text) { msg.classList.add('hidden'); return; }
            if (kind === 'err') msg.classList.add('locked-prompt-modal__msg--err');
            else if (kind === 'ok') msg.classList.add('locked-prompt-modal__msg--ok');
        }
        function renderDots() {
            dots.forEach((d, i) => {
                if (i < state.pin.length) d.classList.add('locked-prompt-modal__pin-dot--filled');
                else d.classList.remove('locked-prompt-modal__pin-dot--filled');
            });
        }
        function openModal() {
            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
            try { textarea.focus(); } catch (_) {}
        }
        function closeModal() {
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            state.name = null;
            state.pin = '';
            state.loadedContent = '';
            state.saving = false;
            textarea.value = '';
            setMsg('', null);
            renderDots();
        }
        async function loadContent(name) {
            setMsg('Загрузка…', null);
            try {
                const resp = await fetch(lockedPromptApiUrl(name), { method: 'GET', credentials: 'same-origin' });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.ok) {
                    var errPart = (data && data.error) ? String(data.error) : String(resp.status);
                    var reqPart = (data && data.requested) ? (' («' + String(data.requested) + '»)') : '';
                    setMsg('Не удалось загрузить промт: ' + errPart + reqPart, 'err');
                    return false;
                }
                state.loadedContent = String(data.content || '');
                textarea.value = state.loadedContent;
                if (data.label) title.textContent = String(data.label);
                updateBadge(name, !!data.present);
                setMsg('', null);
                return true;
            } catch (e) {
                setMsg('Сеть/сервер недоступны: ' + (e && e.message ? e.message : e), 'err');
                return false;
            }
        }
        function updateBadge(name, present) {
            document.querySelectorAll('[data-locked-prompt-badge="' + name + '"]').forEach(function (badge) {
            if (!badge) return;
            var nm = String(name || '');
            var label;
            if (nm === 'rewrite_system_rules' || nm === 'voiceover_editor_system_rules') {
                label = 'System Rules: ';
            } else if (nm.indexOf('system_prompt_') === 0) {
                label = 'System Promt: ';
            } else if (nm.indexOf('user_prompt_') === 0) {
                label = 'User Promt: ';
            } else if (nm.slice(-5) === '_user') {
                label = 'User Promt: ';
            } else {
                label = 'System Promt: ';
            }
            badge.textContent = label + (present ? 'YES' : 'NO');
            badge.classList.toggle('locked-prompt-badge--yes', present);
            badge.classList.toggle('locked-prompt-badge--no', !present);
            });
        }
        function refreshAllLockedPromptBadges() {
            document.querySelectorAll('[data-locked-prompt-badge]').forEach(function (badge) {
                var name = (badge.getAttribute('data-locked-prompt-badge') || '').trim();
                if (!name) return;
                var st = LOCKED_PROMPTS_STATE && LOCKED_PROMPTS_STATE[name];
                updateBadge(name, !!(st && st.present));
            });
        }
        refreshAllLockedPromptBadges();
        async function save() {
            if (!state.name || state.saving) return;
            if (state.pin.length !== PIN_LEN) {
                setMsg('Введите ' + PIN_LEN + ' цифр пин-кода.', 'err');
                return;
            }
            state.saving = true;
            setMsg('Сохраняем…', null);
            try {
                const resp = await fetch(lockedPromptApiUrl(state.name), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: state.pin, content: textarea.value }),
                    credentials: 'same-origin',
                });
                const data = await resp.json().catch(() => ({}));
                if (resp.status === 401) {
                    setMsg('Неверный пин-код.', 'err');
                    state.pin = '';
                    renderDots();
                    state.saving = false;
                    return;
                }
                if (!resp.ok || !data.ok) {
                    setMsg('Не удалось сохранить: ' + (data && data.error ? data.error : resp.status), 'err');
                    state.saving = false;
                    return;
                }
                state.loadedContent = textarea.value;
                updateBadge(state.name, !!data.present);
                setMsg('Сохранено.', 'ok');
                state.pin = '';
                renderDots();
                state.saving = false;
                setTimeout(closeModal, 600);
            } catch (e) {
                setMsg('Сеть/сервер недоступны: ' + (e && e.message ? e.message : e), 'err');
                state.saving = false;
            }
        }
        function pushDigit(d) {
            if (state.pin.length >= PIN_LEN) return;
            state.pin += d;
            renderDots();
            if (state.pin.length === PIN_LEN) {
                // Автосохранение по полному пину — как «нажал OK на клавиатуре телефона».
                save();
            }
        }
        function popDigit() {
            if (state.pin.length === 0) return;
            state.pin = state.pin.slice(0, -1);
            renderDots();
        }

        // ----- Глобальный делегат для кнопок ✎ возле защищённых промтов -----
        document.addEventListener('click', async (ev) => {
            const btn = ev.target.closest && ev.target.closest('[data-locked-prompt-edit]');
            if (!btn) return;
            ev.preventDefault();
            const name = (btn.getAttribute('data-locked-prompt-edit') || '').trim();
            const label = btn.getAttribute('data-locked-prompt-label') || 'Промт';
            if (!name) return;
            state.name = name;
            state.label = label;
            state.pin = '';
            renderDots();
            title.textContent = label;
            textarea.value = '';
            openModal();
            await loadContent(name);
        });

        // ----- Кнопки модалки -----
        if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                textarea.value = state.loadedContent;
                setMsg('Текст возвращён к сохранённому на сервере.', 'ok');
            });
        }
        modal.addEventListener('click', (ev) => {
            const t = ev.target;
            if (t && t.hasAttribute && t.hasAttribute('data-locked-prompt-modal-close')) closeModal();
        });

        // ----- Keypad -----
        keypad.addEventListener('click', (ev) => {
            const k = ev.target.closest && ev.target.closest('button');
            if (!k) return;
            const d = k.getAttribute('data-pin-digit');
            const a = k.getAttribute('data-pin-action');
            if (d != null) { pushDigit(d); return; }
            if (a === 'clear') { popDigit(); return; }
            if (a === 'ok') { save(); return; }
        });

        // ----- Клавиатура: цифры/Backspace/Enter/Escape пока открыто -----
        document.addEventListener('keydown', (ev) => {
            if (modal.classList.contains('hidden')) return;
            const tgt = ev.target;
            const inTextarea = tgt && tgt.tagName === 'TEXTAREA';
            if (inTextarea) {
                // Не перехватываем ввод в textarea, кроме Escape.
                if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); }
                return;
            }
            if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
            if (ev.key === 'Enter') { ev.preventDefault(); save(); return; }
            if (ev.key === 'Backspace') { ev.preventDefault(); popDigit(); return; }
            if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pushDigit(ev.key); return; }
        });
    })();
})();
    </script>
