    async function runStage(stageKey, block, options) {
        options = options || {};
        var manageBusy = options.manageBusy !== false;
        var signal = options.signal;
        var localAbortController = null;
        if (!signal) {
            localAbortController = new AbortController();
            signal = localAbortController.signal;
        }
        var stageSuccess = false;
        var gotFinalResult = false;
        var streamError = false;
        var reader = null;
        var currentTaskId = null;
        var attachMode = !!(options.attachTask && options.attachTask.task_id);
        var attachSinceSeq = attachMode ? (typeof options.attachTask.since_seq === 'number' ? options.attachTask.since_seq : -1) : -1;
        var attachTaskIdInitial = attachMode ? options.attachTask.task_id : null;
        block.setAttribute('data-run-started-at', String(Date.now()));
        resetStageRunUi(block);
        const resTextarea = block.querySelector('.rewrite-stage-result');
        const resultBadge = block.querySelector('.rewrite-stage-result-badge');
        const sceneWriterCheckWrap = block.querySelector('[data-scene-writer-check]');
        const sceneMediaCheckWrap = block.querySelector('[data-scene-media-check]');
        const structureSplitterCheckWrap = block.querySelector('[data-structure-splitter-check]');
        const savedBeforeRun = resTextarea ? resTextarea.value : '';
        if (stageKey === 'scene_writer' && sceneWriterCheckWrap) {
            block.setAttribute('data-scene-writer-check-json', '');
            sceneWriterCheckWrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка Scene Writer</strong> <span class="rewrite-scene-writer-check__wait">в процессе...</span></div>';
        }
        if (stageKey === 'scene_writer_live' && sceneMediaCheckWrap) {
            block.setAttribute('data-scene-media-check-json', '');
            sceneMediaCheckWrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка Scene Writer Live</strong> <span class="rewrite-scene-writer-check__wait">в процессе...</span></div>';
        }
        if (stageKey === 'structure_splitter' && structureSplitterCheckWrap) {
            block.setAttribute('data-structure-splitter-check-json', '');
            structureSplitterCheckWrap.innerHTML = '<div class="rewrite-scene-writer-check__head"><strong>Проверка Structure Splitter</strong> <span class="rewrite-scene-writer-check__wait">в процессе...</span></div>';
        }
        var doCancelForCurrentTask = function () {
            if (currentTaskId) {
                try {
                    fetch(rewriteTaskCancelUrl(currentTaskId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                } catch (_) {}
            }
            if (localAbortController) {
                localAbortController.abort();
            } else if (pipelineAbortController) {
                pipelineAbortController.abort();
            }
        };
        setStageStatusUi(
            block,
            attachMode ? 'Подключаюсь к фоновой задаче… (0s)' : 'В очереди OpenAI… (0s)',
            true,
            doCancelForCurrentTask
        );
        if (manageBusy) setBusy(true);
        if (resTextarea) {
            resTextarea.classList.add('rewrite-stage-result--busy');
            resTextarea.classList.remove('rewrite-stage-result--error');
            updateResultCounts(block);
        }
        syncStageRunButtons();
        try {
            if (!attachMode) {
                if (pipelineStatusForward) {
                    pipelineStatusForward('[' + stageKey + '] запрос: сбор снимка формы и POST /run/start…');
                }
                const snap = collectSnapshot();
                const startResp = await fetch(runStartUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(Object.assign({ stage: stageKey }, snap)),
                    signal: signal
                });
                var startData = null;
                try { startData = await startResp.json(); } catch (_) { startData = null; }
                if (!startResp.ok || !startData || !startData.ok || !startData.task || !startData.task.task_id) {
                    var startErr = (startData && (startData.error || startData.message)) || ('HTTP ' + startResp.status);
                    var diag = 'HTTP ' + startResp.status + ' ' + (startResp.statusText || '') + ' · stage=' + JSON.stringify(stageKey);
                    if (pipelineStatusForward) {
                        pipelineStatusForward('[' + stageKey + '] /run/start не принят сервером: ' + startErr + ' (' + diag + ')');
                    }
                    showStageError(block, 'Не удалось запустить задачу: ' + startErr + ' (' + diag + ')');
                    streamError = true;
                    return false;
                }
                currentTaskId = startData.task.task_id;
                attachSinceSeq = -1;
                if (pipelineStatusForward) {
                    pipelineStatusForward('[' + stageKey + '] фоновая задача запущена: ' + currentTaskId + ', подписываюсь на /tasks/.../events …');
                }
            } else {
                currentTaskId = attachTaskIdInitial;
                if (pipelineStatusForward) {
                    pipelineStatusForward('[' + stageKey + '] re-attach к фоновой задаче ' + currentTaskId + ' (since=' + attachSinceSeq + ')…');
                }
            }
            // Update cancel handler now that we know the task_id.
            setStageStatusUi(
                block,
                attachMode ? 'Подключение к задаче…' : 'В очереди OpenAI… (0s)',
                true,
                doCancelForCurrentTask
            );
            const res = await fetch(rewriteTaskEventsUrl(currentTaskId, attachSinceSeq), {
                method: 'GET',
                headers: { 'Accept': 'application/x-ndjson' },
                signal: signal
            });
            if (pipelineStatusForward) {
                pipelineStatusForward('[' + stageKey + '] events HTTP ' + res.status + ' ' + res.statusText + ', чтение NDJSON…');
            }
            reader = res.body && res.body.getReader();
            if (!reader) {
                showStageError(block, 'Браузер не поддерживает потоковое чтение ответа.');
                streamError = true;
                return false;
            }
            const dec = new TextDecoder();
            let buf = '';
            const useOpenAIStreamUi = (stageKey === 'draft1' || stageKey === 'author');
            let streamBuf = '';
            var lastDeltaLog = 0;
            while (true) {
                var chunk;
                try {
                    chunk = await reader.read();
                } catch (readErr) {
                    if (readErr && readErr.name === 'AbortError') {
                        streamError = true;
                        break;
                    }
                    throw readErr;
                }
                if (chunk.done) break;
                buf += dec.decode(chunk.value, { stream: true });
                let i;
                while ((i = buf.indexOf('\n')) >= 0) {
                    const line = buf.slice(0, i).trim();
                    buf = buf.slice(i + 1);
                    if (!line) continue;
                    let ev;
                    try {
                        ev = JSON.parse(line);
                    } catch (e) {
                        if (!useOpenAIStreamUi || streamBuf.length === 0) {
                            pushStageStatus(block, 'Строка JSON не разобрана: ' + line.slice(0, 80));
                        } else if (pipelineStatusForward) {
                            pipelineStatusForward('[' + stageKey + '] строка не JSON в потоке: ' + line.slice(0, 80));
                        }
                        continue;
                    }
                    if (ev.type === 'status' && ev.message) {
                        if (!useOpenAIStreamUi || streamBuf.length === 0) {
                            pushStageStatus(block, ev.message);
                        } else if (pipelineStatusForward) {
                            pipelineStatusForward('[' + stageKey + '] ' + ev.message);
                        }
                    } else if (ev.type === 'delta' && typeof ev.content === 'string') {
                        streamBuf += ev.content;
                        if (resTextarea) {
                            resTextarea.value = streamBuf;
                            resTextarea.classList.add('rewrite-stage-result--busy');
                            resTextarea.scrollTop = resTextarea.scrollHeight;
                        }
                        updateResultCounts(block);
                        if (pipelineStatusForward && useOpenAIStreamUi) {
                            var now = Date.now();
                            if (now - lastDeltaLog > 1500) {
                                lastDeltaLog = now;
                                pipelineStatusForward('[' + stageKey + '] поток токенов: накоплено ' + streamBuf.length + ' симв.…');
                            }
                        }
                    } else if (ev.type === 'error' && ev.message) {
                        streamError = true;
                        if (pipelineStatusForward) {
                            pipelineStatusForward('[' + stageKey + '] событие error в потоке: ' + ev.message);
                        }
                        if (streamBuf.length > 0 && resTextarea) {
                            resTextarea.value = streamBuf + '\n\n--- Ошибка ---\n' + ev.message;
                            resTextarea.classList.remove('rewrite-stage-result--busy');
                            resTextarea.classList.add('rewrite-stage-result--error');
                            clearStageStatusUi(block);
                            if (resultBadge) {
                                resultBadge.textContent = 'Result: Pending';
                                resultBadge.classList.remove('badge-yes');
                                resultBadge.classList.add('badge-no');
                            }
                            updateResultCounts(block);
                            syncStageRunButtons();
                        } else {
                            showStageError(block, ev.message);
                        }
                    } else if (ev.type === 'scene_writer_check' && stageKey === 'scene_writer') {
                        block.setAttribute('data-scene-writer-check-json', JSON.stringify(ev));
                        renderSceneWriterCheck(block, ev);
                    } else if (ev.type === 'scene_writer_live_check' && stageKey === 'scene_writer_live') {
                        block.setAttribute('data-scene-media-check-json', JSON.stringify(ev));
                        renderSceneMediaCheck(block, ev);
                    } else if (ev.type === 'structure_splitter_check' && stageKey === 'structure_splitter') {
                        block.setAttribute('data-structure-splitter-check-json', JSON.stringify(ev));
                        renderStructureSplitterCheck(block, ev);
                    } else if (ev.type === 'result' && typeof ev.content === 'string') {
                        gotFinalResult = true;
                        var resultContent = ev.content;
                        if (stageKey === 'scene_writer') {
                            var pastEl = block.querySelector('.rewrite-stage-past-prompt');
                            var pastVal = pastEl ? (pastEl.value || '') : '';
                            resultContent = injectPastPromptIntoSceneWriterResult(resultContent, pastVal);
                        }
                        if (pipelineStatusForward) {
                            pipelineStatusForward('[' + stageKey + '] событие result: длина текста ' + resultContent.length + ' симв.');
                        }
                        if (resTextarea) {
                            resTextarea.value = resultContent;
                            resTextarea.classList.remove('rewrite-stage-result--busy');
                            resTextarea.classList.remove('rewrite-stage-result--error');
                        }
                        clearStageStatusUi(block);
                        if (resultBadge) {
                            resultBadge.textContent = 'Result: DONE';
                            resultBadge.classList.remove('badge-no');
                            resultBadge.classList.add('badge-yes');
                        }
                        updateResultCounts(block);
                        renderEditorCheck(block);
                        if (stageKey === 'youtube_packaging') {
                            renderYoutubePackagingPreview(block);
                        }
                        // После завершения Voiceover Editor — обновить «Итоговый текст»
                        // и сбросить перевод. Программное resTextarea.value не дёргает
                        // input event, поэтому зовём напрямую.
                        if (stageKey === 'voiceover_editor' && typeof window.__rewriteRefreshVoiceoverFinal === 'function') {
                            try { window.__rewriteRefreshVoiceoverFinal(); } catch (_) {}
                        }
                        syncStageRunButtons();
                    }
                }
            }
            var userAborted = signal && signal.aborted;
            if (userAborted && pipelineStatusForward) {
                pipelineStatusForward('[' + stageKey + '] запрос прерван (AbortController).');
            }
            if (pipelineStatusForward && !userAborted) {
                pipelineStatusForward('[' + stageKey + '] поток завершён (reader done), итог: ' + (gotFinalResult ? 'есть result' : 'без result') + (streamError ? ', были ошибки' : ''));
            }
            if (userAborted && resTextarea && !gotFinalResult) {
                if (reader) {
                    try { await reader.cancel(); } catch (_) {}
                }
                resTextarea.value = savedBeforeRun;
                resTextarea.classList.remove('rewrite-stage-result--busy');
                resTextarea.classList.remove('rewrite-stage-result--error');
                clearStageStatusUi(block);
                updateResultCounts(block);
                syncStageRunButtons();
                return false;
            }
            if (!gotFinalResult && resTextarea && !streamError) {
                if (useOpenAIStreamUi && streamBuf.length > 0) {
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                    syncStageRunButtons();
                } else {
                    resTextarea.value = savedBeforeRun;
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                    syncStageRunButtons();
                }
            }
            if (gotFinalResult) {
                if (pipelineStatusForward) pipelineStatusForward('[' + stageKey + '] сохранение проекта на сервер…');
                await saveToServer();
                if (stageKey === 'draft1' || stageKey === 'block_writer') {
                    await refreshBlockWriterCheck(block);
                }
                stageSuccess = true;
                if (pipelineStatusForward) pipelineStatusForward('[' + stageKey + '] сохранение завершено.');
            }
            return stageSuccess;
        } catch (e) {
            if (e && e.name === 'AbortError') {
                if (reader) {
                    try { reader.cancel(); } catch (_) {}
                }
                if (resTextarea && !gotFinalResult) {
                    resTextarea.value = savedBeforeRun;
                    resTextarea.classList.remove('rewrite-stage-result--busy');
                    resTextarea.classList.remove('rewrite-stage-result--error');
                    clearStageStatusUi(block);
                    updateResultCounts(block);
                }
                syncStageRunButtons();
                if (pipelineStatusForward) {
                    pipelineStatusForward('[' + stageKey + '] отмена до/во время запроса (AbortError).');
                }
                return false;
            }
            showStageError(block, String(e));
            streamError = true;
            return false;
        } finally {
            block.removeAttribute('data-run-started-at');
            block._rewriteStageCancelHandler = null;
            if (!stageSuccess) {
                clearStageStatusUi(block);
            }
            if (manageBusy) setBusy(false);
        }
    }

    async function runAllStagesPipeline() {
        if (!openaiOk) {
            alert('Ключ OpenAI не задан — конвейер недоступен.');
            return;
        }
        const cards = Array.from(document.querySelectorAll('.rewrite-stage-card'));
        const byKey = {};
        cards.forEach(function (c) {
            var k = c.getAttribute('data-stage-key');
            if (k) byKey[k] = c;
        });
        // Порядок этапов берём по текущему пресету (Глубокий / Мягкий), а не по
        // общему REWRITE_STAGES — иначе в Soft мы бы пытались запустить, например,
        // analysis/structure/draft1, которые не нужны в этом пресете.
        var presetOrder = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[currentRewritePreset])
            ? REWRITE_PRESET_STAGE_KEYS[currentRewritePreset].slice()
            : STAGE_KEYS_ORDER.slice();
        var presetLabel = (REWRITE_PRESET_LABELS && REWRITE_PRESET_LABELS[currentRewritePreset]) || currentRewritePreset;
        if (pipelineLogEl) pipelineLogEl.textContent = '';
        pipelineAbortController = new AbortController();
        var signal = pipelineAbortController.signal;
        pipelineStatusForward = function (msg) { appendPipelineRunnerLog(msg); };
        pipelineRunActive = true;
        syncPipelineStopButton();
        setBusy(true);
        try {
            appendPipelineRunnerLog('══ Конвейер «' + presetLabel + '»: ' + presetOrder.length + ' этапов по порядку ══');
            var allOk = true;
            for (var i = 0; i < presetOrder.length; i++) {
                if (signal.aborted) {
                    appendPipelineRunnerLog('✖ Конвейер остановлен (кнопка «Остановить»).');
                    allOk = false;
                    break;
                }
                var sk = presetOrder[i];
                var block = byKey[sk];
                var label = STAGE_LABELS[sk] || sk;
                appendPipelineRunnerLog('────────────────────────────────────────');
                appendPipelineRunnerLog('▶ Шаг ' + (i + 1) + '/' + presetOrder.length + ': «' + label + '» (' + sk + ')');
                if (!block) {
                    appendPipelineRunnerLog('✖ Карточка этапа не найдена в DOM.');
                    allOk = false;
                    break;
                }
                // Если у этапа уже есть сохранённый Result (textarea не пустая),
                // пропускаем его — иначе после перезапуска сервиса / отвалившегося
                // /run/start пайплайн перезапускал бы всю цепочку и жёг токены.
                var existingResEl = block.querySelector('.rewrite-stage-result');
                var existingRes = existingResEl ? (existingResEl.value || '').trim() : '';
                if (existingRes) {
                    appendPipelineRunnerLog('• Пропуск: у этапа уже есть Result (' + existingRes.length + ' симв.) — повторный запуск не нужен.');
                    continue;
                }
                if (sk === 'inbox') {
                    appendPipelineRunnerLog('✖ Inbox пустой. Вставьте готовый текст в Result и запустите ещё раз.');
                    allOk = false;
                    break;
                }
                var ok = await runStage(sk, block, { manageBusy: false, signal: signal });
                if (signal.aborted) {
                    appendPipelineRunnerLog('✖ Конвейер остановлен (кнопка «Остановить»).');
                    allOk = false;
                    break;
                }
                if (!ok) {
                    appendPipelineRunnerLog('✖ Этап не завершён успешно — конвейер остановлен.');
                    allOk = false;
                    break;
                }
                appendPipelineRunnerLog('✓ Этап «' + label + '» выполнен, данные записаны.');
            }
            if (allOk) {
                appendPipelineRunnerLog('══ Все этапы конвейера завершены успешно ══');
            }
        } catch (e) {
            appendPipelineRunnerLog('✖ Исключение: ' + String(e));
        } finally {
            pipelineStatusForward = null;
            pipelineAbortController = null;
            pipelineRunActive = false;
            syncPipelineStopButton();
            setBusy(false);
        }
    }

    function parseContentDispositionFilename(cd) {
        if (!cd) return null;
        var star = cd.match(/filename\*=(?:UTF-8'')?([^;]+)/i);
        if (star) {
            try {
                return decodeURIComponent(star[1].trim().replace(/^["']|["']$/g, ''));
            } catch (e) { /* ignore */ }
        }
        var q = cd.match(/filename="((?:\\.|[^"\\])*)"/);
        if (q) return q[1].replace(/\\"/g, '"');
        var u = cd.match(/filename=([^;\s]+)/);
        if (u) return u[1].trim().replace(/^["']|["']$/g, '');
        return null;
    }

    async function downloadStageApiPayload(stageKey, block) {
        const btn = block.querySelector('.rewrite-stage-api-export');
        if (btn) btn.disabled = true;
        try {
            const r = await fetch(apiPayloadUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ stage: stageKey }, collectSnapshot()))
            });
            var fname = openaiExportRewriteId + '_' + stageKey + '_openai_request.json';
            var cd = r.headers.get('Content-Disposition');
            if (cd) {
                var fromHdr = parseContentDispositionFilename(cd);
                if (fromHdr) {
                    fname = fromHdr;
                }
            }
            if (/\.txt$/i.test(fname)) {
                fname = fname.replace(/\.txt$/i, '.json');
            }
            if (!r.ok) {
                var errData = await r.json().catch(function () { return {}; });
                alert(errData.message || 'Не удалось сформировать запрос');
                return;
            }
            var blob = await r.blob();
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fname;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            alert(String(e));
        } finally {
            syncStageRunButtons();
        }
    }

                            var msg = String((ev && ev.message) || '');
                            if (ev && ev.type === 'status') {
                                setTrStatus(msg);
                            } else if (ev && ev.type === 'error') {
                                hadError = true;
                                setTrStatus('Ошибка: ' + msg);
                            } else if (ev && ev.type === 'result') {
                                translatedText = String(ev.content || '');
                            }
                        }
                    }
                    if (hadError && !translatedText) return;
                    if (ruTa) ruTa.value = translatedText;
                    voiceoverFinalTextRuLocked = true;
                    showTrResultBlock(true);
                    applyVfrLockUI();
                    updateVfrCounts();
                    scheduleAutosave(0);
                } catch (e) {
                    if (e && (e.name === 'AbortError' || String(e).indexOf('aborted') !== -1)) {
                        setTrStatus('Отменено.');
                    } else {
                        setTrStatus('Ошибка сети: ' + String(e));
                    }
                } finally {
                    trAbort = null;
                    if (!hadError) {
                        setTrBusy(false);
                    } else {
                        if (trBtn) trBtn.disabled = !openaiOk;
                        trRunning = false;
                        if (trCancelBtn) trCancelBtn.disabled = true;
                        setTimeout(function () { setTrBusy(false); }, 3500);
                    }
                }
            });
        }
    })();
    document.querySelectorAll('.rewrite-stage-card[data-stage-key="analysis"], .rewrite-stage-card[data-stage-key="architect"], .rewrite-stage-card[data-stage-key="block_writer"], .rewrite-stage-card[data-stage-key="structure"], .rewrite-stage-card[data-stage-key="draft1"], .rewrite-stage-card[data-stage-key="retention_editor"], .rewrite-stage-card[data-stage-key="hook_editor"], .rewrite-stage-card[data-stage-key="flow_editor"], .rewrite-stage-card[data-stage-key="persona_editor"], .rewrite-stage-card[data-stage-key="voiceover_editor"], .rewrite-stage-card[data-stage-key="title_strategist"], .rewrite-stage-card[data-stage-key="scene_writer_live"]').forEach(function (block) {

    document.querySelectorAll('.rewrite-stage-target-range').forEach(function (el) {

    (function initGlobalModelDropdown() {
        var field = document.querySelector('[data-global-model-field="1"]');
        var select = document.getElementById('rewrite-global-model');
        if (!field || !select) return;
        var btn = field.querySelector('.rewrite-anim-dropdown__btn');
        var panel = field.querySelector('.rewrite-anim-dropdown__panel');
        function syncSelectFromRadios() {
            var checked = field.querySelector('input.rewrite-global-model-radio:checked');
            if (checked) select.value = checked.value;
        }
        function updateBtnLabel() {
            var lbl = field.querySelector('[data-global-model-label]');
            var checked = field.querySelector('input.rewrite-global-model-radio:checked');
            if (!lbl || !checked) return;
            var lab = checked.closest('label');
            var title = lab ? lab.querySelector('.rewrite-anim-option__title') : null;
            lbl.textContent = title ? String(title.textContent || '').trim() : String(checked.value || '');
        }
        function closePanel() {
            if (panel) panel.hidden = true;
            if (btn) btn.setAttribute('aria-expanded', 'false');
        }
        function closeAllPanelsExcept(except) {
            document.querySelectorAll('.rewrite-anim-dropdown__panel').forEach(function (p) {
                if (p === except) return;
                p.hidden = true;
                var b = p.parentElement && p.parentElement.querySelector('.rewrite-anim-dropdown__btn');
                if (b) b.setAttribute('aria-expanded', 'false');
            });
        }
        syncSelectFromRadios();
        updateBtnLabel();
        if (btn && panel) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                var open = !panel.hidden;
                if (open) {
                    closePanel();
                } else {
                    closeAllPanelsExcept(panel);
                    panel.hidden = false;
                    btn.setAttribute('aria-expanded', 'true');
                }
            });
        }
        field.querySelectorAll('input.rewrite-global-model-radio').forEach(function (rb) {
            rb.addEventListener('change', function () {
                syncSelectFromRadios();
                updateBtnLabel();
                closePanel();
                scheduleAutosave(0);
            });
        });
    })();

    (function initRewritePipelineStageCollapse() {
        function loadCollapseStoreAll() {
            try {
                var raw = localStorage.getItem(REWRITE_STAGE_COLLAPSE_LS);
                var o = raw ? JSON.parse(raw) : {};
                return (o && typeof o === 'object') ? o : {};
            } catch (e) {
                return {};
            }
        }
        function saveCollapseStoreAll(all) {
            try {
                localStorage.setItem(REWRITE_STAGE_COLLAPSE_LS, JSON.stringify(all || {}));
            } catch (e) {}
        }
        function loadProjectCollapseMap() {
            var all = loadCollapseStoreAll();
            var m = all[rewriteIdForStageCollapse];
            return (m && typeof m === 'object') ? m : {};
        }
        function saveProjectCollapseMap(map) {
            var all = loadCollapseStoreAll();
            all[rewriteIdForStageCollapse] = map;
            saveCollapseStoreAll(all);
        }
        function applyCardCollapsed(card, collapsed) {
            card.classList.toggle('rewrite-stage-card--body-collapsed', !!collapsed);
            if (card.getAttribute('data-extra-collapse') === '1') {
                card.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            }
        }
        function setAllCollapsed(collapsed) {
            var map = loadProjectCollapseMap();
            COLLAPSIBLE_PIPELINE_STAGE_KEYS.forEach(function (sk) { map[sk] = !!collapsed; });
            saveProjectCollapseMap(map);
            document.querySelectorAll('.rewrite-stage-card[data-pipeline-collapse="1"]').forEach(function (card) {
                applyCardCollapsed(card, !!collapsed);
            });
        }
        // Экспонируем наружу — нужно, чтобы переключение пресета могло
        // принудительно свернуть верхние этапы нового пресета.
        window.__rewriteSetAllCollapsed = setAllCollapsed;
        var collapseAllBtn = document.getElementById('rewrite-stages-collapse-all-btn');
        var expandAllBtn = document.getElementById('rewrite-stages-expand-all-btn');
        if (collapseAllBtn) collapseAllBtn.addEventListener('click', function () { setAllCollapsed(true); });
        if (expandAllBtn) expandAllBtn.addEventListener('click', function () { setAllCollapsed(false); });

        var saved = loadProjectCollapseMap();
        document.querySelectorAll('.rewrite-stage-card.rewrite-stage-card--collapsible').forEach(function (card) {
            var sk = card.getAttribute('data-stage-key') || '';
            var collapsed = Object.prototype.hasOwnProperty.call(saved, sk) ? !!saved[sk] : true;
            applyCardCollapsed(card, collapsed);
        });

        document.querySelectorAll('.rewrite-stage-card[data-extra-collapse="1"]').forEach(function (card) {
            var hdr = card.querySelector('.scene-header');
            if (!hdr) return;
            hdr.setAttribute('title', 'Нажмите, чтобы развернуть или свернуть блок');
            hdr.style.cursor = 'pointer';
            hdr.addEventListener('click', function (e) {
                if (e.target.closest('.rewrite-stage-header-tools')) return;
                var sk = card.getAttribute('data-stage-key') || '';
                if (!sk) return;
                var cur = card.classList.contains('rewrite-stage-card--body-collapsed');
                var next = !cur;
                var map = loadProjectCollapseMap();
                map[sk] = next;
                saveProjectCollapseMap(map);
                applyCardCollapsed(card, next);
            });
        });
    })();

    // --- Browser-independent task reattach ----------------------------------
    // На загрузке страницы: спрашиваем сервер, есть ли активные фоновые задачи
    // для этого проекта (например, пользователь нажал Run и закрыл/обновил вкладку).
    // Для каждой активной задачи находим карточку этапа и подключаемся к её
    // event-стриму с самого начала (since=-1), чтобы получить весь лог + live tail.
    (async function reattachActiveTasksOnLoad() {
        if (!tasksActiveUrl) return;
        try {
            var resp = await fetch(tasksActiveUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            if (!resp.ok) return;
            var data = await resp.json();
            if (!data || !data.ok || !Array.isArray(data.tasks) || data.tasks.length === 0) return;
            data.tasks.forEach(function (t) {
                if (!t || t.kind !== 'stage' || !t.task_id || !t.ref_id) return;
                var stageKey = String(t.ref_id || '').trim();
                if (!stageKey) return;
                var card = document.querySelector('.rewrite-stage-card[data-stage-key="' + stageKey + '"]');
                if (!card) return;
                if (card.getAttribute('data-run-started-at')) return;
                console.log('[rewrite] re-attaching to background task', t.task_id, 'for stage', stageKey);
                runStage(stageKey, card, { manageBusy: false, attachTask: { task_id: t.task_id, since_seq: -1 } })
                    .catch(function (e) { console.warn('[rewrite] reattach failed for', stageKey, e); });
            });
        } catch (e) {
            console.warn('[rewrite] reattach query failed:', e);
        }
    })();

    // --- Rewrite preset toggle (Глубокий / Мягкий) --------------------------
    // Скрываем карточки, не входящие в выбранный пресет; обновляем заголовок
    // bar'а «Свернуть/Развернуть все» и список COLLAPSIBLE_PIPELINE_STAGE_KEYS,
    // чтобы кнопки сворачивали именно «первые 10» текущего пресета. Сохраняем
    // выбор пользователя через общий saveToServer (поле rewrite_preset).
    function applyRewritePresetVisibility(preset) {
        var presetKeys = (REWRITE_PRESET_STAGE_KEYS && REWRITE_PRESET_STAGE_KEYS[preset]) || [];
        var presetSet = {};
        presetKeys.forEach(function (k) { presetSet[k] = true; });
        var indexByKey = {};
        presetKeys.forEach(function (k, i) { indexByKey[k] = i + 1; });
        document.querySelectorAll('.rewrite-stage-card').forEach(function (card) {
            var key = card.getAttribute('data-stage-key') || '';
            if (!key) return;
            var inPreset = !!presetSet[key];
            card.classList.toggle('rewrite-stage-card--hidden-by-preset', !inPreset);
            // Пересчёт нумерации этапа: в пределах текущего пресета.
            var idxEl = card.querySelector('.rewrite-stage-index');
            if (idxEl && inPreset) {
                var n = indexByKey[key];
                idxEl.textContent = String(n);
                idxEl.setAttribute('aria-label', 'Этап ' + n);
                idxEl.setAttribute('data-stage-display-index', String(n));
            }
        });
        // collapsible_pipeline_stages: до 10 этапов с начала пресета, без scene_writer / scene_writer_live
        // (см. server-side комментарий у ns_col — иначе SW попадает под массовое сворачивание).
        COLLAPSIBLE_PIPELINE_STAGE_KEYS = [];
        for (var pi = 0; pi < presetKeys.length && COLLAPSIBLE_PIPELINE_STAGE_KEYS.length < 10; pi++) {
            var pk = presetKeys[pi];
            if (pk === 'scene_writer' || pk === 'scene_writer_live') continue;
            COLLAPSIBLE_PIPELINE_STAGE_KEYS.push(pk);
        }
        var label = document.getElementById('rewrite-stages-collapse-bar-label');
        if (label) {
            label.textContent = 'Этапы 1–' + COLLAPSIBLE_PIPELINE_STAGE_KEYS.length;
        }
        // На карточках в выбранных «верхних 10» проставим атрибут data-pipeline-collapse=1
        // — он используется setAllCollapsed для массового сворачивания. В первоначальном
        // server-render это уже сделано для текущего пресета; при переключении пересчитываем.
        document.querySelectorAll('.rewrite-stage-card').forEach(function (card) {
            var key = card.getAttribute('data-stage-key') || '';
            if (COLLAPSIBLE_PIPELINE_STAGE_KEYS.indexOf(key) >= 0) {
                card.setAttribute('data-pipeline-collapse', '1');
            } else {
                card.removeAttribute('data-pipeline-collapse');
            }
            if (key === 'scene_writer') {
                card.classList.remove('rewrite-stage-card--body-collapsed');
            }
            // Если этап выпал из видимого пресета, не оставляем его в "свёрнутом"
            // состоянии — иначе при возврате он откроется уже схлопнутым визуально.
            if (!presetSet[key]) {
                card.classList.remove('rewrite-stage-card--body-collapsed');
            }
        });
    }
    function syncPresetToggleButtonsUI(preset) {
        document.querySelectorAll('.rewrite-preset-toggle__btn').forEach(function (btn) {
            var p = btn.getAttribute('data-rewrite-preset') || '';
            btn.classList.toggle('rewrite-preset-toggle__btn--active', p === preset);
        });
        var wrap = document.querySelector('.rewrite-preset-toggle');
        if (wrap) wrap.setAttribute('data-rewrite-preset-current', preset);
    }
    (function bindRewritePresetToggle() {
        var buttons = document.querySelectorAll('.rewrite-preset-toggle__btn');
        if (!buttons.length) return;
        buttons.forEach(function (btn) {
            btn.addEventListener('click', async function () {
                var preset = btn.getAttribute('data-rewrite-preset') || 'deep';
                if (preset === currentRewritePreset) return;
                currentRewritePreset = preset;
                syncPresetToggleButtonsUI(preset);
                applyRewritePresetVisibility(preset);
                // По умолчанию сворачиваем верхние этапы нового пресета — иначе
                // после переключения видна полная простыня раскрытых карточек,
                // даже если в прошлом пресете их сворачивали.
                if (typeof window.__rewriteSetAllCollapsed === 'function') {
                    try { window.__rewriteSetAllCollapsed(true); } catch (_) { /* ignore */ }
                }
                // Пересчитать кнопки запуска по новому пресету (иначе крестики
                // остаются от логики предыдущего пресета).
                try { syncStageRunButtons(); } catch (_) { /* ignore */ }
                try { await saveToServer(); } catch (e) {
                    console.warn('[rewrite] preset save failed:', e);
                }
            });
        });
        // На случай рассинхрона server-side и runtime — применяем актуальный preset
        // сразу: подтянет visibility и label на старте.
        applyRewritePresetVisibility(currentRewritePreset);
        syncPresetToggleButtonsUI(currentRewritePreset);
        try { syncStageRunButtons(); } catch (_) { /* ignore */ }
    })();
})();
