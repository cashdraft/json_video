{# Подключение style.css + минимальный fallback, если файл не загрузился (404 у /static/, другой корень). #}
{# Переопределение: в .env задайте STATIC_STYLE_HREF=полный или корневой URL к style.css #}
<style>
/* Минимальный fallback, если основной CSS не применился */
html { background: #1a1a1e; color: #e8e8ec; }
body { margin: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.5; }
body .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
</style>
<link rel="stylesheet" href="{{ config.STATIC_STYLE_HREF or url_for('static', filename='style.css') }}">
